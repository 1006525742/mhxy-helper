# ===== mhxy 访问统计 · 公网收集（仅接收埋点，看板仍仅本机） =====
# 用途：让经 yjmhxy.top 访问网站的公网用户，其埋点也能被统计。
# 加进 VPS(117.72.108.169) 上处理站点 /api/* 的 server 块内，与现有 /api/othello、/api/baotu 等并列。
#
# 前置条件（见 frpc_analytics.ini）：Mac 端 frpc.ini 需新增 [mhxy-analytics] 段，
# 把 remote_port = 18014 映射到本机 127.0.0.1:8014；下面 proxy_pass 端口须与之相同。
#
# 安全：只放行 POST /api/analytics/track（埋点上报），拒绝任何读取统计的请求，
#       看板与 /api/stats 永远只在本机 127.0.0.1:8014 可达。
location = /api/analytics/track {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:18014;   # 改成 frpc 隧道在 VPS 侧对应的本地监听端口（与 frpc remote_port 一致）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
