Global:
  model_name: PP-OCRv6_medium_rec
Hpi:
  backend_configs:
    paddle_infer:
      trt_dynamic_shapes: &id001
        x:
        - - 1
          - 3
          - 48
          - 160
        - - 1
          - 3
          - 48
          - 320
        - - 8
          - 3
          - 48
          - 3200
    tensorrt:
      dynamic_shapes: *id001
PreProcess:
  transform_ops:
  - DecodeImage:
      channel_first: false
      img_mode: BGR
  - MultiLabelEncode:
      gtc_encode: NRTRLabelEncode
  - RecResizeImg:
      image_shape:
      - 3
      - 48
      - 320
  - KeepKeys:
      keep_keys:
      - image
      - label_ctc
      - label_gtc
      - length
      - valid_ratio
PostProcess:
  name: CTCLabelDecode
  character_dict:
  - 五
  - 傲
  - 儿
  - 南
  - 唐
  - 国
  - 城
  - 境
  - 外
  - 大
  - 女
  - 宝
  - 寿
  - 山
  - 庄
  - 建
  - 普
  - 朱
  - 村
  - 来
  - 梁
  - 江
  - 紫
  - 西
