<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科举识题 - 泰迪熊工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #0a0d12 0%, #0b0e14 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            color: #fff;
            min-height: 100vh;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(15, 18, 25, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 1388px;
            margin: 0 auto;
        }
        .navbar h1 { font-size: 18px; color: #67c1f5; }
        .navbar a { color: #8f98a0; text-decoration: none; font-size: 14px; }
        .navbar a:hover { color: #fff; }

        /* 主布局 */
        .main { display: flex; gap: 12px; max-width: 1388px; margin: 12px auto; padding: 0 12px; height: calc(100vh - 110px); }
        .left-panel {
            width: 320px;
            padding: 0;
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .right-panel { flex: 1; min-width: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #1a1f2e; border: 1px solid #2a3040; border-radius: 8px; }

        /* 左侧监控竖条（与挖图/抓鬼一致） */
        .monitor-rail {
            position: fixed; left: 0; top: 50%; transform: translateY(-50%);
            z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px;
            width: 26px; padding: 12px 4px; cursor: pointer; user-select: none;
            background: #1a1f2e; border: 1px solid #2a3040; border-left: none; border-radius: 0 8px 8px 0;
        }
        .monitor-rail:hover { background: rgba(255,255,255,0.07); border-color: #67c1f5; }
        .monitor-rail.active { border-color: #FFD700; box-shadow: 0 0 0 1px rgba(255,215,0,0.3); }
        .rail-dot { width: 9px; height: 9px; border-radius: 50%; background: #888; flex-shrink: 0; }
        .monitor-rail.active .rail-dot { background: #ff4d4f; box-shadow: 0 0 8px #ff4d4f; animation: pulse 1s infinite; }
        .rail-label { writing-mode: vertical-rl; text-orientation: upright; font-size: 11px; letter-spacing: 2px; color: #888; }
        .monitor-rail.active .rail-label { color: #FFD700; }
        .rail-actions { position: fixed; left: 32px; top: 50%; transform: translateY(-50%); z-index: 60; display: none; flex-direction: column; gap: 4px; }
        .mini-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #2a3040; background: #1a1f2e; color: #67c1f5; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .mini-btn:hover { background: rgba(255,255,255,0.07); border-color: #67c1f5; }

        /* 左边栏三个状态框高度一致 */
        .status-box {
            height: 140px;
            padding: 20px;
            border-radius: 8px;
            background: #1a1f2e;
            border: 2px solid #2a3040;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .status-box.active { border-color: #FFD700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .status-box.success { border-color: #4caf50; }

        /* 监控状态 */
        .monitor-status {
            text-align: center;
            width: 100%;
        }
        .monitor-status .icon { font-size: 48px; margin-bottom: 12px; }
        .monitor-status .text { color: #8f98a0; font-size: 14px; }
        .monitor-status.active .text { color: #FFD700; }
        .monitor-status.success .text { color: #4caf50; }

        /* 控制按钮框 */
        .control-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        /* 检测状态框 */
        .detect-info-box {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }
        .detect-info-box.hidden { display: none; }
        .detect-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .detect-badge.yes { background: rgba(76,175,80,0.15); color: #4caf50; }
        .detect-badge.no { background: rgba(244,67,54,0.15); color: #f44336; }

        /* 按钮 */
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, #1a9fff, #67c1f5); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #b71c1c, #c62828); color: #eee; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #c7d5e0; border: 1px solid rgba(255,255,255,0.1); }

        /* 截图结果 */
        .result-panel {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 12px;
            display: none;
        }
        .result-panel.active { display: block; }

        /* 答案题目合一框 - 左右结构，固定高度防止图片位移 */
        .result-box {
            background: #1a1f2e;
            border: 2px solid #2a3040;
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 12px;
            height: 200px;          /* 加高以容纳多行题目 */
            overflow: hidden;       /* 超出部分隐藏 */
            flex-shrink: 0;         /* 不被压缩 */
            max-width: 100%;        /* 不超过父容器宽度 */
            min-width: 0;           /* 允许 flex 子项缩小 */
        }
        .result-box .answer-col {
            flex: 0 0 160px;
            text-align: center;
            padding-right: 20px;
            border-right: 2px solid #4caf50;
            overflow: hidden;
        }
        .result-box .wrong-btn {
            margin-top: 12px;
            width: 100%;
            padding: 6px 0;
            font-size: 13px;
            color: #ffb74d;
            background: transparent;
            border: 1px solid #ffb74d;
            border-radius: 6px;
            cursor: pointer;
            transition: background .15s;
        }
        .result-box .wrong-btn:hover {
            background: rgba(255, 183, 77, 0.15);
        }
        .result-box .wrong-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            border-color: #555;
            color: #555;
        }
        .result-box .answer-label {
            font-size: 14px;
            color: #8f98a0;
            margin-bottom: 8px;
        }
        .result-box .answer {
            font-size: 32px;
            color: #4caf50;
            font-weight: bold;
            white-space: normal;   /* 允许换行 */
            word-break: break-all; /* 中文换行 */
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* 最多两行 */
            -webkit-box-orient: vertical;
            cursor: default;
        }
        .result-box .question-col {
            flex: 1;
            min-width: 0;          /* 允许 flex 子项缩小，否则 nowrap 长文字会撑开布局 */
            overflow: hidden;
        }
        .result-box .question-label {
            font-size: 14px;
            color: #8f98a0;
            margin-bottom: 8px;
        }
        .result-box .question {
            font-size: 20px;
            color: #c7d5e0;
            line-height: 1.6;
            white-space: pre-line;  /* 尊重 \n 换行 + 自动折行 */
            word-break: break-all;  /* 中文自动换行 */
            overflow: hidden;
            cursor: default;       /* 鼠标提示可 hover */
        }
        .result-box .meta {
            font-size: 13px;
            color: #8f98a0;
            margin-top: 8px;
        }

        /* 截图区域 - 固定位置，不受上方文字影响 */
        .result-image {
            position: relative;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            max-width: 650px;
            max-height: 520px;
            min-height: 400px;     /* 保证有足够高度 */
            flex-shrink: 0;        /* 不被压缩 */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result-image img { display: block; max-width: 100%; max-height: 520px; object-fit: contain; border-radius: 6px; }
        .result-image canvas {
            display: none;
            max-width: 100%;
            max-height: 520px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 6px;
            pointer-events: none;
        }

        /* 手动设置正确答案 */
        .manual-override { display: none; margin-top: 12px; padding: 12px; background: #2a1a0a; border: 1px solid #c8932a; border-radius: 8px; }
        .manual-override.active { display: block; }
        .manual-title { font-size: 13px; color: #e8c560; margin-bottom: 8px; text-align: center; }
        .manual-btns { display: flex; gap: 8px; justify-content: center; }
        .manual-btn { padding: 8px 18px; border: 2px solid; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all .15s; background: transparent; }
        .manual-btn:hover { transform: scale(1.08); }
        .manual-btn:active { transform: scale(0.95); }
        .btn-a { color: #ff6b6b; border-color: #ff6b6b; } .btn-a:hover { background: #ff6b6b22; }
        .btn-b { color: #ffd93d; border-color: #ffd93d; } .btn-b:hover { background: #ffd93d22; }
        .btn-c { color: #6bcb77; border-color: #6bcb77; } .btn-c:hover { background: #6bcb7722; }
        .btn-d { color: #4d96ff; border-color: #4d96ff; } .btn-d:hover { background: #4d96ff22; }
        .btn-skip { color: #888; border-color: #555; font-size: 13px; } .btn-skip:hover { background: #555333; }
        .manual-mode { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; color: #d8d8d8; }
        .manual-mode .mode-opt { cursor: pointer; }
        .manual-mode input { vertical-align: middle; margin-right: 4px; }
        .manual-hint { font-size: 11px; color: #8f98a0; margin-top: 6px; text-align:center; }

        /* 历史 */
        .history-section { flex: 1; overflow-y: auto; }
        .history-item { position: relative; background: #1a2030; border: 1px solid #2a3550; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
        .history-item .time { font-size: 11px; color: #6f7b8c; }
        .history-item .q { font-size: 13px; color: #e6e6e6; margin: 2px 0; word-break: break-all; }
        .history-item .a { font-size: 13px; color: #ffd93d; font-weight: bold; }
        .history-fix-btn { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 2px 8px; background: #2a3550; color: #8ab4ff; border: 1px solid #3a4a6a; border-radius: 4px; cursor: pointer; }
        .history-fix-btn:hover { background: #3a4a6a; }
        .history-empty { color: #6f7b8c; font-size: 12px; text-align: center; padding: 20px 0; }

        /* 题库管理弹窗 */
        .cm-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; }
        .cm-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 560px; max-width: 92vw; max-height: 80vh; background: #141a26; border: 1px solid #2a3550; border-radius: 10px; z-index: 1001; display: flex; flex-direction: column; }
        .cm-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #2a3550; font-size: 15px; color: #e6e6e6; }
        .cm-close { background: none; border: none; color: #8f98a0; font-size: 18px; cursor: pointer; }
        .cm-toolbar { display: flex; gap: 10px; align-items: center; padding: 10px 16px; }
        .cm-search { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid #2a3550; background: #0e131c; color: #e6e6e6; font-size: 13px; }
        .cm-count { font-size: 12px; color: #8f98a0; white-space: nowrap; }
        .cm-list { flex: 1; overflow-y: auto; padding: 0 16px 12px; }
        .cm-item { background: #1a2030; border: 1px solid #2a3550; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
        .cm-q { font-size: 13px; color: #e6e6e6; margin-bottom: 4px; word-break: break-all; }
        .cm-a { font-size: 13px; color: #d8d8d8; margin-bottom: 8px; }
        .cm-a b { color: #ffd93d; }
        .cm-mode { font-size: 11px; color: #8ab4ff; margin-left: 6px; padding: 1px 6px; border: 1px solid #3a4a6a; border-radius: 4px; }
        .cm-actions { display: flex; gap: 8px; }
        .cm-actions button { font-size: 12px; padding: 4px 12px; border-radius: 5px; border: 1px solid #3a4a6a; background: #2a3550; color: #e6e6e6; cursor: pointer; }
        .cm-actions button:hover { background: #3a4a6a; }
        .cm-footer { padding: 10px 16px; border-top: 1px solid #2a3550; }
        .cm-empty { color: #6f7b8c; font-size: 13px; text-align: center; padding: 30px 0; }
        .history-item {
            background: #1a1f2e;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #4caf50;
        }
        .history-item .time { font-size: 11px; color: #8f98a0; }
        .history-item .q { font-size: 13px; color: #c7d5e0; margin: 4px 0; }
        .history-item .a { font-size: 14px; color: #4caf50; font-weight: 500; }
    </style>
<style>
.return-home{display:inline-flex;align-items:center;gap:4px;color:#9aa3b2;font-size:13px;padding:6px 12px;border-radius:4px;text-decoration:none;transition:all .2s;background:transparent}
.return-home:hover{color:#fff;background:rgba(255,255,255,.08)}
</style>
</head>
<body>
    <!-- 左侧监控竖条（与挖图/抓鬼一致） -->
    <div class="monitor-rail" id="monitorRail" onclick="toggleKejuRail()" title="点击开始屏幕共享">
        <span class="rail-dot"></span>
        <span class="rail-label" id="railLabel">共享屏幕</span>
    </div>
    <div class="rail-actions" id="railActions">
        <button class="mini-btn" onclick="stopAll()" title="停止共享">✕</button>
    </div>
    <header class="navbar">
        <span style="font-size:24px;">📚</span>
        <h1>科举识题</h1>
        <a href="/" class="return-home">⬅ 返回首页</a>
        <a href="/mhxy/static/questions.html">题库</a>
        <span style="margin-left:auto;color:#8f98a0;">题库: <span id="questionCount">0</span> 题</span>
    </header>

    <div class="main">
        <div class="left-panel">
            <!-- 三个状态框高度一致 -->
            <div class="status-box">
                <div class="monitor-status" id="monitorStatus">
                    <div class="icon">😴</div>
                    <div class="text">等待共享屏幕</div>
                </div>
            </div>

            <div class="status-box">
                <div class="control-box" style="display:flex;flex-direction:column;gap:10px;align-items:center;">
                    <!-- 共享屏幕控件已移至左侧竖条 -->
                    <label class="btn btn-secondary" style="cursor:pointer;">
                        📁 图片测试
                        <input type="file" accept="image/*" style="display:none;" onchange="testImage(event)">
                    </label>
                    <div style="display:flex;gap:8px;margin-top:4px;">
                        <label class="btn btn-secondary" style="cursor:pointer;font-size:12px;padding:6px 10px;">
                            📥 导入
                            <input type="file" accept=".json" style="display:none;" onchange="importHashDB(this.files[0])">
                        </label>
                        <button class="btn btn-secondary" onclick="exportHashDB()" id="exportHashBtn" style="font-size:12px;padding:6px 10px;">
                            📤 导出
                        </button>
                        <button class="btn btn-secondary" onclick="exportManualCorrections()" id="exportCorrectionsBtn" style="font-size:12px;padding:6px 10px;display:none;">
                            📝 导出修正
                        </button>
                        <button class="btn btn-secondary" onclick="openCorrectionManager()" style="font-size:12px;padding:6px 10px;">
                            🗂 题库管理
                        </button>
                    </div>
                    <span style="color:#8f98a0;font-size:11px;">哈希库: <span id="hashDBCount">0</span> 条 | 增量: <span id="hashDBNewCount" style="color:#FFD700;">0</span></span>
                </div>
            </div>

            <div class="status-box" id="detectInfoBox" style="display:none;">
                <div class="detect-info-box" id="detectInfo">
                    <span class="detect-badge" id="badgeT">T: --</span>
                    <span class="detect-badge" id="badgeQ">Q: --</span>
                    <span class="detect-badge" id="badgeA">A: --</span>
                    <span class="detect-badge" id="badgeB">B: --</span>
                    <span class="detect-badge" id="badgeC">C: --</span>
                    <span class="detect-badge" id="badgeD">D: --</span>
                </div>
            </div>

            <!-- 历史记录 -->
            <div class="history-section" id="historySection">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <span style="color:#8f98a0;font-size:12px;">📜 识别历史</span>
                    <button class="btn btn-secondary" onclick="clearHistory()" style="font-size:11px;padding:3px 8px;">清空</button>
                </div>
                <div id="historyList"></div>
            </div>
        </div>

        <div class="right-panel">
            <!-- 最新识别结果 -->
            <div class="result-panel" id="resultPanel">
                <!-- 答案 + 题目 合一框 -->
                <div class="result-box">
                    <div class="answer-col">
                        <div class="answer-label">答案</div>
                        <div class="answer" id="resultAnswer">-</div>
                        <button type="button" onclick="markAnswerWrong()" class="wrong-btn" id="wrongBtn" title="标记本题识别错误，保存截图供后续纠错">⚠ 标记错误</button>
                    </div>
                    <div class="question-col">
                        <div class="question-label">题目</div>
                        <div class="question" id="resultQuestion">-</div>
                        <div class="meta" id="resultMeta">-</div>
                    </div>
                </div>
                <!-- 截图区域 -->
                <div class="result-image">
                    <img id="resultImg" src="" alt="识别截图">
                    <canvas id="resultCanvas"></canvas>
                </div>
                <!-- 手动设置正确答案 -->
                <div id="manualOverride" class="manual-override">
                    <div class="manual-title">⚠️ 请选择正确答案，并指定错误类型：</div>
                    <div class="manual-mode">
                        <label class="mode-opt"><input type="radio" name="corrMode" value="text" checked> 文字错误（答案本身错，将修正题库答案）</label>
                        <label class="mode-opt"><input type="radio" name="corrMode" value="box"> 框选错误（答案对，只是红框位置错）</label>
                    </div>
                    <div class="manual-btns">
                        <button onclick="setManualCorrect('A')" class="manual-btn btn-a">A</button>
                        <button onclick="setManualCorrect('B')" class="manual-btn btn-b">B</button>
                        <button onclick="setManualCorrect('C')" class="manual-btn btn-c">C</button>
                        <button onclick="setManualCorrect('D')" class="manual-btn btn-d">D</button>
                        <button onclick="skipManualCorrect()" class="manual-btn btn-skip">跳过</button>
                    </div>
                    <div id="manualOverrideHint" class="manual-hint"></div>
                </div>
            </div>

            <!-- 占位提示 -->
            <div id="placeholder" style="flex:1;display:flex;align-items:center;justify-content:center;color:#555;">
                <div style="text-align:center;">
                    <div style="font-size:48px;">📖</div>
                    <p>共享屏幕后自动识别科举题目</p>
                    <p style="font-size:12px;margin-top:8px;">或点击「图片测试」上传截图</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 隐藏的 video 用于屏幕共享 -->
    <video id="video" style="display:none;" autoplay muted playsinline></video>

    <script>
        // ========== 配置 ==========
        const MODEL_URL = './models/keju/model.json';
        const KEJU_MODEL_IDB = 'keju-yolo-v1';
        const INPUT_SIZE = 480;
        const CONF_THRESH = 0.15;
        const LABELS = ['T', 'Q', 'A', 'B', 'C', 'D'];

        // ========== 全局变量 ==========
        let model = null;
        let modelReady = false;
        let inputName = 'images';
        let videoStream = null;
        let isDetecting = false;
        let detectTimer = null;
        let lastHash = null;
        let lastQText = null;       // 文本去重：上一帧 OCR 识别出的题目文字
        let lastQResult = null;     // 文本去重：上一帧完整结果 { qText, correctOptionLabel }
        let lastQTimestamp = 0;     // 文本去重：上一帧 OCR 的时间戳
        let lastQHash = null;       // 文本去重：上一帧的 simpleHash，用于区分同题噪点 vs 新题
        let noQuestionMissCount = 0; // 连续未检测到题目的帧数
        let resultFrozen = false;   // 截图冻结标志，true时showResult不重绘
        let resultCooldownUntil = 0; // 结果冷却期：showResult后N秒内跳过扫描，防止答题过渡期间垃圾OCR
        let questions = [];
        let questionChars = [];  // 预计算的字符集
        let history = [];

        // ========== 用户纠错覆盖层 ==========
        // 来自后端 user_corrections.json，作为最高优先级覆盖（内置库 -> 覆盖层 -> localStorage）
        let userCorrections = [];            // 全量列表（供题库管理展示）
        let userCorrectionsByStem = {};      // stemHash -> rec
        let userCorrectionsByNorm = {};      // normQuestion -> rec（文字通道覆盖）

        // 归一化题干：去固定前缀/计数/经验杂讯、去全部空白（与合并脚本一致），用于文字通道匹配 key
        function normQuestionText(raw) {
            let t = raw || '';
            t = t.replace(/\n/g, ' ').replace(/\r/g, ' ');
            const m = t.match(/题目[:：]\s*(.*)/);
            if (m) t = m[1];
            t = t.replace(/^礼部考题[，,]\s*/, '');
            t = t.replace(/已答\d+题[，,]?\s*答对\d+题[。]?/g, '');
            t = t.replace(/答对\d+题/g, '');
            t = t.replace(/你?得到了[:：]?\s*\d+\s*点经验[。]?/g, '');
            t = t.replace(/得到了\s*\d+\s*点经验/g, '');
            t = t.replace(/\s+/g, '').trim();
            return t;
        }

        // ========== 手动修正哈希 ==========
        // 存储结构: { "stemPhash|stemDhash": { label: "C", hashes: {...} } }
        let manualCorrections = {};
        // 当前待修正的状态
        let pendingManualState = null;
        // 最近一次成功识别的检测上下文（供"标记错误"时构造 pendingManualState）
        let lastDetectState = null;

        function loadManualCorrections() {
            try {
                const raw = localStorage.getItem('keju_manual_corrections');
                if (raw) manualCorrections = JSON.parse(raw);
                const count = Object.keys(manualCorrections).length;
                if (count) {
                    console.log(`[Keju] 加载手动修正: ${count} 条`);
                    document.getElementById('exportCorrectionsBtn').style.display = 'inline-block';
                }
            } catch(e) { manualCorrections = {}; }
        }

        function saveManualCorrections() {
            try {
                localStorage.setItem('keju_manual_corrections', JSON.stringify(manualCorrections));
                const count = Object.keys(manualCorrections).length;
                document.getElementById('exportCorrectionsBtn').style.display = count > 0 ? 'inline-block' : 'none';
            } catch(e) { console.warn('[Keju] 保存手动修正失败:', e); }
        }

        // ========== 优化2: OCR 结果 LRU 缓存 ==========
        const ocrCache = new Map();
        const OCR_CACHE_MAX = 100;

        function getCachedOCR(hash) {
            const entry = ocrCache.get(hash);
            if (entry) {
                ocrCache.delete(hash);
                ocrCache.set(hash, entry);
                return entry;
            }
            return null;
        }

        function setCachedOCR(hash, result) {
            if (ocrCache.size >= OCR_CACHE_MAX) {
                const firstKey = ocrCache.keys().next().value;
                ocrCache.delete(firstKey);
            }
            ocrCache.set(hash, result);
        }

        // ========== 优化3: IndexedDB 模型缓存 ==========
        function openIDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('tfjs-models', 1);
                req.onupgradeneeded = (e) => {
                    if (!e.target.result.objectStoreNames.contains('models')) {
                        e.target.result.createObjectStore('models');
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getModelFromIDB() {
            try {
                const db = await openIDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('models', 'readonly');
                    const store = tx.objectStore('models');
                    const getReq = store.get(KEJU_MODEL_IDB);
                    getReq.onsuccess = () => resolve(getReq.result || null);
                    getReq.onerror = () => reject(getReq.error);
                });
            } catch {
                return null;
            }
        }

        async function saveModelToIDB(artifacts) {
            try {
                const db = await openIDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('models', 'readwrite');
                    const store = tx.objectStore('models');
                    store.put({ modelArtifacts: artifacts, timestamp: Date.now() }, KEJU_MODEL_IDB);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                console.warn('[Keju] IndexedDB 保存失败:', e);
            }
        }

        // ========== 优化5: 模型预热 ==========
        async function warmupModel() {
            if (!model) return;
            console.log('[Keju] 模型预热...');
            const dummy = tf.zeros([1, INPUT_SIZE, INPUT_SIZE, 3]);
            const input = {};
            input[inputName] = dummy;
            const result = model.execute(input);
            dummy.dispose();
            if (result.dispose) result.dispose();
            console.log('[Keju] 模型预热完成');
        }

        // ========== 初始化 ==========
        async function init() {
            await loadQuestions();
            await loadModel();
            // 更新哈希库计数
            updateHashDBCounts();
        }

        async function loadModel() {
            if (model && model.executor) {
                console.log('[Keju] 模型已加载，复用');
                return;
            }
            console.log('[Keju] 开始加载模型...');

            try {
                await tf.setBackend('webgl');
                await tf.ready();

                // 优先从 IndexedDB 加载
                const cached = await getModelFromIDB();
                if (cached && cached.modelArtifacts) {
                    console.log('[Keju] IndexedDB 缓存命中');
                    model = await tf.loadGraphModel(tf.io.fromMemory(cached.modelArtifacts));
                } else {
                    console.log('[Keju] 从网络下载模型...');
                    model = await tf.loadGraphModel(MODEL_URL);

                    // 异步保存到 IndexedDB
                    model.save(tf.io.withSaveHandler(async (artifacts) => {
                        await saveModelToIDB(artifacts);
                        console.log('[Keju] 模型已缓存到 IndexedDB');
                        return { modelArtifactsInfo: {} };
                    })).catch(() => {});
                }

                if (model.modelSignature?.inputs) {
                    inputName = Object.keys(model.modelSignature.inputs)[0];
                }

                modelReady = true;
                console.log('[Keju] 模型加载完成, 输入:', inputName);

                // 预热
                await warmupModel();

            } catch (e) {
                console.error('[Keju] 模型加载失败:', e);
            }
        }

        async function loadQuestions() {
            try {
                const resp = await fetch('./question_bank.json');
                questions = await resp.json();
                document.getElementById('questionCount').textContent = questions.length;

                // 优化4: 预计算字符集
                questionChars = questions.map(q => {
                    const text = (q.q || '').replace(/[^一-龥]/g, '');
                    return new Set(text);
                });
                console.log('[Keju] 题库加载完成，预计算', questionChars.length, '题字符集');
            } catch (e) {
                console.error('[Keju] 题库加载失败:', e);
            }
        }

        // ========== 屏幕共享 ==========
        async function startShare() {
            try {
                videoStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = videoStream;
                await video.play();

                updateKejuRail(true);
                document.getElementById('placeholder').style.display = 'none';
                document.getElementById('detectInfoBox').style.display = 'flex';

                updateStatus('active', '🔍 监控中...');
                startDetection();

                videoStream.getVideoTracks()[0].addEventListener('ended', stopAll);
            } catch (e) {
                console.error('[Keju] 屏幕共享失败:', e);
            }
        }

        function stopAll() {
            isDetecting = false;
            if (detectTimer) clearTimeout(detectTimer);
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            updateKejuRail(false);
            document.getElementById('detectInfoBox').style.display = 'none';
            updateStatus('', '😴 等待共享屏幕');
        }

        function updateStatus(state, text) {
            const el = document.getElementById('monitorStatus');
            const box = el.closest('.status-box');
            el.className = 'monitor-status ' + state;
            if (box) box.className = 'status-box ' + state;
            el.innerHTML = `<div class="icon">${state === 'active' ? '🔍' : (state === 'success' ? '✅' : '😴')}</div><div class="text">${text}</div>`;
        }

        // ========== 左侧竖条 ==========
        function toggleKejuRail() { if (!videoStream) startShare(); }
        function updateKejuRail(active) {
            const rail = document.getElementById('monitorRail');
            const label = document.getElementById('railLabel');
            const actions = document.getElementById('railActions');
            if (active) {
                rail.classList.add('active');
                label.textContent = '科举监控·监控中';
                actions.style.display = 'flex';
            } else {
                rail.classList.remove('active');
                label.textContent = '共享屏幕';
                actions.style.display = 'none';
            }
        }

        // ========== 检测循环 ==========
        function startDetection() {
            isDetecting = true;
            detectLoop();
        }

        async function detectLoop() {
            if (!isDetecting || !modelReady) return;

            const video = document.getElementById('video');
            if (!video.videoWidth) {
                detectTimer = setTimeout(detectLoop, 500);
                return;
            }

            // 结果冷却期：showResult后3秒内跳过所有扫描，防止答题过渡期间对已变化屏幕做垃圾OCR
            if (performance.now() < resultCooldownUntil) {
                detectTimer = setTimeout(detectLoop, 300);
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            const t0 = performance.now();
            const dets = await runYOLO(canvas);
            const t1 = performance.now();
            console.log(`[Keju] YOLO: ${(t1-t0).toFixed(0)}ms`);

            const grouped = groupDetection(dets);
            // 保存投影前的原始YOLO选项框，供哈希计算使用（投影框不一致导致哈希对不上）
            const yoloOptions = grouped.options.map(o => ({ ...o }));
            enhanceOptionsWithProjection(canvas, grouped);

            // 更新检测状态
            updateBadges(grouped);

            if (grouped.question) {
                // 稳定性检查
                const hash = simpleHash(canvas, grouped.question);
                if (hash === lastHash) {
                    detectTimer = setTimeout(detectLoop, 300);
                    return;
                }
                lastHash = hash;
                // 屏幕已变化（simpleHash不同），解冻截图允许重绘
                resultFrozen = false;

                // ===== 哈希匹配（主路径）=====
                let hashMatched = null;
                let correctOptionLabel = null;
                let qText = null;
                let stemHashes = null;
                let optionHashes = null;
                let isExactHashMatch = false;

                if (hashDBEntries.length > 0 && grouped.options.length > 0) {
                    const qCanvas = cropRegion(canvas, grouped.question);
                    stemHashes = computeAllHashes(qCanvas);

                    optionHashes = [];
                    // 用原始YOLO框（不用投影框），保证哈希稳定可复现
                    for (const opt of yoloOptions) {
                        const oCanvas = cropRegion(canvas, {
                            x1: Math.max(0, opt.x1 - 5),
                            y1: Math.max(0, opt.y1 - 5),
                            x2: Math.min(canvas.width, opt.x2 + 5),
                            y2: Math.min(canvas.height, opt.y2 + 5)
                        });
                        optionHashes.push({
                            label: opt.label,
                            hashes: computeAllHashes(oCanvas)
                        });
                    }

                        const stemHash = makeStemHash(stemHashes);
                        const exactMatch = hashDB.get(stemHash);
                        if (exactMatch) {
                            hashMatched = exactMatch;
                            qText = exactMatch.questionText;
                            isExactHashMatch = true;
                            console.log('[Keju] 哈希精确匹配:', qText.slice(0, 30), '→', exactMatch.answer?.slice(0, 15));
                        } else {
                            const HASH_THRESHOLD = 0.95;
                            let bestEntry = null, bestScore = 0;
                            for (const entry of hashDBEntries) {
                                const parts = entry.stemHash.split(':');
                                if (parts.length !== 3) continue;
                                const storedHashes = {
                                    gridHash: parts[0],
                                    rowHash: parts[1],
                                    columnHash: parts[2]
                                };
                                const score = combinedHashScore(stemHashes, storedHashes);
                                if (score > bestScore) {
                                    bestScore = score;
                                    bestEntry = entry;
                                }
                            }
                            if (bestEntry && bestScore >= HASH_THRESHOLD) {
                                hashMatched = bestEntry;
                                qText = bestEntry.questionText;
                                console.log('[Keju] 哈希模糊匹配:', qText?.slice(0, 30),
                                    'score=' + bestScore.toFixed(3), '→', bestEntry.answer?.slice(0, 15));
                            }
                        }
                }

                // 哈希匹配成功，用选项哈希找正确位置（和对方一致，不OCR）
                if (hashMatched) {
                    // 0. 用户纠错覆盖层（最高优先级）：先覆盖答案
                    const _liveStemKey = makeStemHash(stemHashes);
                    const _liveUc = userCorrectionsByStem[_liveStemKey];
                    if (_liveUc && _liveUc.answer) {
                        hashMatched.answer = _liveUc.answer;
                        console.log('[Keju] 哈希路径命中用户纠错覆盖层:', _liveUc.answer);
                    }
                    // 方案A：答案文字已知，立即显示（不等选项OCR），消除"控制台有答案前端慢半拍"
                    updateResultText(qText, [{ q: qText, a: hashMatched.answer, categoryName: hashMatched.categoryName }], hashMatched.answer, hashMatched.categoryName);
                    // 立即画截图（无红框），让用户先看到题面；红框待选项定位后补全
                    if (qText !== lastQText) resultFrozen = false;  // 新题允许画
                    drawResultCanvas(canvas, grouped, null, true);
                    // 0b. 用户纠错覆盖层：位置覆盖
                    if (_liveUc && _liveUc.correctOptionHashes && optionHashes) {
                        const _lbl = matchOptionByHash(optionHashes, _liveUc.correctOptionHashes);
                        if (_lbl) correctOptionLabel = _lbl;
                    }
                    // 1. 先查 hash-db.json 自带的 correctOptionHashes
                    if (!correctOptionLabel && hashMatched.correctOptionHashes && optionHashes) {
                        correctOptionLabel = matchOptionByHash(optionHashes, hashMatched.correctOptionHashes);
                    }
                    // 2. 再查手动修正
                    if (!correctOptionLabel) {
                        const stemKey = makeStemHash(stemHashes);
                        const correction = manualCorrections[stemKey];
                        if (correction && optionHashes) {
                            correctOptionLabel = matchOptionByHash(optionHashes, correction.hashes);
                            if (correctOptionLabel) {
                                console.log(`[Keju] 手动修正命中: label=${correctOptionLabel}`);
                            }
                        }
                    }
                    // 3. 都不行 → 先复用上帧选项结果，再 OCR 回退
                    if (!correctOptionLabel) {
                        // 模糊匹配不信任复用：只有精确哈希匹配 + 同题 + 30秒内才复用
                        // 模糊匹配(score<1.0)可能是错题，选项位置不同，必须 OCR 验证
                        if (isExactHashMatch && lastQResult?.correctOptionLabel && qText === lastQText && (performance.now() - lastQTimestamp) < 30000) {
                            correctOptionLabel = lastQResult.correctOptionLabel;
                            console.log('[Keju] 选项标签复用(精确匹配+文本去重):', correctOptionLabel);
                        } else {
                            const tOcr = performance.now();
                            correctOptionLabel = await ocrAndMatch(canvas, grouped, hashMatched.answer);
                            console.log(`[Keju] 选项OCR(哈希回退): ${(performance.now()-tOcr).toFixed(0)}ms → label=${correctOptionLabel}`);
                            // OCR 失败 → 保存状态供手动修正
                            if (!correctOptionLabel && optionHashes) {
                                pendingManualState = { hashMatched, stemHashes, optionHashes, canvas, grouped, qText };
                                console.log('[Keju] OCR回退失败，等待手动修正');
                            }
                        }
                    }
                    console.log(`[Keju] 总耗时(哈希): ${(performance.now()-t0).toFixed(0)}ms`);
                    // 选项定位完成，补画红框（文字已先行显示）
                    drawResultCanvas(canvas, grouped, correctOptionLabel, true);
                    updateStatus('success', '✅ 哈希匹配');
                    // 更新文本去重缓存，防止下一帧 hash 变化导致重复 OCR
                    if (qText && qText.length > 2) {
                        lastQText = qText;
                        lastQResult = { qText, correctOptionLabel };
                        lastQTimestamp = performance.now();
                        lastQHash = hash;
                        // 记录最近一次成功识别的上下文，供"标记错误"复用
                        lastDetectState = { canvas, grouped, stemHashes, optionHashes, qText, hashMatched, matchedAnswer: hashMatched?.answer };
                        recordHistory();
                    }
                    // 结果冷却3秒，跳过答题过渡期间的垃圾扫描
                    resultCooldownUntil = performance.now() + 3000;
                    detectTimer = setTimeout(detectLoop, 300);
                    return;
                }

                // ===== 哈希未匹配，回退 OCR =====
                console.log('[Keju] 哈希未匹配，回退 OCR, 检查缓存...');

                // 文本去重：同一题（hash相同）且30秒内才复用，避免新题被旧缓存拦截
                if (lastQText && lastQText.length > 2 && hash === lastQHash && (performance.now() - lastQTimestamp) < 30000) {
                    console.log('[Keju] 文本去重命中，复用上帧结果:', lastQText?.slice(0, 30));
                    qText = lastQText;
                    correctOptionLabel = lastQResult?.correctOptionLabel || null;
                    // 跳过 OCR，直接用上帧结果展示
                    const matched = searchQuestions(qText);
                    console.log(`[Keju] 文本去重 → matched=${matched?.length} label=${correctOptionLabel}`);
                    if (matched.length > 0) {
                        updateResultText(qText, matched, null, null);
                        drawResultCanvas(canvas, grouped, correctOptionLabel, true);
                        updateStatus('success', '✅ 识别成功(缓存)');
                    } else {
                        updateResultText(qText, [], null, null);
                        drawResultCanvas(canvas, grouped, null, true);
                    }
                    detectTimer = setTimeout(detectLoop, 300);
                    return;
                }

                const cached = getCachedOCR(hash);
                console.log('[Keju] OCR缓存查询: hash=', hash, '命中=', !!cached);
                if (cached) {
                    if (typeof cached === 'string') {
                        qText = cached;
                        console.log('[Keju] OCR缓存命中(string):', qText?.slice(0,30));
                    } else {
                        qText = cached.qText;
                        correctOptionLabel = cached.correctOptionLabel;
                        console.log('[Keju] OCR缓存命中(object): qText=', qText?.slice(0,30), 'label=', correctOptionLabel);
                    }
                    // 如果缓存的文字太短，清掉重新 OCR
                    if (!qText || qText.length <= 2) {
                        console.log('[Keju] 缓存的文字太短，清缓存重试');
                        ocrCache.delete(hash);
                        qText = null;
                        correctOptionLabel = null;
                    }
                }
                if (!cached || !qText) {
                    console.log('[Keju] 开始题目OCR...');
                    try {
                        const t2 = performance.now();
                        const qCanvas = cropRegion(canvas, grouped.question);
                        if (!qCanvas) throw new Error('cropRegion 返回 null');
                        qText = await runOCR(qCanvas);
                        const t3 = performance.now();
                        console.log(`[Keju] 题目OCR: ${(t3-t2).toFixed(0)}ms →`, qText);
                    } catch(e) {
                        console.error('[Keju] 题目OCR异常:', e);
                        qText = null;
                    }
                }

                console.log(`[Keju] OCR 结果: qText="${qText}" len=${qText?.length||0}`);
                if (qText && qText.length > 2) {
                    const matched = searchQuestions(qText);
                    // 用户纠错覆盖层（文字通道）：命中则覆盖答案（题库无此题也能生效）
                    const _ucNorm = userCorrectionsByNorm[normQuestionText(qText)];
                    if (_ucNorm && _ucNorm.answer) {
                        if (matched.length > 0) {
                            matched[0] = { ...matched[0], a: _ucNorm.answer, _userCorrected: true };
                        } else {
                            matched.push({ q: qText, a: _ucNorm.answer, categoryName: '', _userCorrected: true });
                        }
                        console.log('[Keju] 文字通道命中用户纠错覆盖层:', _ucNorm.answer);
                    }
                    // 方案A：题目文字已识别，立即显示（截图同步画，红框待选项OCR后补全）
                    if (qText !== lastQText) resultFrozen = false;
                    updateResultText(qText, matched, null, null);
                    drawResultCanvas(canvas, grouped, null, true);

                    if (correctOptionLabel === null && matched.length > 0 && grouped.options.length > 0) {
                        const t4 = performance.now();
                        correctOptionLabel = await ocrAndMatch(canvas, grouped, matched[0].a);
                        const t5 = performance.now();
                        console.log(`[Keju] 选项OCR: ${(t5-t4).toFixed(0)}ms → label=${correctOptionLabel}`);
                        // OCR 失败 → 保存状态供手动修正（非哈希路径）
                        if (!correctOptionLabel) {
                            if (!stemHashes) {
                                stemHashes = computeAllHashes(cropRegion(canvas, grouped.question));
                            }
                            if (!optionHashes && yoloOptions.length > 0) {
                                optionHashes = [];
                                for (const opt of yoloOptions) {
                                    const oCanvas = cropRegion(canvas, {
                                        x1: Math.max(0, opt.x1 - 5),
                                        y1: Math.max(0, opt.y1 - 5),
                                        x2: Math.min(canvas.width, opt.x2 + 5),
                                        y2: Math.min(canvas.height, opt.y2 + 5)
                                    });
                                    optionHashes.push({ label: opt.label, hashes: computeAllHashes(oCanvas) });
                                }
                            }
                            if (optionHashes && stemHashes) {
                                pendingManualState = {
                                    hashMatched: null,
                                    matchedAnswer: matched[0].a,
                                    stemHashes, optionHashes, canvas, grouped, qText
                                };
                                console.log('[Keju] OCR失败（非哈希），等待手动修正');
                            }
                        }
                    }

                    if (!cached && qText) {
                        setCachedOCR(hash, { qText, correctOptionLabel });
                    }

                    // 更新文本去重缓存
                    if (qText && qText.length > 2) {
                        lastQText = qText;
                        lastQResult = { qText, correctOptionLabel };
                        lastQTimestamp = performance.now();
                        lastQHash = hash;
                    }

                    // OCR 成功后存入哈希库
                    if (correctOptionLabel && matched.length > 0) {
                        const best = matched[0];
                        if (!stemHashes) {
                            stemHashes = computeAllHashes(cropRegion(canvas, grouped.question));
                        }
                        if (!optionHashes && yoloOptions.length > 0) {
                            optionHashes = [];
                            // 用原始YOLO框计算哈希入库，保证后续匹配一致
                            for (const opt of yoloOptions) {
                                const oCanvas = cropRegion(canvas, {
                                    x1: Math.max(0, opt.x1 - 5),
                                    y1: Math.max(0, opt.y1 - 5),
                                    x2: Math.min(canvas.width, opt.x2 + 5),
                                    y2: Math.min(canvas.height, opt.y2 + 5)
                                });
                                optionHashes.push({
                                    label: opt.label,
                                    hashes: computeAllHashes(oCanvas)
                                });
                            }
                        }
                        // 提取正确答案的选项哈希
                        let correctOptHashes = null;
                        if (correctOptionLabel && optionHashes) {
                            const correctOpt = optionHashes.find(o => o.label === correctOptionLabel);
                            if (correctOpt) correctOptHashes = correctOpt.hashes;
                        }
                        addToHashDB({
                            stemHash: makeStemHash(stemHashes),
                            optionHash: optionHashes ? optionHashes.map(o =>
                                `${o.label}:${o.hashes.gridHash}:${o.hashes.rowHash}:${o.hashes.columnHash}`
                            ).join('|') : '',
                            questionText: qText,
                            answer: best.a,
                            correctOptionHashes: correctOptHashes,
                            categoryName: best.categoryName || best.category
                        });
                    }

                    console.log(`[Keju] 总耗时: ${(performance.now()-t0).toFixed(0)}ms → matched=${matched?.length} label=${correctOptionLabel}`);
                    // 选项定位完成，补画红框（文字已先行显示）
                    drawResultCanvas(canvas, grouped, correctOptionLabel, true);
                    updateStatus('success', '✅ 识别成功');
                    // 记录最近一次成功识别的上下文，供"标记错误"复用
                    lastDetectState = { canvas, grouped, stemHashes, optionHashes, qText, hashMatched: null, matchedAnswer: matched?.length ? matched[0].a : null };
                    recordHistory();
                    // 结果冷却3秒，跳过答题过渡期间的垃圾扫描
                    resultCooldownUntil = performance.now() + 3000;
                } else {
                    // OCR 完全失败，尝试弹出手动修正（如果有选项框）
                    console.warn('[Keju] OCR 失败: qText 过短或为空, 尝试手动修正');
                    if (!stemHashes && grouped.question) {
                        stemHashes = computeAllHashes(cropRegion(canvas, grouped.question));
                    }
                    if (!optionHashes && yoloOptions.length > 0) {
                        optionHashes = [];
                        for (const opt of yoloOptions) {
                            const oCanvas = cropRegion(canvas, {
                                x1: Math.max(0, opt.x1 - 5),
                                y1: Math.max(0, opt.y1 - 5),
                                x2: Math.min(canvas.width, opt.x2 + 5),
                                y2: Math.min(canvas.height, opt.y2 + 5)
                            });
                            optionHashes.push({ label: opt.label, hashes: computeAllHashes(oCanvas) });
                        }
                    }
                    if (optionHashes && stemHashes) {
                        pendingManualState = {
                            hashMatched: null,
                            matchedAnswer: '',
                            stemHashes, optionHashes, canvas, grouped, qText: ''
                        };
                        updateResultText('', [], null, null);
                        drawResultCanvas(canvas, grouped, null, true);  // force 重绘，确保手动修正面板出现
                        console.log('[Keju] OCR完全失败，弹出手动修正面板');
                    }
                }
            }

            // 没检测到题目时累计 miss 计数
            // 不清除 lastQText/lastQResult/resultFrozen —— 让去重缓存和冻结标志自然存活
            // 同一题重新出现时：qText === lastQText → 复用标签，不触发OCR
            // 新题出现时：qText !== lastQText → 在哈希/OCR路径中解冻 resultFrozen
            if (!grouped.question) {
                noQuestionMissCount++;
                if (noQuestionMissCount >= 3) {
                    noQuestionMissCount = 0;
                }
            } else {
                noQuestionMissCount = 0;
            }

            detectTimer = setTimeout(detectLoop, 300);
        }

        // ========== YOLO 推理 ==========
        async function runYOLO(canvas) {
            const origW = canvas.width;
            const origH = canvas.height;

            const tensor = tf.tidy(() => {
                const temp = document.createElement('canvas');
                temp.width = INPUT_SIZE;
                temp.height = INPUT_SIZE;
                temp.getContext('2d').drawImage(canvas, 0, 0, INPUT_SIZE, INPUT_SIZE);
                return tf.browser.fromPixels(temp).cast('float32').div(255).expandDims(0);
            });

            const input = {};
            input[inputName] = tensor;
            const output = model.execute(input);

            // 优化1: 使用异步 data() 避免阻塞
            const data = await output.data();
            const shape = output.shape;

            tf.dispose(tensor);
            output.dispose();

            // [1, 300, 6] 格式
            const dets = [];
            const num = shape[1];
            for (let i = 0; i < num; i++) {
                const off = i * 6;
                const score = data[off + 4];
                if (score < CONF_THRESH) continue;

                let x1 = data[off], y1 = data[off + 1], x2 = data[off + 2], y2 = data[off + 3];
                const cls = Math.round(data[off + 5]);

                // 坐标映射到原图
                x1 = x1 / INPUT_SIZE * origW;
                x2 = x2 / INPUT_SIZE * origW;
                y1 = y1 / INPUT_SIZE * origH;
                y2 = y2 / INPUT_SIZE * origH;

                dets.push({
                    label: LABELS[cls] || `cls${cls}`,
                    score,
                    x1, y1, x2, y2
                });
            }
            return dets;
        }

        function groupDetection(dets) {
            const topic = dets.find(d => d.label === 'T') || null;
            const question = dets.find(d => d.label === 'Q') || null;
            const options = ['A', 'B', 'C', 'D'].map(l => dets.find(d => d.label === l)).filter(Boolean);
            return { topic, question, options, detections: dets };
        }

        // ========== 像素投影选项框检测 ==========
        // 参考 mhxyai.com 做法：在话题区(T)内做水平+垂直投影，
        // 找出 2行×2列 的选项网格（A/B上排, C/D下排），用位置判断标签
        // 解决问题：YOLO 只框住文字本身，投影能找到整个选项区域

        // 游戏文字像素检测（亮黄/白色文字）
        function _isGameText(r, g, b) {
            const maxC = Math.max(r, g, b);
            const minC = Math.min(r, g, b);
            const avg = (r + g + b) / 3;
            return avg >= 135 && (maxC - minC) <= 85 && r >= 120 && g >= 125 && b >= 140;
        }

        // 移动平均平滑投影数组
        function _smoothProj(arr, radius) {
            return arr.map((_, i) => {
                let sum = 0, count = 0;
                for (let j = Math.max(0, i - radius); j <= Math.min(arr.length - 1, i + radius); j++) {
                    sum += arr[j]; count++;
                }
                return count ? sum / count : 0;
            });
        }

        // 找投影峰值区间: 阈值以上连续区间 → 合并近邻 → 过滤最小宽度
        function _findPeaks(smoothed, threshold, minWidth, mergeGap) {
            // 找连续超出阈值的区间
            const raw = [];
            let inPeak = false, start = 0, peak = 0;
            for (let i = 0; i < smoothed.length; i++) {
                if (smoothed[i] >= threshold) {
                    if (!inPeak) { start = i; peak = smoothed[i]; inPeak = true; }
                    else peak = Math.max(peak, smoothed[i]);
                } else {
                    if (inPeak) { raw.push({ start, end: i, peak }); inPeak = false; peak = 0; }
                }
            }
            if (inPeak) raw.push({ start, end: smoothed.length, peak });

            // 合并间距 <= mergeGap 的相邻峰
            const merged = [];
            for (const r of raw) {
                const last = merged[merged.length - 1];
                if (last && r.start - last.end <= mergeGap) {
                    last.end = r.end;
                    last.peak = Math.max(last.peak, r.peak);
                } else {
                    merged.push({ ...r });
                }
            }

            // 过滤最小宽度
            return merged.filter(p => (p.end - p.start) >= minWidth);
        }

        // 根据框在 T 话题区内的相对位置判断是 A/B/C/D
        function _classifyOptionPosition(box, tBox) {
            const cx = (box.x1 + box.x2) / 2;
            const cy = (box.y1 + box.y2) / 2;
            const tW = Math.max(1, tBox.x2 - tBox.x1);
            const tH = Math.max(1, tBox.y2 - tBox.y1);
            const hRatio = (cx - tBox.x1) / tW;   // 0=左, 1=右
            const vRatio = (cy - tBox.y1) / tH;   // 0=上, 1=下
            const side = hRatio < 0.5 ? 'left' : 'right';
            const row = vRatio < 0.72 ? 'top' : 'bottom';
            if (row === 'top' && side === 'left') return 'A';
            if (row === 'top' && side === 'right') return 'B';
            if (row === 'bottom' && side === 'left') return 'C';
            if (row === 'bottom' && side === 'right') return 'D';
            return null;
        }

        function findOptionBoxesByProjection(canvas, topic, question) {
            const crop = cropRegion(canvas, topic);
            const ctx = crop.getContext('2d');
            const imageData = ctx.getImageData(0, 0, crop.width, crop.height);
            const { data, width: tw, height: th } = imageData;

            if (tw < 10 || th < 10) return [];

            // Step 1: 创建游戏文字墨水图 + 水平投影
            const ink = new Uint8Array(tw * th);
            const hProj = new Float32Array(th);
            for (let y = 0; y < th; y++) {
                let count = 0;
                for (let x = 0; x < tw; x++) {
                    const off = (y * tw + x) * 4;
                    if (_isGameText(data[off], data[off + 1], data[off + 2])) {
                        ink[y * tw + x] = 1;
                        count++;
                    }
                }
                hProj[y] = count;
            }

            // Step 2: 平滑 + 找水平波段
            const hSmoothR = Math.max(2, Math.round(th * 0.006));
            const hSmoothed = _smoothProj(hProj, hSmoothR);
            const hMinWidth = Math.max(14, Math.round(th * 0.045));
            const hMergeGap = Math.max(4, Math.round(th * 0.018));
            const hPeaks = _findPeaks(hSmoothed, tw * 0.16, hMinWidth, hMergeGap);

            if (hPeaks.length === 0) return [];

            // Step 3: 确定 Q 题目的下边界（用 YOLO Q 或上半区域最大块底部）
            let boundaryY;
            if (question) {
                boundaryY = question.y2 - topic.y1;
            } else {
                const topBlock = hPeaks.find(b => (b.start + b.end) / 2 < th * 0.5);
                boundaryY = topBlock ? topBlock.end : th * 0.38;
            }
            boundaryY = Math.max(0, Math.min(th, boundaryY));

            // Step 4: 取 Q 边界下方的波段 → 选项行（只取前 2 条）
            const optBands = hPeaks
                .filter(b => (b.start + b.end) / 2 > boundaryY + th * 0.08)
                .sort((a, b) => a.start - b.start)
                .slice(0, 2);

            if (optBands.length === 0) return [];

            // Step 5: 对每个选项行做垂直投影 → 找列（每行取前 2 列）
            const candidates = [];

            for (const band of optBands) {
                // 该行内的垂直投影
                const vProj = new Float32Array(tw);
                const bandH = band.end - band.start;
                for (let y = band.start; y < band.end; y++) {
                    for (let x = 0; x < tw; x++) {
                        vProj[x] += ink[y * tw + x];
                    }
                }

                const vSmoothR = Math.max(2, Math.round(tw * 0.006));
                const vSmoothed = _smoothProj(vProj, vSmoothR);
                const vMinWidth = Math.max(28, Math.round(tw * 0.12));
                const vMergeGap = Math.max(8, Math.round(tw * 0.025));
                const vPeaks = _findPeaks(vSmoothed, bandH * 0.28, vMinWidth, vMergeGap)
                    .filter(p => p.peak >= bandH * 0.45)
                    .sort((a, b) => a.start - b.start)
                    .slice(0, 2);

                for (const col of vPeaks) {
                    const xPad = Math.max(2, Math.round(tw * 0.006));
                    const yPad = Math.max(2, Math.round(th * 0.006));

                    // 原始边界（带 padding），不 shrink —— shrink 会导致 OCR 切太紧
                    const box = {
                        x1: topic.x1 + Math.max(0, col.start - xPad),
                        y1: topic.y1 + Math.max(0, band.start - yPad),
                        x2: topic.x1 + Math.min(tw, col.end + xPad),
                        y2: topic.y1 + Math.min(th, band.end + yPad),
                    };

                    // 位置判定 A/B/C/D
                    const className = _classifyOptionPosition(box, topic);
                    if (!className) continue;

                    // 面积比例过滤
                    const area = (box.x2 - box.x1) * (box.y2 - box.y1) / (tw * th);
                    if (area < 0.015 || area > 0.22) continue;

                    candidates.push({
                        className,
                        box,
                        confidence: Math.max(0.45, Math.min(0.98, band.peak / tw * 0.55 + col.peak / bandH * 0.45)),
                    });
                }
            }

            // Step 6: 每个 class 只保留最好的一个
            const bestMap = {};
            for (const c of candidates) {
                const exist = bestMap[c.className];
                if (!exist || c.confidence > exist.confidence) {
                    bestMap[c.className] = c;
                }
            }

            const result = ['A', 'B', 'C', 'D'].map(cls => bestMap[cls]).filter(Boolean);
            console.log(`[Keju] 投影检测: ${hPeaks.length}个行波段, ${optBands.length}个选项行 → ${result.length} 个选项框 (${result.map(r=>r.className).join(',')})`);
            return result;
        }

        function enhanceOptionsWithProjection(canvas, grouped) {
            if (!grouped.topic) return;

            const projOpts = findOptionBoxesByProjection(canvas, grouped.topic, grouped.question);

            if (projOpts.length === 0) return;

            // 用投影结果替换 grouped.options
            const enhanced = [];
            for (const proj of projOpts) {
                // 尝试从原有 YOLO 选项继承一些属性
                const yoloOpt = grouped.options.find(o => o.label === proj.className);
                enhanced.push({
                    label: proj.className,
                    score: yoloOpt ? Math.max(yoloOpt.score, proj.confidence) : proj.confidence,
                    x1: proj.box.x1,
                    y1: proj.box.y1,
                    x2: proj.box.x2,
                    y2: proj.box.y2,
                    fromProjection: true
                });
            }

            // 补充投影没有覆盖到的标签
            for (const label of ['A', 'B', 'C', 'D']) {
                if (!enhanced.find(o => o.label === label)) {
                    const yoloOpt = grouped.options.find(o => o.label === label);
                    if (yoloOpt) enhanced.push(yoloOpt);
                }
            }

            console.log(`[Keju] 投影增强: ${grouped.options.length} YOLO框 → ${enhanced.length} 投影框 (${enhanced.filter(o=>o.fromProjection).length}个来自投影)`);
            grouped.options = enhanced;
        }

        function updateBadges(g) {
            ['T', 'Q', 'A', 'B', 'C', 'D'].forEach(l => {
                const el = document.getElementById('badge' + l);
                const found = g.detections.find(d => d.label === l);
                el.className = 'detect-badge ' + (found ? 'yes' : 'no');
                el.textContent = l + ': ' + (found ? Math.round(found.score * 100) + '%' : '--');
            });
        }

        // ========== OCR ==========
        async function runOCR(canvas) {
            return new Promise((resolve) => {
                canvas.toBlob(async (blob) => {
                    if (!blob) { console.error('[Keju] OCR: toBlob 返回 null'); resolve(''); return; }
                    try {
                        const formData = new FormData();
                        formData.append('img', blob, 'ocr.png');
                        const resp = await fetch('/api/ocr/general', {
                            method: 'POST',
                            body: formData
                        });
                        if (!resp.ok) {
                            console.error('[Keju] OCR: HTTP', resp.status, resp.statusText);
                            resolve('');
                            return;
                        }
                        const data = await resp.json();
                        resolve(data.text || '');
                    } catch (e) {
                        console.error('[Keju] OCR 错误:', e.message, '(可能OCR服务未启动)');
                        resolve('');
                    }
                }, 'image/png');
            });
        }

        // ========== 批量 OCR ==========
        // 一次请求处理多个 canvas，消除多次 HTTP 往返开销
        async function runBatchOCR(canvases) {
            const formData = new FormData();
            const blobs = await Promise.all(canvases.map(c => new Promise(resolve => {
                c.toBlob(b => resolve(b), 'image/png');
            })));
            blobs.forEach((blob, i) => formData.append('imgs', blob, `ocr_${i}.png`));
            const resp = await fetch('/api/ocr/batch', { method: 'POST', body: formData });
            if (!resp.ok) throw new Error(`batch OCR HTTP ${resp.status}`);
            const data = await resp.json();
            return data.results?.map(r => r.text || '') || [];
        }

        // ========== 选项 OCR + 答案匹配 ==========
        // ========== 选项 OCR + 答案匹配（A' 拼图单次OCR） ==========
        // 把4个选项裁图横向拼成1条，单次OCR，按x坐标映射回A/B/C/D
        function cropWithPad(opt, canvas, pad) {
            return cropRegion(canvas, {
                x1: Math.max(0, opt.x1 - pad),
                y1: Math.max(0, opt.y1 - pad),
                x2: Math.min(canvas.width, opt.x2 + pad),
                y2: Math.min(canvas.height, opt.y2 + pad)
            });
        }

        // 把选项按 label 顺序横向拼成一条长图，返回 strip canvas 与每个选项的 x 范围
        function buildOptionStrip(options, canvas, pad) {
            const crops = options.map(opt => cropWithPad(opt, canvas, pad));
            const gap = 30;  // 选项间留白，防止 PP-OCR 跨选项合并
            const h = Math.max(...crops.map(c => c.height));
            const totalW = crops.reduce((s, c) => s + c.width, 0) + gap * (crops.length - 1);
            const strip = document.createElement('canvas');
            strip.width = totalW;
            strip.height = h;
            const ctx = strip.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, totalW, h);
            let x = 0;
            const ranges = [];
            crops.forEach((c, i) => {
                ctx.drawImage(c, x, 0);
                ranges.push({ label: options[i].label, x0: x, x1: x + c.width });
                x += c.width + gap;
            });
            return { strip, ranges };
        }

        function rangeLabelForCx(ranges, cx) {
            if (!cx) return null;
            for (const r of ranges) {
                if (cx >= r.x0 && cx <= r.x1) return r.label;
            }
            return null;
        }

        function assignDetsToOptions(dets, ranges, options) {
            const map = {};
            options.forEach(o => map[o.label] = '');
            for (const det of dets) {
                const label = rangeLabelForCx(ranges, det.cx);
                if (label) map[label] += (map[label] ? ' ' : '') + (det.text || '');
            }
            return map;
        }

        async function runStripOCR(stripCanvas) {
            const blob = await new Promise(resolve => stripCanvas.toBlob(b => resolve(b), 'image/png'));
            const formData = new FormData();
            formData.append('img', blob, 'strip.png');
            const resp = await fetch('/api/ocr/options-strip', { method: 'POST', body: formData });
            if (!resp.ok) throw new Error(`strip OCR HTTP ${resp.status}`);
            const data = await resp.json();
            return data.dets || [];
        }

        // 拼图单次OCR：返回 {A:'..',B:'..',C:'..',D:'..'}
        async function ocrOptionsToTexts(canvas, grouped) {
            const pad = 20;
            try {
                const { strip, ranges } = buildOptionStrip(grouped.options, canvas, pad);
                const dets = await runStripOCR(strip);
                const map = assignDetsToOptions(dets, ranges, grouped.options);
                // 空选项用更大 pad 重试（同样拼图单次）
                const empties = grouped.options.filter(o => !map[o.label]?.trim());
                if (empties.length > 0) {
                    const { strip: s2, ranges: r2 } = buildOptionStrip(grouped.options, canvas, 40);
                    const dets2 = await runStripOCR(s2);
                    const map2 = assignDetsToOptions(dets2, r2, grouped.options);
                    for (const o of empties) if (map2[o.label]?.trim()) map[o.label] = map2[o.label];
                }
                return map;
            } catch (e) {
                console.warn('[Keju] 拼图OCR失败, 回退batch:', e);
                const crops = grouped.options.map(opt => cropWithPad(opt, canvas, pad));
                const texts = await runBatchOCR(crops);
                const map = {};
                grouped.options.forEach((opt, i) => map[opt.label] = texts[i] || '');
                return map;
            }
        }

        async function ocrAndMatch(canvas, grouped, answerText) {
            const cleanAnswer = answerText.replace(/[（(].*?[）)]/g, '').replace(/\s+/g, '').trim();
            if (!cleanAnswer) return null;

            const answerChars = new Set(cleanAnswer.replace(/[^一-龥]/g, ''));
            const optionOcrTexts = await ocrOptionsToTexts(canvas, grouped);
            console.log('[Keju] 选项OCR分配 (拼图):', JSON.stringify(optionOcrTexts));

            // Jaccard 模糊匹配：找和答案汉字重叠最多的选项字母
            let bestLabel = null, bestScore = 0;
            for (const [label, ocrText] of Object.entries(optionOcrTexts)) {
                const ocrChars = new Set(ocrText.replace(/[^一-龥]/g, ''));
                let intersection = 0;
                for (const ch of answerChars) {
                    if (ocrChars.has(ch)) intersection++;
                }
                const union = answerChars.size + ocrChars.size - intersection;
                const score = union > 0 ? intersection / union : 0;
                console.log(`[Keju] 选项${label}: OCR="${ocrText.slice(0,20)}" Jaccard=${score.toFixed(2)}`);
                if (score > bestScore) {
                    bestScore = score;
                    bestLabel = label;
                }
            }

            if (bestLabel) {
                console.log(`[Keju] 答案匹配: ${cleanAnswer} → ${bestLabel} (Jaccard=${bestScore.toFixed(2)})`);
                return bestLabel;
            }
            console.log(`[Keju] 答案未匹配: ${cleanAnswer} | 无 OCR 文字`);
            return null;
        }

        function cropRegion(canvas, region) {
            const c = document.createElement('canvas');
            c.width = Math.max(1, region.x2 - region.x1);
            c.height = Math.max(1, region.y2 - region.y1);
            const ctx = c.getContext('2d');
            ctx.drawImage(canvas, region.x1, region.y1, c.width, c.height, 0, 0, c.width, c.height);
            return c;
        }

        // ========== 图像感知哈希 (perceptual hash) ==========

        // 将 ImageData 转为二值化 "墨水" 位图
        function imageToInk(imageData) {
            const { width, height, data } = imageData;
            const ink = new Uint8Array(width * height);
            for (let i = 0; i < width * height; i++) {
                const r = data[i * 4];
                const g = data[i * 4 + 1];
                const b = data[i * 4 + 2];
                const gray = r * 0.299 + g * 0.587 + b * 0.114;
                ink[i] = gray < 128 ? 1 : 0;
            }
            return { width, height, data, ink };
        }

        function canvasToInk(canvas) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            return imageToInk(imageData);
        }

        function bitsToHex(bits) {
            let result = '';
            for (let i = 0; i < bits.length; i += 4) {
                let val = 0;
                for (let j = 0; j < 4 && i + j < bits.length; j++) {
                    if (bits[i + j]) val |= (1 << (3 - j));
                }
                result += val.toString(16);
            }
            return result;
        }

        function computeGridHash(ink, cols = 16, rows = 8, threshold = 0.08) {
            const bits = [];
            const cellH = ink.height / rows;
            const cellW = ink.width / cols;
            for (let r = 0; r < rows; r++) {
                const y0 = Math.floor(r * cellH);
                const y1 = Math.floor((r + 1) * cellH);
                for (let c = 0; c < cols; c++) {
                    const x0 = Math.floor(c * cellW);
                    const x1 = Math.floor((c + 1) * cellW);
                    let inkCount = 0, total = 0;
                    for (let y = y0; y < y1; y++) {
                        for (let x = x0; x < x1; x++) {
                            if (ink.ink[y * ink.width + x]) inkCount++;
                            total++;
                        }
                    }
                    bits.push(total > 0 ? (inkCount / total) > threshold : false);
                }
            }
            return bitsToHex(bits);
        }

        function computeRowHash(ink, rows = 32) {
            const densities = [];
            const rowH = ink.height / rows;
            for (let r = 0; r < rows; r++) {
                const y0 = Math.floor(r * rowH);
                const y1 = Math.floor((r + 1) * rowH);
                let inkCount = 0, total = 0;
                for (let y = y0; y < y1; y++) {
                    for (let x = 0; x < ink.width; x++) {
                        if (ink.ink[y * ink.width + x]) inkCount++;
                        total++;
                    }
                }
                densities.push(total > 0 ? inkCount / total : 0);
            }
            const avg = densities.reduce((a, b) => a + b, 0) / densities.length;
            const bits = densities.map(d => d >= avg);
            return bitsToHex(bits);
        }

        function computeColumnHash(ink, cols = 64) {
            const densities = [];
            const colW = ink.width / cols;
            for (let c = 0; c < cols; c++) {
                const x0 = Math.floor(c * colW);
                const x1 = Math.floor((c + 1) * colW);
                let inkCount = 0, total = 0;
                for (let y = 0; y < ink.height; y++) {
                    for (let x = x0; x < x1; x++) {
                        if (ink.ink[y * ink.width + x]) inkCount++;
                        total++;
                    }
                }
                densities.push(total > 0 ? inkCount / total : 0);
            }
            const avg = densities.reduce((a, b) => a + b, 0) / densities.length;
            const bits = densities.map(d => d >= avg);
            return bitsToHex(bits);
        }

        function computeAllHashes(canvas) {
            const ink = canvasToInk(canvas);
            return {
                gridHash: computeGridHash(ink),
                rowHash: computeRowHash(ink),
                columnHash: computeColumnHash(ink)
            };
        }

        function makeStemHash(hashes) {
            return `${hashes.gridHash}:${hashes.rowHash}:${hashes.columnHash}`;
        }

        function hashSimilarity(h1, h2) {
            const maxLen = Math.max(h1.length, h2.length);
            if (maxLen === 0) return 1;
            let distance = 0;
            for (let i = 0; i < maxLen; i++) {
                const c1 = h1[i] || '0';
                const c2 = h2[i] || '0';
                const xor = parseInt(c1, 16) ^ parseInt(c2, 16);
                distance += (xor & 1) + ((xor >> 1) & 1) + ((xor >> 2) & 1) + ((xor >> 3) & 1);
            }
            return 1 - distance / (maxLen * 4);
        }

        function combinedHashScore(h1, h2) {
            return hashSimilarity(h1.gridHash, h2.gridHash) * 0.32
                 + hashSimilarity(h1.rowHash, h2.rowHash) * 0.28
                 + hashSimilarity(h1.columnHash, h2.columnHash) * 0.40;
        }

        // 用选项哈希比对找到正确选项（和对方一致）
        function matchOptionByHash(currentOptionHashes, storedCorrectOptHashes, threshold = 0.94) {
            let bestLabel = null, bestScore = 0;
            for (const opt of currentOptionHashes) {
                const score = combinedHashScore(opt.hashes, storedCorrectOptHashes);
                if (score > bestScore) {
                    bestScore = score;
                    bestLabel = opt.label;
                }
            }
            if (bestScore >= threshold) {
                console.log(`[Keju] 选项哈希命中 → ${bestLabel} (score=${bestScore.toFixed(3)})`);
                return bestLabel;
            }
            console.log(`[Keju] 选项哈希低于阈值${threshold} (best=${bestScore.toFixed(3)})，回退OCR`);
            return null;
        }

        // ========== 哈希数据库（localStorage）==========
        const HASH_DB_KEY = 'keju-hash-db-v1';

        let hashDB = null;
        let hashDBEntries = null;
        let builtinHashes = new Set();  // 记录哪些哈希来自内置库，不重复存储

        async function loadHashDB() {
            hashDB = new Map();
            hashDBEntries = [];
            builtinHashes = new Set();

            // 1. 先加载内置哈希库（来自后端静态文件，所有用户共享）
            try {
                const resp = await fetch('/mhxy/static/hash-db.json');
                if (resp.ok) {
                    const builtin = await resp.json();
                    for (const entry of builtin) {
                        if (entry.stemHash && entry.answer && entry.correctOptionHashes) {
                            hashDB.set(entry.stemHash, entry);
                            builtinHashes.add(entry.stemHash);
                        }
                    }
                    console.log('[Keju] 内置哈希库已加载:', hashDB.size, '条');
                }
            } catch (e) {
                console.log('[Keju] 无内置哈希库');
            }

            // 2. 再加载 localStorage 增量条目（仅用户新增的，不重复存内置数据）
            try {
                const raw = localStorage.getItem(HASH_DB_KEY);
                if (raw) {
                    const local = JSON.parse(raw);
                    let added = 0;
                    for (const entry of local) {
                        if (!hashDB.has(entry.stemHash)) {
                            hashDB.set(entry.stemHash, entry);
                            added++;
                        }
                    }
                    console.log('[Keju] 本地增量:', added, '条，总计:', hashDB.size, '条');
                } else {
                    console.log('[Keju] 哈希库总计:', hashDB.size, '条');
                }
            } catch (e) {
                console.error('[Keju] 本地哈希库加载失败:', e);
            }

            // 3. 加载用户纠错覆盖层 user_corrections.json（最高优先级）
