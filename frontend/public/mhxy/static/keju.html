            try {
                const resp = await fetch('/mhxy/static/user_corrections.json');
                if (resp.ok) {
                    const corr = await resp.json();
                    userCorrections = Array.isArray(corr) ? corr : [];
                    userCorrectionsByStem = {};
                    userCorrectionsByNorm = {};
                    let applied = 0;
                    for (const rec of userCorrections) {
                        if (rec.stemHash) {
                            userCorrectionsByStem[rec.stemHash] = rec;
                            // 若内置库已有该 stem，直接覆盖 answer/position；否则新建一条供 hash 路径命中
                            const entry = hashDB.get(rec.stemHash);
                            if (entry) {
                                if (rec.answer) entry.answer = rec.answer;
                                if (rec.correctOptionHashes) entry.correctOptionHashes = rec.correctOptionHashes;
                            } else if (rec.answer) {
                                hashDB.set(rec.stemHash, {
                                    stemHash: rec.stemHash,
                                    questionText: rec.questionText || '',
                                    answer: rec.answer,
                                    correctOptionHashes: rec.correctOptionHashes || {},
                                    categoryName: ''
                                });
                            }
                            applied++;
                        }
                        if (rec.normQuestion) {
                            userCorrectionsByNorm[rec.normQuestion] = rec;
                        }
                    }
                    console.log('[Keju] 用户纠错覆盖层已加载:', userCorrections.length, '条，已应用 hash 覆盖', applied);
                }
            } catch (e) {
                console.log('[Keju] 无用户纠错覆盖层');
            }

            hashDBEntries = Array.from(hashDB.values());
            updateHashDBCounts();
        }

        // 只保存用户新增的条目（不含内置），减少 localStorage 占用
        function saveHashDB() {
            try {
                const userEntries = hashDBEntries.filter(e => !builtinHashes.has(e.stemHash));
                localStorage.setItem(HASH_DB_KEY, JSON.stringify(userEntries));
                console.log('[Keju] 哈希库已保存(增量):', userEntries.length, '条');
            } catch (e) {
                console.error('[Keju] 哈希库保存失败:', e);
            }
        }

        function addToHashDB(entry) {
            if (hashDB.has(entry.stemHash)) {
                // 已存在，答案不变，不覆盖（选项位置可能变动，不存位置）
                return;
            }
            entry.collectedAt = Date.now();
            hashDBEntries.push(entry);
            hashDB.set(entry.stemHash, entry);
            saveHashDB();
            console.log('[Keju] 哈希库新增:', entry.questionText?.slice(0, 30), '→', entry.answer?.slice(0, 15));
            updateHashDBCounts();

            // 后台上报到服务器（众筹），静默失败不影响用户体验
            const report = { ...entry };
            delete report.collectedAt;  // 不传时间戳
            fetch('/api/hash-db/collect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(report)
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    console.log('[Keju] 哈希已上报服务器, 累计收集:', data.total_collected);
                }
            }).catch(() => {
                // 静默失败 — 可能是外网访问不到本地 OCR 机器的 /api/hash-db
            });
        }

        function updateHashDBCounts() {
            const totalEl = document.getElementById('hashDBCount');
            const newEl = document.getElementById('hashDBNewCount');
            if (totalEl) totalEl.textContent = hashDBEntries.length;
            if (newEl) newEl.textContent = hashDBEntries.filter(e => !builtinHashes.has(e.stemHash)).length;
        }

        function exportHashDB() {
            const userEntries = hashDBEntries.filter(e => !builtinHashes.has(e.stemHash));
            if (userEntries.length === 0) {
                alert('没有新的哈希条目可导出（所有题目已在内置库中）。');
                return;
            }
            const json = JSON.stringify(userEntries, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `keju-hash-db-new-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            console.log('[Keju] 增量哈希库已导出:', userEntries.length, '条');
        }

        function importHashDB(file) {
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const entries = JSON.parse(reader.result);
                    if (!Array.isArray(entries)) throw new Error('格式错误');
                    let added = 0;
                    for (const entry of entries) {
                        if (!entry.stemHash || !entry.answer) continue;
                        if (!hashDB.has(entry.stemHash)) {
                            hashDBEntries.push(entry);
                            hashDB.set(entry.stemHash, entry);
                            added++;
                        }
                    }
                    saveHashDB();
                    console.log('[Keju] 哈希库导入完成: 新增', added, '条, 总计', hashDBEntries.length, '条');
                    alert(`哈希库导入完成: 新增 ${added} 条, 总计 ${hashDBEntries.length} 条`);
                    updateHashDBCounts();
                } catch (e) {
                    console.error('[Keju] 哈希库导入失败:', e);
                    alert('导入失败: ' + e.message);
                }
            };
            reader.readAsText(file);
        }

        loadHashDB();
        loadManualCorrections();
        loadHistory();
        renderHistory();

        function simpleHash(canvas, region) {
            const crop = cropRegion(canvas, region);
            // 降采样到 16x16，再量化像素到4级，抗屏幕共享压缩噪点
            const small = document.createElement('canvas');
            small.width = 16;
            small.height = 16;
            const sctx = small.getContext('2d');
            sctx.drawImage(crop, 0, 0, 16, 16);
            const data = sctx.getImageData(0, 0, 16, 16).data;
            let h = 0;
            for (let i = 0; i < data.length; i += 4) {
                // 每通道量化到4级(>>6)，忽略压缩噪点
                const r = data[i] >> 6;
                const g = data[i + 1] >> 6;
                const b = data[i + 2] >> 6;
                h = ((h << 5) - h + r * 16 + g * 4 + b) | 0;
            }
            return h;
        }

        // ========== 题库搜索（优化4: 使用预计算字符集）==========
        function searchQuestions(text) {
            if (!questionChars.length) return [];

            const inputChars = new Set(text.replace(/[^一-龥]/g, ''));

            // 关键词
            const keywords = text.match(/[一-龥]{2,}/g) || [];

            const results = questions.map((q, i) => {
                const qChars = questionChars[i];

                // 计算交集
                let intersection = 0;
                for (const ch of inputChars) {
                    if (qChars.has(ch)) intersection++;
                }

                // Jaccard
                const union = inputChars.size + qChars.size - intersection;
                const jaccard = union > 0 ? intersection / union : 0;

                // 关键词匹配
                let keywordScore = 0;
                const qText = q.q || '';
                for (const kw of keywords) {
                    if (qText.includes(kw)) keywordScore += kw.length * 10;
                }

                const score = jaccard * 50 + keywordScore;

                return { ...q, score, jaccard };
            });

            results.sort((a, b) => b.score - a.score);
            console.log('[Keju] 最佳匹配:', results[0]?.q, '得分:', results[0]?.score, '答案:', results[0]?.a);
            return results.slice(0, 3);
        }

        // ========== 显示结果（方案A：文字与红框解耦）==========

        // 仅更新题目/答案文字（即时，不等选项OCR），避免"控制台有答案但前端慢半拍"
        function updateResultText(qText, matched, answer, categoryName) {
            try {
                const panel = document.getElementById('resultPanel');
                if (!panel) return;
                // 在"题目："处自然换行，更易读
                const displayQ = (qText || '').replace(/(题目：)/g, '\n$1');
                document.getElementById('resultQuestion').textContent = displayQ;
                document.getElementById('resultQuestion').title = qText || '';  // hover 显示完整题目
                if (matched && matched.length > 0) {
                    const best = matched[0];
                    document.getElementById('resultAnswer').textContent = best.a || '未知';
                    document.getElementById('resultAnswer').title = best.a || '未知';  // hover 显示完整答案
                    const matchPercent = Math.round((best.jaccard || 0) * 100);
                    document.getElementById('resultMeta').textContent = `匹配: ${matchPercent}% | 分类: ${best.categoryName || best.category || categoryName || '-'}`;
                } else {
                    document.getElementById('resultAnswer').textContent = answer || '未匹配';
                    document.getElementById('resultMeta').textContent = categoryName ? `分类: ${categoryName}` : '-';
                }
                panel.classList.add('active');
            } catch(e) {
                console.error('[Keju] updateResultText异常:', e);
            }
        }

        // 画截图 + 红框（可异步：选项OCR完再画）。force=true 时忽略冻结强制重绘
        function drawResultCanvas(canvas, grouped, correctOptionLabel, force = false) {
            if (resultFrozen && !force) {
                return;  // 冻结时不重绘，防闪烁
            }
            resultFrozen = true;
            try {
            const panel = document.getElementById('resultPanel');
            const cv = document.getElementById('resultCanvas');
            if (!panel || !cv) {
                console.error('[Keju] drawResultCanvas: DOM元素缺失');
                return;
            }
            // 直接在 canvas 上画截图 + 红框
            cv.width = canvas.width;
            cv.height = canvas.height;
            const ctx = cv.getContext('2d');
            ctx.drawImage(canvas, 0, 0);
            // 答案红框
            if (correctOptionLabel) {
                const opt = grouped.options.find(o => o.label === correctOptionLabel);
                if (opt) {
                    ctx.save();
                    ctx.strokeStyle = '#e60012';
                    ctx.lineWidth = 6;
                    ctx.strokeRect(opt.x1, opt.y1, opt.x2 - opt.x1, opt.y2 - opt.y1);
                    ctx.restore();
                }
            }
            // Canvas 作为截图显示（隐藏 img）
            document.getElementById('resultImg').style.display = 'none';
            cv.style.display = 'block';
            // 显示/隐藏手动修正面板
            const overridePanel = document.getElementById('manualOverride');
            if (!correctOptionLabel && pendingManualState) {
                overridePanel.classList.add('active');
            } else {
                overridePanel.classList.remove('active');
            }
            } catch(e) {
                console.error('[Keju] drawResultCanvas异常:', e);
            }
        }

        // 兼容包装：文字+截图一次性（用于 testImage 等手动调用）
        function showResult(canvas, grouped, qText, matched, correctOptionLabel) {
            updateResultText(qText, matched, null, null);
            drawResultCanvas(canvas, grouped, correctOptionLabel, false);
        }

        // ========== 识别历史（持久化 + 可纠错）==========
        const HISTORY_KEY = 'keju_history_v1';
        const HISTORY_MAX = 60;
        const HISTORY_THUMB_W = 560;   // 缩略图最大宽度（避免 localStorage 配额爆掉）

        function loadHistory() {
            try {
                const raw = localStorage.getItem(HISTORY_KEY);
                if (raw) history = JSON.parse(raw);
            } catch (e) { history = []; }
        }

        function renderHistory() {
            const el = document.getElementById('historyList');
            if (!el) return;
            if (!history.length) {
                el.innerHTML = '<div class="history-empty">暂无识别记录</div>';
                return;
            }
            el.innerHTML = history.map((h, i) => {
                const q = h.q || '';
                return `
                <div class="history-item">
                    <div class="time">${h.time || ''}</div>
                    <div class="q">${q.slice(0, 40)}${q.length > 40 ? '...' : ''}</div>
                    <div class="a">${h.a || ''}</div>
                    <button class="history-fix-btn" onclick="correctHistory(${i})">纠错</button>
                </div>`;
            }).join('');
        }

        function pushHistory(q, a, snap) {
            history.unshift({ time: new Date().toLocaleTimeString(), q, a, snap });
            if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;
            // 配额保护：超限时逐步丢弃最旧记录再试
            for (let attempt = 0; attempt < 12; attempt++) {
                try {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                    break;
                } catch (e) {
                    if (history.length <= 1) break;
                    history.length = Math.max(1, Math.floor(history.length * 0.7));
                }
            }
            renderHistory();
        }

        // 在识别完成时调用：从 lastDetectState + 显示 canvas 抓取快照（缩略图 + 归一化坐标）
        function recordHistory() {
            try {
                const cv = document.getElementById('resultCanvas');
                if (!cv || !cv.width) return;
                const lds = lastDetectState;
                if (!lds || !lds.grouped) return;
                const q = document.getElementById('resultQuestion').textContent || (lds.qText || '');
                const a = document.getElementById('resultAnswer').textContent || '';

                // 生成缩略图
                const scale = Math.min(1, HISTORY_THUMB_W / cv.width);
                const tw = Math.max(1, Math.round(cv.width * scale));
                const th = Math.max(1, Math.round(cv.height * scale));
                const thumb = document.createElement('canvas');
                thumb.width = tw; thumb.height = th;
                thumb.getContext('2d').drawImage(cv, 0, 0, tw, th);
                let dataUrl;
                try { dataUrl = thumb.toDataURL('image/jpeg', 0.7); } catch (e) { return; }

                // 选项坐标归一化（相对原图），重建时按缩略图尺寸还原
                const ow = cv.width, oh = cv.height;
                const opts = (lds.grouped.options || []).map(o => ({
                    label: o.label,
                    nx1: o.x1 / ow, ny1: o.y1 / oh, nx2: o.x2 / ow, ny2: o.y2 / oh,
                    hashes: (lds.optionHashes || []).find(h => h.label === o.label)?.hashes || null
                }));
                const snap = {
                    canvasDataUrl: dataUrl,
                    thumbW: tw, thumbH: th,
                    qText: lds.qText || q,
                    stemHashes: lds.stemHashes || null,
                    optionHashes: lds.optionHashes || null,
                    matchedAnswer: lds.matchedAnswer || null,
                    options: opts
                };
                pushHistory(q, a, snap);
            } catch (e) {
                console.warn('[Keju] recordHistory 失败(忽略):', e);
            }
        }

        // 历史纠错：重建 pendingManualState 并弹出纠错面板
        window.correctHistory = function(index) {
            const h = history[index];
            if (!h || !h.snap) { updateStatus('warn', '⚠ 该记录无快照，无法纠错'); return; }
            const snap = h.snap;
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                canvas.getContext('2d').drawImage(img, 0, 0);
                // 归一化坐标 → 缩略图坐标
                const ow = canvas.width, oh = canvas.height;
                const options = (snap.options || []).map(o => ({
                    label: o.label,
                    x1: Math.round((o.nx1 ?? o.x1) * ow),
                    y1: Math.round((o.ny1 ?? o.y1) * oh),
                    x2: Math.round((o.nx2 ?? o.x2) * ow),
                    y2: Math.round((o.ny2 ?? o.y2) * oh)
                }));
                const grouped = { options };
                pendingManualState = {
                    canvas, grouped,
                    stemHashes: snap.stemHashes,
                    optionHashes: snap.optionHashes,
                    hashMatched: null,
                    matchedAnswer: snap.matchedAnswer,
                    qText: snap.qText,
                    sourceFile: null
                };
                resultFrozen = false;
                drawResultCanvas(canvas, grouped, null, true);
                updateStatus('info', '📝 正在纠错历史记录，请选择正确答案与错误类型');
            };
            img.src = snap.canvasDataUrl;
        };

        window.clearHistory = function() {
            history = [];
            try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
            renderHistory();
        };

        // ========== 手动修正正确答案 ==========
        window.setManualCorrect = async function(label) {
            if (!pendingManualState) return;
            const { canvas, grouped, stemHashes, optionHashes, hashMatched, matchedAnswer, qText, sourceFile } = pendingManualState;
            const stemKey = makeStemHash(stemHashes);
            const correctOpt = optionHashes.find(o => o.label === label);
            if (!correctOpt) { console.warn('[Keju] 手动修正: 找不到选项', label); return; }

            // 读取错误类型
            const mode = (document.querySelector('input[name="corrMode"]:checked') || {}).value || 'text';

            // 取得所点选项的正确文字：优先用快照里的 optionTexts（历史纠错），否则实时 OCR
            let clickedText = '';
            if (pendingManualState.optionTexts && pendingManualState.optionTexts[label]) {
                clickedText = pendingManualState.optionTexts[label];
            } else {
                try {
                    const texts = await ocrOptionsToTexts(canvas, grouped);
                    clickedText = (texts[label] || '').trim();
                } catch (e) { console.warn('[Keju] 选项OCR失败:', e); }
            }

            // 决定存入的答案文字
            let answerText;
            if (mode === 'box') {
                // 框选错误：答案文字本身正确，仅修正红框位置 → 沿用原答案文字
                answerText = (hashMatched?.answer || matchedAnswer || '').slice(0, 60);
            } else {
                // 文字错误：答案文字本身错 → 以所点选项 OCR 文字作为正确答案
                answerText = (clickedText || hashMatched?.answer || matchedAnswer || '').slice(0, 60);
            }

            // 1) localStorage 位置覆盖（保留原有行为）
            manualCorrections[stemKey] = {
                label: label,
                hashes: correctOpt.hashes,
                questionText: qText?.slice(0, 80) || '',
                answer: answerText,
                time: new Date().toISOString()
            };
            saveManualCorrections();

            // 2) 写入后端 user_corrections.json 覆盖层（跨刷新/跨设备持久）
            const rec = {
                stemHash: stemKey,
                questionText: qText || '',
                normQuestion: normQuestionText(qText || ''),
                answer: answerText,
                correctOptionHashes: correctOpt.hashes,
                mode: mode
            };
            try {
                await fetch('/api/keju/hash-db/upsert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(rec)
                });
                // 更新 in-memory 覆盖层索引，立即生效
                userCorrections = userCorrections.filter(r => r.stemHash !== stemKey && r.normQuestion !== rec.normQuestion);
                userCorrections.push(rec);
                userCorrectionsByStem[stemKey] = rec;
                if (rec.normQuestion) userCorrectionsByNorm[rec.normQuestion] = rec;
                // 同步 in-memory hashDB
                const memEntry = hashDB.get(stemKey);
                if (memEntry) {
                    memEntry.answer = answerText;
                    memEntry.correctOptionHashes = correctOpt.hashes;
                }
                console.log(`[Keju] 纠错已写入覆盖层: mode=${mode} label=${label} answer=${answerText}`);
            } catch (e) {
                console.error('[Keju] 写入覆盖层失败(仅本机 localStorage 生效):', e);
            }

            // 3) 若来自错题库截图，标记该截图已纠正
            if (sourceFile) {
                try {
                    await fetch('/api/keju/wrong-capture/mark-corrected', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ file: sourceFile, correctAnswer: answerText })
                    });
                } catch (e) { console.warn('[Keju] 标记错题库已纠正失败:', e); }
            }

            document.getElementById('manualOverride').classList.remove('active');
            document.getElementById('resultAnswer').textContent = answerText || '未知';
            // 红框重画
            const cv = document.getElementById('resultCanvas');
            const opt = (grouped.options || []).find(o => o.label === label);
            if (cv && opt) {
                const ctx = cv.getContext('2d');
                ctx.save();
                ctx.strokeStyle = '#e60012';
                ctx.lineWidth = 6;
                ctx.strokeRect(opt.x1, opt.y1, opt.x2 - opt.x1, opt.y2 - opt.y1);
                ctx.restore();
            }
            pendingManualState = null;
            updateStatus('success', mode === 'box' ? '✅ 框选错误已修正（位置）' : '✅ 文字错误已修正（已更新题库）');
        };

        window.skipManualCorrect = function() {
            pendingManualState = null;
            document.getElementById('manualOverride').classList.remove('active');
            console.log('[Keju] 跳过手动修正');
        };

        // ========== 标记答案错误：保存截图 + 弹出重选面板 ==========
        window.markAnswerWrong = async function() {
            if (!lastDetectState) {
                updateStatus('warn', '⚠ 暂无可标记的结果');
                console.warn('[Keju] markAnswerWrong: lastDetectState 为空');
                return;
            }
            const btn = document.getElementById('wrongBtn');
            const cv = document.getElementById('resultCanvas');
            if (!cv || !cv.width) {
                updateStatus('warn', '⚠ 截图不可用');
                return;
            }

            // 1) 收集当前展示的元信息
            const qText = document.getElementById('resultQuestion').textContent || lastDetectState.qText || '';
            const recognizedAnswer = document.getElementById('resultAnswer').textContent || '';
            const metaText = document.getElementById('resultMeta').textContent || '';
            const catMatch = metaText.match(/分类:\s*(.+?)\s*$/);
            const categoryName = catMatch ? catMatch[1] : metaText.replace(/^匹配:.*?\|?\s*/, '').trim();

            // 2) 把当前 canvas 截图转成 PNG blob
            const blob = await new Promise(resolve => cv.toBlob(b => resolve(b), 'image/png'));
            if (!blob) {
                updateStatus('warn', '⚠ 截图生成失败');
                return;
            }

            btn.disabled = true;
            btn.textContent = '保存中…';
            let savedFile = '';
            try {
                const form = new FormData();
                form.append('img', blob, 'wrong.png');
                form.append('data', JSON.stringify({
                    qText: qText,
                    recognizedAnswer: recognizedAnswer,
                    categoryName: categoryName
                }));
                const resp = await fetch('/api/keju/mark-wrong', { method: 'POST', body: form });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok || !data.success) {
                    throw new Error(data.error || ('HTTP ' + resp.status));
                }
                savedFile = data.file || '';
                console.log('[Keju] 标记错误截图已保存:', data.file);
                updateStatus('success', '✅ 已保存错误截图，请重选答案');
            } catch (e) {
                console.error('[Keju] 标记错误保存失败:', e);
                updateStatus('warn', '⚠ 截图保存失败: ' + e.message);
                btn.disabled = false;
                btn.textContent = '⚠ 标记错误';
                return;
            }

            // 3) 弹出已有手动重选面板（A/B/C/D），复用 lastDetectState 作为待修正状态
            pendingManualState = {
                canvas: lastDetectState.canvas,
                grouped: lastDetectState.grouped,
                stemHashes: lastDetectState.stemHashes,
                optionHashes: lastDetectState.optionHashes,
                hashMatched: lastDetectState.hashMatched || null,
                matchedAnswer: lastDetectState.matchedAnswer || null,
                qText: lastDetectState.qText,
                sourceFile: savedFile
            };
            resultFrozen = false;
            // 用 null 标签重画 → 触发手动修正面板显示（drawResultCanvas 内部逻辑）
            drawResultCanvas(lastDetectState.canvas, lastDetectState.grouped, null, true);
            btn.disabled = false;
            btn.textContent = '⚠ 标记错误';
        };

        // 导出手动修正数据（可合并到 hash-db.json）
        window.exportManualCorrections = function() {
            const blob = new Blob([JSON.stringify(manualCorrections, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'manual_corrections.json';
            a.click();
            URL.revokeObjectURL(url);
            console.log('[Keju] 导出', Object.keys(manualCorrections).length, '条手动修正');
        };

        // ========== 图片测试 ==========
        window.testImage = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 解冻截图，允许 testImage 的 showResult 重绘
            resultFrozen = false;
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('detectInfoBox').style.display = 'flex';

            if (!modelReady) await loadModel();

            const img = new Image();
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const t0 = performance.now();
                const dets = await runYOLO(canvas);
                const t1 = performance.now();
                console.log(`[Keju] YOLO: ${(t1-t0).toFixed(0)}ms`);

                const grouped = groupDetection(dets);
                const yoloOptions = grouped.options.map(o => ({ ...o }));
                enhanceOptionsWithProjection(canvas, grouped);
                updateBadges(grouped);

                if (grouped.question) {
                    // ===== 哈希匹配（主路径）=====
                    let hashMatched = null;
                    let correctOptionLabel = null;
                    let qText = null;
                    let stemHashes = null;
                    let optionHashes = null;

                    if (hashDBEntries.length > 0 && yoloOptions.length > 0) {
                        const qCanvas = cropRegion(canvas, grouped.question);
                        stemHashes = computeAllHashes(qCanvas);

                        optionHashes = [];
                        for (const opt of yoloOptions) {
                            const oCanvas = cropRegion(canvas, {
                                x1: Math.max(0, opt.x1 - 5),
                                y1: Math.max(0, opt.y1 - 5),
                                x2: Math.min(canvas.width, opt.x2 + 5),
                                y2: Math.min(canvas.height, opt.y2 + 5)
                            });
                            optionHashes.push({
                                label: opt.label,
                                hashes: computeAllHashes(oCanvas)
                            });
                        }

                        const stemHash = makeStemHash(stemHashes);
                        const exactMatch = hashDB.get(stemHash);
                        if (exactMatch) {
                            hashMatched = exactMatch;
                            qText = exactMatch.questionText;
                            console.log('[Keju] 哈希精确匹配:', qText.slice(0, 30), '→', exactMatch.answer?.slice(0, 15));
                        } else {
                            const HASH_THRESHOLD = 0.95;
                            let bestEntry = null, bestScore = 0;
                            for (const entry of hashDBEntries) {
                                const parts = entry.stemHash.split(':');
                                if (parts.length !== 3) continue;
                                const storedHashes = {
                                    gridHash: parts[0],
                                    rowHash: parts[1],
                                    columnHash: parts[2]
                                };
                                const score = combinedHashScore(stemHashes, storedHashes);
                                if (score > bestScore) {
                                    bestScore = score;
                                    bestEntry = entry;
                                }
                            }
                            if (bestEntry && bestScore >= HASH_THRESHOLD) {
                                hashMatched = bestEntry;
                                qText = bestEntry.questionText;
                                console.log('[Keju] 哈希模糊匹配:', qText?.slice(0, 30),
                                    'score=' + bestScore.toFixed(3), '→', bestEntry.answer?.slice(0, 15));
                            }
                        }
                    }

                    // 哈希匹配成功，用选项哈希找正确位置（和对方一致，不OCR）
                    if (hashMatched) {
                        const stemKey = makeStemHash(stemHashes);
                        // 0. 用户纠错覆盖层（最高优先级）：先覆盖答案，再覆盖位置
                        const uc = userCorrectionsByStem[stemKey];
                        if (uc) {
                            if (uc.answer) hashMatched.answer = uc.answer;
                            if (uc.correctOptionHashes && optionHashes) {
                                const lbl = matchOptionByHash(optionHashes, uc.correctOptionHashes);
                                if (lbl) {
                                    correctOptionLabel = lbl;
                                    console.log(`[Keju] 用户覆盖层命中(位置): label=${lbl}`);
                                }
                            }
                        }
                        // 1. 先查 hash-db.json 的 correctOptionHashes
                        if (!correctOptionLabel && hashMatched.correctOptionHashes && optionHashes) {
                            correctOptionLabel = matchOptionByHash(optionHashes, hashMatched.correctOptionHashes);
                        }
                        // 2. 再查手动修正
                        if (!correctOptionLabel) {
                            const correction = manualCorrections[stemKey];
                            if (correction && optionHashes) {
                                correctOptionLabel = matchOptionByHash(optionHashes, correction.hashes);
                                if (correctOptionLabel) console.log(`[Keju] 手动修正命中: label=${correctOptionLabel}`);
                            }
                        }
                        // 3. OCR 回退
                        if (!correctOptionLabel) {
                            const tOcr = performance.now();
                            correctOptionLabel = await ocrAndMatch(canvas, grouped, hashMatched.answer);
                            console.log(`[Keju] 选项OCR(哈希回退): ${(performance.now()-tOcr).toFixed(0)}ms → label=${correctOptionLabel}`);
                            if (!correctOptionLabel && optionHashes) {
                                pendingManualState = { hashMatched, stemHashes, optionHashes, canvas, grouped, qText };
                            }
                        }
                        console.log(`[Keju] 总耗时(哈希): ${(performance.now()-t0).toFixed(0)}ms`);
                        showResult(canvas, grouped, qText, [{ q: qText, a: hashMatched.answer, categoryName: hashMatched.categoryName }], correctOptionLabel);
                        lastDetectState = { canvas, grouped, stemHashes, optionHashes, qText, hashMatched, matchedAnswer: hashMatched?.answer };
                        recordHistory();
                        updateStatus('success', '✅ 哈希匹配');
                        return;
                    }

                    // ===== 哈希未匹配，回退 OCR =====
                    console.log('[Keju] 哈希未匹配，回退 OCR (testImage)');
                    try {
                        const t2 = performance.now();
                        const qCanvas = cropRegion(canvas, grouped.question);
                        if (!qCanvas) throw new Error('cropRegion 返回 null');
                        qText = await runOCR(qCanvas);
                        const t3 = performance.now();
                        console.log(`[Keju] 题目OCR: ${(t3-t2).toFixed(0)}ms →`, qText);
                    } catch(e) {
                        console.error('[Keju] 题目OCR异常(testImage):', e);
                        qText = null;
                    }
                    console.log(`[Keju] OCR结果: qText="${qText?.slice(0,50)}" len=${qText?.length||0}`);

                    if (qText && qText.length > 2) {
                        const matched = searchQuestions(qText);

                        if (matched.length > 0 && grouped.options.length > 0) {
                            const t4 = performance.now();
                            correctOptionLabel = await ocrAndMatch(canvas, grouped, matched[0].a);
                            const t5 = performance.now();
                            console.log(`[Keju] 选项OCR: ${(t5-t4).toFixed(0)}ms → label=${correctOptionLabel}`);
                            // OCR 失败 → 保存状态供手动修正（非哈希路径）
                            if (!correctOptionLabel) {
                                if (!stemHashes) {
                                    stemHashes = computeAllHashes(cropRegion(canvas, grouped.question));
                                }
                                if (!optionHashes && yoloOptions.length > 0) {
                                    optionHashes = [];
                                    for (const opt of yoloOptions) {
                                        const oCanvas = cropRegion(canvas, {
                                            x1: Math.max(0, opt.x1 - 5),
                                            y1: Math.max(0, opt.y1 - 5),
                                            x2: Math.min(canvas.width, opt.x2 + 5),
                                            y2: Math.min(canvas.height, opt.y2 + 5)
                                        });
                                        optionHashes.push({ label: opt.label, hashes: computeAllHashes(oCanvas) });
                                    }
                                }
                                if (optionHashes && stemHashes) {
                                    pendingManualState = {
                                        hashMatched: null,
                                        matchedAnswer: matched[0].a,
                                        stemHashes, optionHashes, canvas, grouped, qText
                                    };
                                    console.log('[Keju] OCR失败（非哈希 testImage），等待手动修正');
                                }
                            }
                        }

                        // OCR 成功后存入哈希库
                        if (correctOptionLabel && matched.length > 0) {
                            const best = matched[0];
                            if (!stemHashes) {
                                stemHashes = computeAllHashes(cropRegion(canvas, grouped.question));
                            }
                            if (!optionHashes && yoloOptions.length > 0) {
                                optionHashes = [];
                                // 用原始YOLO框计算哈希入库，保证后续匹配一致
                                for (const opt of yoloOptions) {
                                    const oCanvas = cropRegion(canvas, {
                                        x1: Math.max(0, opt.x1 - 5),
                                        y1: Math.max(0, opt.y1 - 5),
                                        x2: Math.min(canvas.width, opt.x2 + 5),
                                        y2: Math.min(canvas.height, opt.y2 + 5)
                                    });
                                    optionHashes.push({
                                        label: opt.label,
                                        hashes: computeAllHashes(oCanvas)
                                    });
                                }
                            }
                            // 提取正确答案的选项哈希
                            let correctOptHashes = null;
                            if (correctOptionLabel && optionHashes) {
                                const correctOpt = optionHashes.find(o => o.label === correctOptionLabel);
                                if (correctOpt) correctOptHashes = correctOpt.hashes;
                            }
                            addToHashDB({
                                stemHash: makeStemHash(stemHashes),
                                optionHash: optionHashes ? optionHashes.map(o =>
                                    `${o.label}:${o.hashes.gridHash}:${o.hashes.rowHash}:${o.hashes.columnHash}`
                                ).join('|') : '',
                                questionText: qText,
                                answer: best.a,
                                correctOptionHashes: correctOptHashes,
                                categoryName: best.categoryName || best.category
                            });
                        }

                        console.log(`[Keju] 总耗时: ${(performance.now()-t0).toFixed(0)}ms`);
                        showResult(canvas, grouped, qText, matched, correctOptionLabel);
                        lastDetectState = { canvas, grouped, stemHashes, optionHashes, qText, hashMatched: null, matchedAnswer: matched?.length ? matched[0].a : null };
                        recordHistory();
                        updateStatus('success', '✅ 识别成功');
                    }
                } else {
                    // OCR 完全失败，尝试弹出手动修正
                    if (grouped && grouped.options.length > 0 && grouped.question) {
                        if (!stemHashes) {
                            stemHashes = computeAllHashes(cropRegion(canvas, grouped.question));
                        }
                        if (!optionHashes && yoloOptions.length > 0) {
                            optionHashes = [];
                            for (const opt of yoloOptions) {
                                const oCanvas = cropRegion(canvas, {
                                    x1: Math.max(0, opt.x1 - 5),
                                    y1: Math.max(0, opt.y1 - 5),
                                    x2: Math.min(canvas.width, opt.x2 + 5),
                                    y2: Math.min(canvas.height, opt.y2 + 5)
                                });
                                optionHashes.push({ label: opt.label, hashes: computeAllHashes(oCanvas) });
                            }
                        }
                        if (optionHashes && stemHashes) {
                            pendingManualState = {
                                hashMatched: null,
                                matchedAnswer: '',
                                stemHashes, optionHashes, canvas, grouped, qText: ''
                            };
                            showResult(canvas, grouped, '', [], null);
                            console.log('[Keju] OCR完全失败(testImage)，弹出手动修正面板');
                        } else {
                            updateStatus('', '❌ 未检测到题目');
                        }
                    } else {
                        updateStatus('', '❌ 未检测到题目');
                    }
                }
            };
            img.src = URL.createObjectURL(file);
        }

        // ========== 题库管理（用户纠错覆盖层）==========
        window.openCorrectionManager = async function() {
            document.getElementById('corrManagerMask').style.display = 'block';
            document.getElementById('corrManager').style.display = 'block';
            try {
                const resp = await fetch('/mhxy/static/user_corrections.json?t=' + Date.now());
                if (resp.ok) {
                    const arr = await resp.json();
                    userCorrections = Array.isArray(arr) ? arr : [];
                }
            } catch (e) { /* 忽略，用内存中的 */ }
            renderCorrManager();
        };
        window.closeCorrectionManager = function() {
            document.getElementById('corrManagerMask').style.display = 'none';
            document.getElementById('corrManager').style.display = 'none';
        };
        function renderCorrManager() {
            const list = document.getElementById('cmList');
            const kw = (document.getElementById('cmSearch').value || '').trim();
            const items = (userCorrections || []).filter(r => {
                if (!kw) return true;
                return (r.questionText || '').includes(kw) || (r.normQuestion || '').includes(kw) || (r.answer || '').includes(kw);
            });
            document.getElementById('cmCount').textContent = `共 ${items.length} 条`;
            if (!items.length) { list.innerHTML = '<div class="cm-empty">暂无纠错数据（识别时纠错后会自动出现在这里）</div>'; return; }
            list.innerHTML = items.map(r => {
                const idx = userCorrections.indexOf(r);
                return `<div class="cm-item">
                    <div class="cm-q">${escapeHtml(r.questionText || r.normQuestion || '(无题干)')}</div>
                    <div class="cm-a">答案: <b>${escapeHtml(r.answer || '')}</b><span class="cm-mode">${r.mode === 'box' ? '框选错误' : '文字错误'}</span></div>
                    <div class="cm-actions">
                        <button onclick="cmEdit(${idx})">改答案</button>
                        <button onclick="cmDelete(${idx})">删除</button>
                    </div>
                </div>`;
            }).join('');
        }
        window.cmEdit = async function(idx) {
            const r = userCorrections[idx];
            if (!r) return;
            const nv = prompt('修改正确答案：', r.answer || '');
            if (nv === null) return;
            const answer = nv.trim();
            if (!answer) return;
            try {
                const resp = await fetch('/api/keju/hash-db/upsert', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        stemHash: r.stemHash, questionText: r.questionText, normQuestion: r.normQuestion,
                        answer, correctOptionHashes: r.correctOptionHashes, mode: r.mode || 'text'
                    })
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                Object.assign(r, { answer });
                userCorrectionsByStem[r.stemHash] = Object.assign({}, r);
                if (r.normQuestion) userCorrectionsByNorm[r.normQuestion] = Object.assign({}, r);
                const memEntry = hashDB.get(r.stemHash);
                if (memEntry) memEntry.answer = answer;
                renderCorrManager();
                updateStatus('success', '✅ 答案已更新');
            } catch (e) { console.error(e); updateStatus('warn', '⚠ 更新失败: ' + e.message); }
        };
        window.cmDelete = async function(idx) {
            const r = userCorrections[idx];
            if (!r) return;
            if (!confirm('确认删除该纠错条目？删除后此题将恢复内置库答案。')) return;
            try {
                const resp = await fetch('/api/keju/hash-db/delete', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stemHash: r.stemHash, normQuestion: r.normQuestion })
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                userCorrections.splice(idx, 1);
                delete userCorrectionsByStem[r.stemHash];
                if (r.normQuestion) delete userCorrectionsByNorm[r.normQuestion];
                renderCorrManager();
                updateStatus('success', '✅ 已删除');
            } catch (e) { console.error(e); updateStatus('warn', '⚠ 删除失败: ' + e.message); }
        };
        function escapeHtml(s) {
            return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // ========== 启动 ==========
        init();
    </script>
    <!-- 使用说明（方案 A）：悬浮按钮 + 右侧抽屉 -->
    <div id="helpMount" data-module="keju"></div>
    <script src="/mhxy/static/help-data.js"></script>
