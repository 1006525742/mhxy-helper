<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>截图工具 - YOLO训练数据采集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .navbar-top {
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-brand .logo {
            font-size: 24px;
        }
        .navbar-brand h1 {
            font-size: 18px;
            color: #fff;
            font-weight: 600;
        }
        .navbar-link {
            color: #4fc3f7;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .navbar-link:hover {
            color: #7c4dff;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            height: calc(100vh - 60px);
        }
        .panel {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .panel-title {
            font-size: 16px;
            color: #4fc3f7;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .window-select {
            width: 100%;
            padding: 10px;
            background: #2a2a4a;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .window-select option {
            background: #2a2a4a;
            color: #fff;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            margin: 5px 0;
            width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4fc3f7, #7c4dff);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 195, 247, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #fff;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 200, 83, 0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff5252, #ff1744);
            color: #fff;
        }
        .btn-warning {
            background: linear-gradient(135deg, #ffa726, #ff9800);
            color: #fff;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .screenshot-area {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            min-height: 400px;
        }
        .screenshot-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .screenshot-placeholder {
            color: #666;
            font-size: 16px;
            text-align: center;
        }
        .screenshot-placeholder .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .stats-panel {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }
        .stat-label {
            color: #888;
        }
        .stat-value {
            color: #4fc3f7;
            font-weight: 600;
        }
        .history-panel {
            margin-top: 20px;
        }
        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .history-item:hover {
            background: rgba(79, 195, 247, 0.2);
        }
        .history-item img {
            width: 100%;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .auto-collect-section {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,200,83,0.1);
            border-radius: 8px;
            border: 1px solid rgba(0,200,83,0.3);
        }
        .auto-collect-section.active {
            background: rgba(0,200,83,0.2);
            border-color: #00c853;
        }
        .interval-input {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .interval-input input {
            width: 80px;
            padding: 8px;
            background: #2a2a4a;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        .interval-input span {
            color: #888;
            font-size: 14px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            background: rgba(0,0,0,0.9);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: rgba(0,200,83,0.9);
        }
        .toast.error {
            background: rgba(255,82,82,0.9);
        }
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(79, 195, 247, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(79, 195, 247, 0.8);
        }
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .preview-panel .screenshot-area {
            flex: 1;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="navbar-top">
        <div class="navbar-brand">
            <span class="logo">📸</span>
            <h1>截图工具 - YOLO训练数据采集</h1>
        </div>
        <a href="/" class="navbar-link">
            <span>🏠</span> 返回主页
        </a>
    </div>

    <div class="container">
        <!-- 左侧控制面板 -->
        <div class="panel">
            <div class="panel-title">窗口选择</div>
            <select class="window-select" id="windowSelect">
                <option value="">-- 请选择窗口 --</option>
            </select>

            <button class="btn btn-primary" id="refreshBtn" style="margin-top: 15px;">
                <span>🔄</span> 刷新窗口列表
            </button>

            <button class="btn btn-success" id="captureBtn" disabled style="margin-top: 10px;">
                <span>📸</span> 截图保存
            </button>

            <!-- 自动采集 -->
            <div class="auto-collect-section" id="autoCollectSection">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <span style="font-weight: 600; color: #00c853;">自动采集</span>
                    <button class="btn btn-warning" id="autoCollectBtn" disabled style="width: auto; padding: 8px 15px;">
                        <span>▶</span> 开始
                    </button>
                </div>
                <div class="interval-input">
                    <span>间隔:</span>
                    <input type="number" id="intervalInput" value="1" min="0.5" max="10" step="0.5">
                    <span>秒</span>
                </div>
            </div>

            <!-- 统计信息 -->
            <div class="stats-panel">
                <div class="stat-row">
                    <span class="stat-label">已保存截图</span>
                    <span class="stat-value" id="savedCount">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">当前窗口</span>
                    <span class="stat-value" id="currentWindow">--</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">保存路径</span>
                    <span class="stat-value" style="font-size: 12px;">mhxy_web/data/images/</span>
                </div>
            </div>

            <!-- 历史记录 -->
            <div class="history-panel">
                <div class="panel-title" style="margin-bottom: 10px;">最近截图</div>
                <div class="history-list" id="historyList">
                    <div style="color: #666; font-size: 12px; text-align: center;">暂无截图</div>
                </div>
            </div>

            <button class="btn btn-danger" id="clearBtn" style="margin-top: 15px;">
                <span>🗑️</span> 清空所有截图
            </button>
        </div>

        <!-- 右侧预览区 -->
        <div class="right-panel">
            <div class="panel preview-panel">
                <div class="panel-title">截图预览</div>
                <div class="screenshot-area" id="screenshotArea">
                    <div class="screenshot-placeholder">
                        <div class="icon">🖼️</div>
                        <div>请先选择窗口</div>
                        <div style="font-size: 12px; margin-top: 5px;">截图将实时显示在此处</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>

    <script>
        // API基础路径（使用8765端口）
        const API_BASE = 'http://localhost:8765';

        let selectedHwnd = null;
        let selectedTitle = '';
        let autoCollecting = false;
        let autoCollectTimer = null;
        let savedImages = [];

        // 初始化
        async function init() {
            await refreshWindows();
            await loadCollectedImages();

            // 定时刷新预览
            setInterval(updatePreview, 2000);
        }

        // 刷新窗口列表
        async function refreshWindows() {
            try {
                const res = await fetch(`${API_BASE}/api/windows`);
                const windows = await res.json();

                const select = document.getElementById('windowSelect');
                select.innerHTML = '<option value="">-- 请选择窗口 --</option>';

                windows.forEach(w => {
                    const option = document.createElement('option');
                    option.value = w.hwnd;
                    option.textContent = `${w.title} (${w.width}x${w.height})`;
                    select.appendChild(option);
                });

                showToast('窗口列表已刷新', 'success');
            } catch (e) {
                showToast('刷新窗口失败: ' + e.message, 'error');
            }
        }

        // 选择窗口
        async function selectWindow(hwnd) {
            if (!hwnd) {
                selectedHwnd = null;
                document.getElementById('captureBtn').disabled = true;
                document.getElementById('autoCollectBtn').disabled = true;
                document.getElementById('currentWindow').textContent = '--';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/select-window`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hwnd: parseInt(hwnd) })
                });
                const data = await res.json();

                if (data.ok) {
                    selectedHwnd = hwnd;
                    selectedTitle = data.title;
                    document.getElementById('captureBtn').disabled = false;
                    document.getElementById('autoCollectBtn').disabled = false;
                    document.getElementById('currentWindow').textContent = data.title;
                    showToast('已选择窗口: ' + data.title, 'success');

                    // 立即更新预览
                    updatePreview();
                } else {
                    showToast('选择窗口失败', 'error');
                }
            } catch (e) {
                showToast('选择窗口失败: ' + e.message, 'error');
            }
        }

        // 截图保存
        async function captureAndSave() {
            if (!selectedHwnd) {
                showToast('请先选择窗口', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/collect`, {
                    method: 'POST'
                });
                const data = await res.json();

                if (data.saved) {
                    showToast(`截图保存成功: ${data.filename} (共${data.total}张)`, 'success');
                    document.getElementById('savedCount').textContent = data.total;
                    await loadCollectedImages();
                    await updatePreview();
                } else {
                    showToast('截图失败: ' + data.error, 'error');
                }
            } catch (e) {
                showToast('截图失败: ' + e.message, 'error');
            }
        }

        // 更新预览
        async function updatePreview() {
            if (!selectedHwnd) return;

            try {
                const res = await fetch(`${API_BASE}/api/screenshot`);
                const data = await res.json();

                if (data.image) {
                    const area = document.getElementById('screenshotArea');
                    area.innerHTML = `<img src="data:image/jpeg;base64,${data.image}" alt="截图预览">`;
                }
            } catch (e) {
                // 静默失败
            }
        }

        // 加载已收集的图片列表
        async function loadCollectedImages() {
            try {
                const res = await fetch(`${API_BASE}/api/collected`);
                const data = await res.json();

                document.getElementById('savedCount').textContent = data.count;
                savedImages = data.images || [];

                // 渲染历史列表
                renderHistoryList();
            } catch (e) {
                console.error('加载图片列表失败:', e);
            }
        }

        // 渲染历史列表
        function renderHistoryList() {
            const list = document.getElementById('historyList');

            if (savedImages.length === 0) {
                list.innerHTML = '<div style="color: #666; font-size: 12px; text-align: center;">暂无截图</div>';
                return;
            }

            // 只显示最近20张
            const recentImages = savedImages.slice(-20).reverse();

            list.innerHTML = recentImages.map(img => `
                <div class="history-item" onclick="previewImage('${img}')">
                    <img src="${API_BASE}/data/images/${img}" alt="${img}">
                    <div>${img.replace('frame_', '').replace('.jpg', '')}</div>
                </div>
            `).join('');
        }

        // 预览图片
        function previewImage(imgName) {
            const area = document.getElementById('screenshotArea');
            area.innerHTML = `<img src="${API_BASE}/data/images/${imgName}" alt="${imgName}">`;
        }

        // 自动采集
        function toggleAutoCollect() {
            if (autoCollecting) {
                // 停止
                autoCollecting = false;
                if (autoCollectTimer) {
                    clearInterval(autoCollectTimer);
                    autoCollectTimer = null;
                }
                document.getElementById('autoCollectBtn').innerHTML = '<span>▶</span> 开始';
                document.getElementById('autoCollectSection').classList.remove('active');
                showToast('自动采集已停止', 'success');
            } else {
                // 开始
                autoCollecting = true;
                const interval = parseFloat(document.getElementById('intervalInput').value) * 1000;

                autoCollectTimer = setInterval(captureAndSave, interval);

                document.getElementById('autoCollectBtn').innerHTML = '<span>⏹</span> 停止';
                document.getElementById('autoCollectSection').classList.add('active');
                showToast(`自动采集已开始 (间隔${interval/1000}秒)`, 'success');

                // 立即截图一次
                captureAndSave();
            }
        }

        // 清空所有截图
        async function clearAllImages() {
            if (!confirm('确定要清空所有截图吗？此操作不可恢复！')) {
                return;
            }

            try {
                // 由于没有清空API，我们逐个删除最近20张
                for (const img of savedImages.slice(-20)) {
                    await fetch(`${API_BASE}/api/annotate/delete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: img })
                    });
                }

                showToast('已清空最近截图', 'success');
                await loadCollectedImages();
            } catch (e) {
                showToast('清空失败: ' + e.message, 'error');
            }
        }

        // Toast提示
        function showToast(msg, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;

            setTimeout(() => {
                toast.className = 'toast';
            }, 2000);
        }

        // 事件绑定
        document.getElementById('windowSelect').addEventListener('change', (e) => {
            selectWindow(e.target.value);
        });

        document.getElementById('refreshBtn').addEventListener('click', refreshWindows);
        document.getElementById('captureBtn').addEventListener('click', captureAndSave);
        document.getElementById('autoCollectBtn').addEventListener('click', toggleAutoCollect);
        document.getElementById('clearBtn').addEventListener('click', clearAllImages);

        // 启动
        init();
    </script>
</body>
</html>
