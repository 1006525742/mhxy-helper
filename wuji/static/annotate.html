<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片标注工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f23; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
.header { background: #16213e; padding: 12px 24px; display: flex; align-items: center; gap: 20px; border-bottom: 2px solid #0f3460; }
.header h1 { font-size: 18px; color: #e94560; }
.btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
.btn-primary { background: #0f3460; color: #eee; }
.btn-primary:hover { background: #1a5276; }
.btn-success { background: #1b5e20; color: #eee; }
.btn-success:hover { background: #2e7d32; }
.btn-warning { background: #e65100; color: #eee; }
.btn-warning:hover { background: #f57c00; }
.btn-danger { background: #b71c1c; color: #eee; }
.btn-danger:hover { background: #c62828; }
.info-bar { background: #1a1a2e; padding: 8px 24px; display: flex; align-items: center; gap: 20px; font-size: 14px; }
.info-bar span { color: #4fc3f7; }
.main { display: flex; flex: 1; padding: 16px; gap: 16px; }
.left-panel { flex: 1; display: flex; flex-direction: column; }
.image-list { background: #16213e; padding: 10px; border-radius: 8px; max-height: 120px; overflow-y: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.image-thumb { width: 80px; height: 60px; border-radius: 4px; cursor: pointer; border: 2px solid #0f3460; object-fit: cover; }
.image-thumb.active { border-color: #e94560; }
.image-thumb:hover { border-color: #4fc3f7; }
.canvas-container { flex: 1; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 2px solid #0f3460; }
#annotateCanvas { max-width: 100%; max-height: 100%; cursor: crosshair; }
.right-panel { width: 280px; background: #16213e; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel-title { font-size: 14px; color: #e94560; margin-bottom: 8px; font-weight: bold; }
.class-list { display: flex; flex-direction: column; gap: 8px; }
.class-btn { padding: 10px; border-radius: 4px; cursor: pointer; border: 2px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 14px; }
.class-btn:hover { border-color: #4fc3f7; }
.class-btn.selected { border-color: #e94560; background: #0f3460; }
.annotation-list { flex: 1; overflow-y: auto; }
.annotation-item { background: #1a1a2e; padding: 8px; margin-bottom: 6px; border-radius: 4px; border-left: 3px solid #0f3460; display: flex; justify-content: space-between; align-items: center; }
.annotation-item .cls-name { color: #4fc3f7; font-weight: bold; }
.annotation-item .coords { color: #888; font-size: 12px; }
.annotation-item .delete-btn { background: #b71c1c; color: #eee; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
.status { padding: 8px; border-radius: 4px; font-size: 13px; text-align: center; }
.status.saved { background: #1b5e20; }
.status.unsaved { background: #e65100; }
.help { background: #1a1a2e; padding: 10px; border-radius: 4px; font-size: 12px; line-height: 1.6; color: #aaa; }
</style>
</head>
<body>
<div class="header">
  <h1>图片标注工具</h1>
  <button class="btn btn-primary" onclick="loadImages()">加载图片</button>
  <button class="btn btn-success" onclick="autoAnnotateAll()" style="background:#2e7d32">自动标注全部</button>
  <button class="btn btn-success" onclick="autoAnnotateCurrent()">自动标注当前</button>
  <button class="btn btn-success" onclick="saveAnnotations()">保存标注</button>
  <button class="btn btn-warning" onclick="prevImage()">上一张</button>
  <button class="btn btn-warning" onclick="nextImage()">下一张</button>
  <button class="btn btn-danger" onclick="clearCurrent()">清除当前</button>
  <button class="btn btn-danger" onclick="deleteCurrentImage()" style="background:#c62828">🗑 删除图片</button>
  <button class="btn btn-warning" onclick="testCurrentImage()" style="background:#e65100">🧪 测试识别</button>
</div>

<div class="info-bar">
  当前图片: <span id="currentImageName">无</span> |
  进度: <span id="progress">0/0</span> |
  当前标注: <span id="annotationCount">0</span>个
</div>

<div class="main">
  <div class="left-panel">
    <div class="image-list" id="imageList"></div>
    <div class="canvas-container">
      <canvas id="annotateCanvas"></canvas>
    </div>
  </div>

  <div class="right-panel">
    <div>
      <div class="panel-title">选择类别</div>
      <div class="class-list" id="classList"></div>
    </div>

    <div>
      <div class="panel-title">标注列表</div>
      <div class="annotation-list" id="annotationList"></div>
    </div>

    <div class="status unsaved" id="status">未保存</div>

    <div id="testResultPanel" style="display:none">
      <div class="panel-title">🧪 测试结果</div>
      <div id="testResultContent" style="background:#1a1a2e;padding:8px;border-radius:4px;font-size:12px;max-height:200px;overflow-y:auto"></div>
    </div>

    <div>
      <div class="panel-title">操作说明</div>
      <div class="help">
        1. 点击左侧图片选择要标注的图片<br>
        2. 在右侧选择类别<br>
        3. 在图片上拖拽鼠标绘制矩形框<br>
        4. 点击保存标注按钮保存<br>
        5. 使用上一张/下一张切换图片
      </div>
    </div>
  </div>
</div>

<script>
let images = [];
let currentIndex = -1;
let annotations = {};
let selectedClass = 0;
let isDrawing = false;
let startX, startY;
let canvas, ctx;
let currentImage = null;

const classes = ['treasure_map', 'inventory_panel', 'cursor', 'coord_popup'];

// 初始化
canvas = document.getElementById('annotateCanvas');
ctx = canvas.getContext('2d');

// 加载类别按钮
function loadClasses() {
  const list = document.getElementById('classList');
  list.innerHTML = '';
  classes.forEach((cls, i) => {
    const btn = document.createElement('div');
    btn.className = 'class-btn' + (i === selectedClass ? ' selected' : '');
    btn.textContent = cls;
    btn.onclick = () => {
      selectedClass = i;
      document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    list.appendChild(btn);
  });
}

// 加载图片列表
async function loadImages() {
  try {
    const resp = await fetch('/api/annotate/images');
    const data = await resp.json();
    images = data.images || [];
    annotations = data.annotations || {};
    updateImageList();
    updateProgress();
    if (images.length > 0) {
      selectImage(0);
    }
  } catch(e) {
    alert('加载图片失败: ' + e);
  }
}

// 更新图片列表
function updateImageList() {
  const list = document.getElementById('imageList');
  list.innerHTML = '';
  images.forEach((img, i) => {
    const thumb = document.createElement('img');
    thumb.className = 'image-thumb' + (i === currentIndex ? ' active' : '');
    thumb.src = '/data/images/' + img;
    thumb.onclick = () => selectImage(i);
    list.appendChild(thumb);
  });
}

// 选择图片
function selectImage(index) {
  currentIndex = index;
  currentImageName = images[index];
  document.getElementById('currentImageName').textContent = currentImageName;
  updateImageList();
  updateProgress();
  loadImage(currentImageName);
}

// 加载图片到画布
function loadImage(name) {
  const img = new Image();
  img.onload = () => {
    currentImage = img;
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    drawAnnotations();
  };
  img.src = '/data/images/' + name;
}

// 绘制标注框
function drawAnnotations() {
  if (!currentImageName) return;
  const anns = annotations[currentImageName] || [];
  anns.forEach((ann, i) => {
    const cls = ann.class;
    const colors = ['#e94560', '#4fc3f7', '#66bb6a'];
    ctx.strokeStyle = colors[cls] || '#e94560';
    ctx.lineWidth = 2;
    ctx.strokeRect(ann.x, ann.y, ann.w, ann.h);
    // 类别标签
    ctx.fillStyle = colors[cls] || '#e94560';
    ctx.font = '14px sans-serif';
    ctx.fillText(classes[cls], ann.x + 4, ann.y + 16);
  });
  document.getElementById('annotationCount').textContent = anns.length;
  updateAnnotationList();
}

// 更新标注列表
function updateAnnotationList() {
  const list = document.getElementById('annotationList');
  list.innerHTML = '';
  if (!currentImageName) return;
  const anns = annotations[currentImageName] || [];
  anns.forEach((ann, i) => {
    const div = document.createElement('div');
    div.className = 'annotation-item';
    div.innerHTML = `<span class="cls-name">${classes[ann.class]}</span>
      <span class="coords">(${Math.round(ann.x)},${Math.round(ann.y)}) ${Math.round(ann.w)}x${Math.round(ann.h)}</span>
      <button class="delete-btn" onclick="deleteAnnotation(${i})">删除</button>`;
    list.appendChild(div);
  });
}

// 删除标注
function deleteAnnotation(index) {
  if (!currentImageName) return;
  annotations[currentImageName].splice(index, 1);
  redraw();
  document.getElementById('status').className = 'status unsaved';
  document.getElementById('status').textContent = '未保存';
}

// 重绘画布
function redraw() {
  if (!currentImage) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(currentImage, 0, 0);
  drawAnnotations();
}

// 获取缩放比例
function getScale() {
  const rect = canvas.getBoundingClientRect();
  return {
    scaleX: canvas.width / rect.width,
    scaleY: canvas.height / rect.height
  };
}

// 鼠标事件
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scale = getScale();
  startX = (e.clientX - rect.left) * scale.scaleX;
  startY = (e.clientY - rect.top) * scale.scaleY;
  isDrawing = true;
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDrawing) return;
  const rect = canvas.getBoundingClientRect();
  const scale = getScale();
  const x = (e.clientX - rect.left) * scale.scaleX;
  const y = (e.clientY - rect.top) * scale.scaleY;
  redraw();
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2;
  ctx.strokeRect(startX, startY, x - startX, y - startY);
});

canvas.addEventListener('mouseup', (e) => {
  if (!isDrawing) return;
  isDrawing = false;
  const rect = canvas.getBoundingClientRect();
  const scale = getScale();
  const endX = (e.clientX - rect.left) * scale.scaleX;
  const endY = (e.clientY - rect.top) * scale.scaleY;

  // 计算矩形
  const x = Math.min(startX, endX);
  const y = Math.min(startY, endY);
  const w = Math.abs(endX - startX);
  const h = Math.abs(endY - startY);

  if (w > 10 && h > 10) {
    if (!annotations[currentImageName]) {
      annotations[currentImageName] = [];
    }
    annotations[currentImageName].push({
      class: selectedClass,
      x: x,
      y: y,
      w: w,
      h: h
    });
    redraw();
    document.getElementById('status').className = 'status unsaved';
    document.getElementById('status').textContent = '未保存';
  }
});

// 保存标注
async function saveAnnotations() {
  try {
    const resp = await fetch('/api/annotate/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({annotations: annotations})
    });
    const data = await resp.json();
    if (data.success) {
      document.getElementById('status').className = 'status saved';
      document.getElementById('status').textContent = '已保存';
      updateProgress();
      alert('标注已保存！');
    }
  } catch(e) {
    alert('保存失败: ' + e);
  }
}

// 上一张
function prevImage() {
  if (currentIndex > 0) {
    selectImage(currentIndex - 1);
  }
}

// 下一张
function nextImage() {
  if (currentIndex < images.length - 1) {
    selectImage(currentIndex + 1);
  }
}

// 清除当前
function clearCurrent() {
  if (currentImageName) {
    annotations[currentImageName] = [];
    redraw();
    document.getElementById('status').className = 'status unsaved';
    document.getElementById('status').textContent = '未保存';
  }
}

// 自动标注当前图片
async function autoAnnotateCurrent() {
  if (!currentImageName) {
    alert('请先选择一张图片');
    return;
  }
  document.getElementById('status').textContent = '正在检测...';
  try {
    const resp = await fetch('/api/annotate/auto', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({image: currentImageName})
    });
    const data = await resp.json();
    if (data.success) {
      annotations[currentImageName] = data.annotations;
      redraw();
      document.getElementById('status').className = 'status unsaved';
      document.getElementById('status').textContent = '自动标注完成，请检查修改';
    }
  } catch(e) {
    alert('自动标注失败: ' + e);
  }
}

// 自动标注全部图片
async function autoAnnotateAll() {
  if (images.length === 0) {
    alert('请先加载图片');
    return;
  }
  document.getElementById('status').textContent = '正在批量检测...';
  let count = 0;
  for (let i = 0; i < images.length; i++) {
    try {
      const resp = await fetch('/api/annotate/auto', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image: images[i]})
      });
      const data = await resp.json();
      if (data.success && data.annotations.length > 0) {
        annotations[images[i]] = data.annotations;
        count++;
      }
    } catch(e) {
      console.log('检测失败: ' + images[i]);
    }
  }
  redraw();
  updateProgress();
  document.getElementById('status').className = 'status unsaved';
  document.getElementById('status').textContent = `已自动标注 ${count} 张，请检查修改`;
  alert(`批量检测完成！已标注 ${count} 张图片，请逐张检查并修改错误的标注。`);
}

// 更新进度
function updateProgress() {
  const annotatedCount = Object.keys(annotations).filter(k => annotations[k] && annotations[k].length > 0).length;
  document.getElementById('progress').textContent = `${annotatedCount}/${images.length}`;
}

// 删除当前图片
async function deleteCurrentImage() {
  if (!currentImageName) {
    alert('请先选择一张图片');
    return;
  }
  if (!confirm(`确定删除图片 "${currentImageName}" 吗？此操作不可恢复！`)) {
    return;
  }
  try {
    const resp = await fetch('/api/annotate/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({image: currentImageName})
    });
    const data = await resp.json();
    if (data.success) {
      // 从列表中移除
      const index = images.indexOf(currentImageName);
      if (index > -1) {
        images.splice(index, 1);
        delete annotations[currentImageName];
      }
      // 选择下一张或上一张
      if (images.length > 0) {
        selectImage(Math.min(index, images.length - 1));
      } else {
        currentIndex = -1;
        currentImageName = null;
        document.getElementById('currentImageName').textContent = '无';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      updateImageList();
      updateProgress();
      alert('图片已删除');
    }
  } catch(e) {
    alert('删除失败: ' + e);
  }
}

// 初始化加载
loadClasses();
loadImages();

// 测试当前图片的检测和OCR识别
async function testCurrentImage() {
  if (!currentImageName) {
    alert('请先选择一张图片');
    return;
  }
  document.getElementById('status').textContent = '正在测试...';
  try {
    const resp = await fetch('/api/test_image', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({image: currentImageName})
    });
    const data = await resp.json();
    if (data.success) {
      showTestResult(data.results);
      document.getElementById('status').textContent = '测试完成';
      // 更新画布显示检测结果
      if (data.results.annotated_image) {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
        };
        img.src = 'data:image/jpeg;base64,' + data.results.annotated_image;
      }
    } else {
      alert('测试失败: ' + data.error);
    }
  } catch(e) {
    alert('测试失败: ' + e);
  }
}

// 显示测试结果
function showTestResult(results) {
  const panel = document.getElementById('testResultPanel');
  const content = document.getElementById('testResultContent');
  panel.style.display = 'block';

  let html = '<b>检测结果:</b><br>';
  results.detections.forEach(d => {
    html += `${d.class} (${(d.confidence*100).toFixed(0)}%)<br>`;
  });

  if (results.ocr_results && results.ocr_results.length > 0) {
    html += '<br><b>OCR识别:</b><br>';
    results.ocr_results.forEach(ocr => {
      html += `区域: ${ocr.bbox.join(',')}<br>`;
      html += `原文: ${ocr.ocr_text || '无'}<br>`;
      html += `扩展: ${ocr.ocr_text_expanded || '无'}<br>`;
      if (ocr.parsed_coord) {
        html += `<span style="color:#66bb6a">✅ 坐标: ${ocr.parsed_coord.map}(${ocr.parsed_coord.x},${ocr.parsed_coord.y})</span><br>`;
      } else {
        html += `<span style="color:#e94560">❌ 未解析到坐标</span><br>`;
      }
      // 模板匹配结果
      if (ocr.template_match) {
        html += `<br><b style="color:#ff9800">模板匹配 (menghuan_ocr):</b><br>`;
        const tm = ocr.template_match;
        html += `方法: ${tm.method || '未知'}<br>`;
        if (tm.map) {
          html += `<span style="color:#66bb6a">地图: ${tm.map}</span><br>`;
        }
        if (tm.x !== undefined && tm.y !== undefined) {
          html += `<span style="color:#66bb6a">✅ 模板匹配坐标: (${tm.x}, ${tm.y})</span><br>`;
        }
        if (tm.matched) {
          html += `匹配详情: `;
          tm.matched.forEach(m => {
            html += `${m[1]}(x=${m[0]}) `;
          });
          html += '<br>';
        }
        if (tm.raw_numbers) {
          html += `原始数字: ${tm.raw_numbers}<br>`;
        }
      }
    });
  } else {
    html += '<br><span style="color:#e94560">未检测到coord_popup</span>';
  }

  content.innerHTML = html;
}
</script>
</body>
</html>
