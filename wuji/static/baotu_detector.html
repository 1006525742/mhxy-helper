<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝图坐标识别 - 窗口绑定模式</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f23; color: #e0e0e0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #e94560; margin-bottom: 20px; }
        .row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; }
        .panel { background: #16213e; border-radius: 8px; padding: 16px; border: 1px solid #0f3460; }
        .panel h3 { color: #4fc3f7; margin-bottom: 12px; font-size: 14px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 4px; }
        .btn-primary { background: #0f3460; color: #eee; }
        .btn-primary:hover { background: #1a5276; }
        .btn-success { background: #1b5e20; color: #eee; }
        .btn-success:hover { background: #2e7d32; }
        .btn-danger { background: #c62828; color: #eee; }
        .btn-danger:hover { background: #d32f2f; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { padding: 10px; margin: 10px 0; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .status.loading { background: #fff3cd; color: #856404; }
        .status.ready { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.monitoring { background: #1b5e20; color: #fff; }
        .canvas-container { position: relative; display: inline-block; text-align: center; background: #000; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        canvas { max-width: 100%; height: auto; border-radius: 8px; }
        .window-list { max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .window-item { background: #1a1a2e; padding: 8px 12px; margin: 4px 0; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .window-item:hover { background: #0f3460; }
        .window-item.selected { background: #e94560; }
        /* 物品栏表格 */
        .item-table-wrapper { margin-top: 20px; overflow-x: auto; background: #AEA6CD; border: 2px solid #536388; border-radius: 8px; padding: 10px; display: inline-block; }
        .item-table-wrapper table { border-collapse: collapse; background: #AEA6CD; }
        .item-table-wrapper td { border: 1px solid #536388; padding: 0; text-align: center; vertical-align: middle; position: relative; background-color: #888; width: 60px; height: 50px; }
        .item-table-wrapper td img { width: 100%; height: 100%; object-fit: contain; }
        .ocr-text { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); color: white; font-size: 9px; padding: 1px; text-align: center; line-height: 1.1; pointer-events: none; word-break: break-all; }
        .selected-cell { outline: 3px solid #ffcc00 !important; outline-offset: -1px; }
        .baotu-cell { background-color: #f0f0f0; }  /* 宝图格子底色 */
        .legend { margin: 15px 0; padding: 10px; background: #1a1a2e; border-radius: 6px; font-size: 12px; }
        .legend span { display: inline-block; width: 16px; height: 16px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
        .result-box { background: #1a1a2e; padding: 12px; border-radius: 4px; margin-top: 10px; font-family: monospace; }
        .result-box .label { color: #4fc3f7; margin-bottom: 4px; }
        .result-box .text { color: #fff; }
        .result-box .coord { color: #66bb6a; font-weight: bold; font-size: 16px; }
        .result-box .error { color: #e94560; }
        .monitor-info { font-size: 12px; color: #888; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎯 宝图坐标识别 - 窗口绑定模式</h1>

    <div class="row">
        <div class="col">
            <div class="panel">
                <h3>1. 窗口选择</h3>
                <button class="btn btn-primary" onclick="loadWindows()">刷新窗口列表</button>
                <div class="window-list" id="windowList"></div>
                <div id="selectedWindow" style="color:#4fc3f7;margin-top:8px;font-size:12px"></div>
            </div>
        </div>
        <div class="col">
            <div class="panel">
                <h3>2. 模型状态</h3>
                <div id="modelStatus" class="status loading">⏳ 正在加载TF.js模型...</div>
                <button class="btn btn-success" onclick="startMonitor()" id="monitorBtn" disabled>开始监控</button>
                <button class="btn btn-danger" onclick="stopMonitor()" id="stopBtn" disabled>停止监控</button>
                <div id="monitorInfo" class="monitor-info"></div>
            </div>
        </div>
    </div>

    <div class="legend">
        <strong>图例：</strong>
        <span style="background: #ffcc00;"></span> 选中格子
        <span style="background: #ff6600;"></span> 蒙版区域
        <span style="background: #00ccff;"></span> 物品栏
        <span style="background: #ff00ff;"></span> OCR区域
    </div>

    <div class="row">
        <div class="col">
            <div class="panel">
                <h3>实时截图</h3>
                <div class="canvas-container" id="canvasContainer" style="display:none;">
                    <canvas id="outputCanvas"></canvas>
                </div>
                <div id="noScreenshot" style="color:#888;padding:40px;text-align:center;">等待开始监控...</div>
            </div>
        </div>
        <div class="col">
            <div class="panel">
                <h3>物品栏</h3>
                <div id="itemTableWrapper" class="item-table-wrapper"></div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>识别结果</h3>
        <div id="results">
            <div class="result-box"><div class="label">等待检测...</div></div>
        </div>
    </div>
</div>

<script>
// ==================== 配置（来自F:\yolo_test） ====================
const classNames = ['宝藏图0', '1图宝藏', '宝藏图2', '物品栏'];
const CONFIDENCE_THRESHOLD = 0.3;
const IOU_THRESHOLD = 0.45;
const MODEL_SIZE = 640;

// 物品栏配置
const ITEM_ROWS = 4;
const ITEM_COLS = 5;
const CELL_SIZE = 50;        // 游戏实际格子大小，用于计算位置
const CELL_DISPLAY = 60;     // 显示宽度，防止坐标换行
const GRID_OFFSET_X = -160;
const TITLE_TO_GRID_OFFSET_Y = 5;

// OCR参数
const TEXT_OFFSET_X = 0;
const TEXT_WIDTH = 130;
const TEXT_OFFSET_Y = 10;
const TEXT_HEIGHT = 20;

// 状态
let model = null;
let isModelReady = false;
let selectedHwnd = null;
let isMonitoring = false;
let monitorInterval = null;
let lastDetections = [];

// DOM
const modelStatusDiv = document.getElementById('modelStatus');
const outputCanvas = document.getElementById('outputCanvas');
const canvasContainer = document.getElementById('canvasContainer');
const windowList = document.getElementById('windowList');
const resultsDiv = document.getElementById('results');
const itemTableWrapper = document.getElementById('itemTableWrapper');
const monitorBtn = document.getElementById('monitorBtn');
const stopBtn = document.getElementById('stopBtn');
const monitorInfo = document.getElementById('monitorInfo');

// ==================== TF.js 模型加载 ====================
async function loadTFModel() {
    try {
        modelStatusDiv.textContent = '⏳ 正在加载TF.js模型...';
        modelStatusDiv.className = 'status loading';

        model = await tf.loadGraphModel('/static/models/model.json');

        // 预热模型
        const dummyInput = tf.zeros([1, MODEL_SIZE, MODEL_SIZE, 3]);
        await model.executeAsync(dummyInput);
        tf.dispose(dummyInput);

        isModelReady = true;
        modelStatusDiv.textContent = '✅ TF.js模型已加载';
        modelStatusDiv.className = 'status ready';

        if (selectedHwnd) monitorBtn.disabled = false;
        console.log('TF.js模型加载完成');
    } catch (error) {
        console.error('模型加载失败:', error);
        modelStatusDiv.textContent = '❌ 模型加载失败: ' + error.message;
        modelStatusDiv.className = 'status error';
    }
}

// ==================== YOLO检测解析 ====================
function parseYOLODetections(predictions, imgWidth, imgHeight) {
    const data = predictions.dataSync();
    const numBoxes = 25200;
    const numClasses = 4;
    const boxes = [], scores = [], classes = [];

    for (let i = 0; i < numBoxes; i++) {
        const baseIdx = i * 9;
        let cx = data[baseIdx + 0];
        let cy = data[baseIdx + 1];
        let w = data[baseIdx + 2];
        let h = data[baseIdx + 3];
        let boxConf = data[baseIdx + 4];

        let maxClassScore = -Infinity, maxClassId = -1;
        for (let c = 0; c < numClasses; c++) {
            const classScore = data[baseIdx + 5 + c];
            if (classScore > maxClassScore) { maxClassScore = classScore; maxClassId = c; }
        }

        let confidence = boxConf * maxClassScore;
        if (confidence < CONFIDENCE_THRESHOLD) continue;

        let x1, y1, x2, y2;
        if (cx <= 1.0 && cy <= 1.0 && w <= 1.0 && h <= 1.0) {
            x1 = (cx - w/2) * imgWidth;
            y1 = (cy - h/2) * imgHeight;
            x2 = (cx + w/2) * imgWidth;
            y2 = (cy + h/2) * imgHeight;
        } else {
            const scaleX = imgWidth / MODEL_SIZE;
            const scaleY = imgHeight / MODEL_SIZE;
            x1 = (cx - w/2) * scaleX;
            y1 = (cy - h/2) * scaleY;
            x2 = (cx + w/2) * scaleX;
            y2 = (cy + h/2) * scaleY;
        }

        x1 = Math.max(0, Math.min(x1, imgWidth));
        y1 = Math.max(0, Math.min(y1, imgHeight));
        x2 = Math.max(0, Math.min(x2, imgWidth));
        y2 = Math.max(0, Math.min(y2, imgHeight));
        if (x2 <= x1 || y2 <= y1) continue;

        boxes.push([x1, y1, x2, y2]);
        scores.push(confidence);
        classes.push(maxClassId);
    }

    if (boxes.length === 0) return [];
    const nmsIndices = nonMaxSuppression(boxes, scores, IOU_THRESHOLD);
    return nmsIndices.map(idx => ({
        bbox: boxes[idx],
        score: scores[idx],
        classId: classes[idx],
        className: classNames[classes[idx]]
    }));
}

function nonMaxSuppression(boxes, scores, iouThreshold) {
    if (boxes.length === 0) return [];
    const areas = boxes.map(b => (b[2]-b[0])*(b[3]-b[1]));
    const indices = Array.from(Array(boxes.length).keys()).sort((a,b) => scores[b] - scores[a]);
    const kept = [];

    while (indices.length > 0) {
        const current = indices.shift();
        kept.push(current);
        const toRemove = [];

        for (let i = 0; i < indices.length; i++) {
            const other = indices[i];
            const ix1 = Math.max(boxes[current][0], boxes[other][0]);
            const iy1 = Math.max(boxes[current][1], boxes[other][1]);
            const ix2 = Math.min(boxes[current][2], boxes[other][2]);
            const iy2 = Math.min(boxes[current][3], boxes[other][3]);

            if (ix2 > ix1 && iy2 > iy1) {
                const intersection = (ix2-ix1)*(iy2-iy1);
                const union = areas[current] + areas[other] - intersection;
                if (intersection/union > iouThreshold) toRemove.push(i);
            }
        }
        for (let i = toRemove.length - 1; i >= 0; i--) indices.splice(toRemove[i], 1);
    }
    return kept;
}

// ==================== 绘制 ====================
function drawDetections(ctx, width, height, detections) {
    const colors = {'宝藏图0': '#00ff00', '1图宝藏': '#ffcc00', '宝藏图2': '#ff6600', '物品栏': '#00ccff'};

    for (const det of detections) {
        const [x1, y1, x2, y2] = det.bbox;
        const color = colors[det.className] || '#ff0000';

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

        ctx.font = '14px Arial';
        ctx.fillStyle = color;
        const label = `${det.className} ${(det.score*100).toFixed(0)}%`;
        const textWidth = ctx.measureText(label).width;
        ctx.fillRect(x1, y1 - 20, textWidth + 8, 20);
        ctx.fillStyle = 'white';
        ctx.fillText(label, x1 + 4, y1 - 6);
    }
}

function cropImage(canvas, x, y, w, h) {
    const cropX = Math.max(0, Math.min(x, canvas.width));
    const cropY = Math.max(0, Math.min(y, canvas.height));
    const cropW = Math.min(w, canvas.width - cropX);
    const cropH = Math.min(h, canvas.height - cropY);
    if (cropW <= 0 || cropH <= 0) return null;

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = cropW;
    tempCanvas.height = cropH;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
    return tempCanvas.toDataURL('image/png');
}

// ==================== OCR ====================
async function recognizeCoordinates(imgData) {
    if (!imgData) return null;
    try {
        const response = await fetch('/api/WatuOCR', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({img: imgData})
        });
        if (!response.ok) return null;
        return await response.json();
    } catch (err) {
        console.error('OCR失败:', err);
        return null;
    }
}

// ==================== 物品栏表格 ====================
function createEmptyTable() {
    // 创建空表格，页面加载时直接显示
    let html = '<table>';
    for (let row = 0; row < ITEM_ROWS; row++) {
        html += '<tr>';
        for (let col = 0; col < ITEM_COLS; col++) {
            const cellId = `item-cell-${row}-${col}`;
            html += `<td id="${cellId}"></td>`;
        }
        html += '</tr>';
    }
    html += '</table>';
    itemTableWrapper.innerHTML = html;
}

function highlightSelectedCell(row, col) {
    for (let r = 0; r < ITEM_ROWS; r++) {
        for (let c = 0; c < ITEM_COLS; c++) {
            const cell = document.getElementById(`item-cell-${r}-${c}`);
            if (cell) cell.classList.remove('selected-cell');
        }
    }
    if (row >= 0 && row < ITEM_ROWS && col >= 0 && col < ITEM_COLS) {
        const cell = document.getElementById(`item-cell-${row}-${col}`);
        if (cell) cell.classList.add('selected-cell');
    }
}

function updateCellDisplay(row, col, name, x, y) {
    const cell = document.getElementById(`item-cell-${row}-${col}`);
    if (!cell) return;
    let textDiv = cell.querySelector('.ocr-text');
    if (!textDiv) {
        textDiv = document.createElement('div');
        textDiv.className = 'ocr-text';
        cell.appendChild(textDiv);
    }
    if (x && y && x > 0 && y > 0) {
        textDiv.innerHTML = `${name}<br>(${x},${y})`;
    } else {
        textDiv.innerHTML = name || '';
    }
}

// ==================== 核心检测 ====================
async function detectScreenshot(imgBase64) {
    if (!model || !isModelReady) return;

    const img = new Image();
    img.onload = async () => {
        const imgWidth = img.naturalWidth || img.width;
        const imgHeight = img.naturalHeight || img.height;

        outputCanvas.width = imgWidth;
        outputCanvas.height = imgHeight;
        const ctx = outputCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0, imgWidth, imgHeight);
        canvasContainer.style.display = 'block';
        document.getElementById('noScreenshot').style.display = 'none';

        try {
            let tensor = tf.browser.fromPixels(img)
                .resizeNearestNeighbor([MODEL_SIZE, MODEL_SIZE])
                .toFloat()
                .div(255.0)
                .expandDims(0);

            const predictions = await model.executeAsync(tensor);
            const detections = parseYOLODetections(predictions, imgWidth, imgHeight);
            tf.dispose([tensor, predictions]);
            lastDetections = detections;

            drawDetections(ctx, imgWidth, imgHeight, detections);

            // 物品栏检测 - 计算格子位置用于后续定位
            const itemBarDet = detections.find(d => d.className === '物品栏');
            let gridStartX = 0, gridStartY = 0;

            if (itemBarDet) {
                const [x, y, x2, y2] = itemBarDet.bbox;
                gridStartX = x + GRID_OFFSET_X;
                gridStartY = y + (y2-y) + TITLE_TO_GRID_OFFSET_Y;
            }

            // 选中状态
            let selectedRow = -1, selectedCol = -1;
            const selectedDet = detections.find(d => d.className === '1图宝藏');
            if (selectedDet && itemBarDet) {
                const [sx1, sy1, sx2, sy2] = selectedDet.bbox;
                const centerX = (sx1 + sx2) / 2;
                const centerY = (sy1 + sy2) / 2;
                const col = Math.floor((centerX - gridStartX) / CELL_SIZE);
                const row = Math.floor((centerY - gridStartY) / CELL_SIZE);
                if (row >= 0 && row < ITEM_ROWS && col >= 0 && col < ITEM_COLS) {
                    selectedRow = row;
                    selectedCol = col;
                    highlightSelectedCell(row, col);
                }
            }

            // 蒙版OCR
            let ocrResult = null;
            let textImgData = null;
            const maskDet = detections.find(d => d.className === '宝藏图2');
            if (maskDet && selectedRow >= 0 && selectedCol >= 0) {
                const [mx1, my1, mx2, my2] = maskDet.bbox;
                const textX = mx2 + TEXT_OFFSET_X;
                const textY = my1 + TEXT_OFFSET_Y;

                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(textX, textY, TEXT_WIDTH, TEXT_HEIGHT);

                // 裁剪坐标文字区域
                textImgData = cropImage(outputCanvas, textX, textY, TEXT_WIDTH, TEXT_HEIGHT);

                // OCR识别
                if (textImgData) {
                    ocrResult = await recognizeCoordinates(textImgData);

                    const cell = document.getElementById(`item-cell-${selectedRow}-${selectedCol}`);
                    if (cell) {
                        // 设置宝图格子样式
                        cell.classList.add('baotu-cell');
                        cell.style.position = 'relative';

                        if (ocrResult && ocrResult.mapname !== '识别出错' && ocrResult.mapname !== 'OCR不可用') {
                            // 显示地图名和坐标
                            cell.innerHTML = `<div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#f0f0f0;">
                                <div style="font-size:11px;font-weight:bold;color:#333;">${ocrResult.mapname}</div>
                                <div style="font-size:13px;color:#e94560;">(${ocrResult.x}, ${ocrResult.y})</div>
                            </div>`;
                        } else {
                            // OCR失败，显示截图
                            cell.innerHTML = `<img src="${textImgData}" style="width:100%;height:100%;object-fit:contain;">`;
                        }
                    }
                }
            }

            // 结果显示
            let html = `<div class="result-box"><div class="label">检测到 ${detections.length} 个目标</div>`;
            html += `<div class="text">物品栏: ${itemBarDet ? '✅' : '❌'}</div>`;
            html += `<div class="text">选中状态: ${selectedDet ? '✅ 第'+(selectedRow+1)+'行第'+(selectedCol+1)+'列' : '❌'}</div>`;
            html += `<div class="text">蒙版: ${maskDet ? '✅' : '❌'}</div>`;
            html += '</div>';

            if (ocrResult) {
                html += `<div class="result-box"><div class="coord">📍 ${ocrResult.mapname} (${ocrResult.x}, ${ocrResult.y})</div></div>`;
            }

            resultsDiv.innerHTML = html;

        } catch (e) {
            console.error('检测错误:', e);
        }
    };
    img.src = 'data:image/jpeg;base64,' + imgBase64;
}

// ==================== 窗口管理 ====================
async function loadWindows() {
    try {
        const resp = await fetch('/api/windows');
        const data = await resp.json();
        windowList.innerHTML = '';

        // API直接返回数组
        const windows = Array.isArray(data) ? data : (data.windows || []);

        windows.forEach(w => {
            const item = document.createElement('div');
            item.className = 'window-item';
            item.textContent = w.title || '无标题 (hwnd:' + w.hwnd + ')';
            item.onclick = () => selectWindow(w.hwnd, w.title, item);
            if (w.hwnd === selectedHwnd) item.classList.add('selected');
            windowList.appendChild(item);
        });

        if (windows.length === 0) {
            windowList.innerHTML = '<div style="color:#e94560;padding:10px">未找到窗口</div>';
        }
    } catch (e) {
        windowList.innerHTML = '<div style="color:#e94560;padding:10px">加载失败: ' + e + '</div>';
    }
}

async function selectWindow(hwnd, title, element) {
    selectedHwnd = hwnd;
    document.querySelectorAll('.window-item').forEach(el => el.classList.remove('selected'));
    element.classList.add('selected');
    document.getElementById('selectedWindow').textContent = '已选择: ' + (title || 'hwnd:' + hwnd);

    await fetch('/api/select-window', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({hwnd: hwnd})
    });

    if (isModelReady) monitorBtn.disabled = false;
}

async function startMonitor() {
    if (!selectedHwnd) { alert('请先选择窗口'); return; }
    if (!isModelReady) { alert('模型还未加载'); return; }

    isMonitoring = true;
    monitorBtn.disabled = true;
    stopBtn.disabled = false;
    modelStatusDiv.textContent = '🔄 正在监控...';
    modelStatusDiv.className = 'status monitoring';
    monitorInfo.textContent = '监控间隔: 500ms';

    let frameCount = 0;
    monitorInterval = setInterval(async () => {
        if (!isMonitoring) return;
        try {
            const resp = await fetch('/api/screenshot');
            const data = await resp.json();
            if (data.image) {
                await detectScreenshot(data.image);
                frameCount++;
                monitorInfo.textContent = `已处理 ${frameCount} 帧`;
            } else if (data.error) {
                console.log('截图错误:', data.error);
            }
        } catch (e) {
            console.error('截图请求失败:', e);
        }
    }, 500);
}

function stopMonitor() {
    isMonitoring = false;
    monitorBtn.disabled = false;
    stopBtn.disabled = true;
    modelStatusDiv.textContent = '✅ TF.js模型已加载';
    modelStatusDiv.className = 'status ready';
    monitorInfo.textContent = '';
    if (monitorInterval) {
        clearInterval(monitorInterval);
        monitorInterval = null;
    }
}

// ==================== 初始化 ====================
createEmptyTable();  // 页面加载时显示空表格
loadTFModel();
loadWindows();
</script>
</body>
</html>
