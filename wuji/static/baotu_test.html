<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝图坐标识别测试</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f23; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { color: #e94560; margin-bottom: 20px; }
.row { display: flex; gap: 20px; margin-bottom: 20px; }
.col { flex: 1; }
.panel { background: #16213e; border-radius: 8px; padding: 16px; border: 1px solid #0f3460; }
.panel h3 { color: #4fc3f7; margin-bottom: 12px; }
.btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 4px; }
.btn-primary { background: #0f3460; color: #eee; }
.btn-primary:hover { background: #1a5276; }
.btn-success { background: #1b5e20; color: #eee; }
.btn-success:hover { background: #2e7d32; }
.image-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.image-item { background: #1a1a2e; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.image-item:hover { background: #0f3460; }
.image-item.active { background: #e94560; }
#preview { max-width: 100%; border-radius: 8px; background: #000; }
#resultImage { max-width: 100%; border-radius: 8px; background: #000; }
.result-box { background: #1a1a2e; padding: 12px; border-radius: 4px; margin-top: 10px; font-family: monospace; }
.result-box .label { color: #4fc3f7; margin-bottom: 4px; }
.result-box .text { color: #fff; white-space: pre-wrap; }
.result-box .coord { color: #66bb6a; font-weight: bold; }
.result-box .error { color: #e94560; }
.upload-area { border: 2px dashed #0f3460; padding: 20px; text-align: center; border-radius: 8px; margin-top: 10px; }
.upload-area:hover { border-color: #4fc3f7; }
#fileInput { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>宝图坐标识别测试</h1>

  <div class="row">
    <div class="col">
      <div class="panel">
        <h3>选择图片</h3>
        <button class="btn btn-primary" onclick="loadImageList()">加载图片列表</button>
        <div class="image-list" id="imageList"></div>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
          点击上传本地图片
          <input type="file" id="fileInput" accept="image/*" onchange="uploadImage(event)">
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <div class="panel">
        <h3>原图预览</h3>
        <img id="preview" style="display:none">
        <div id="imageName" style="color:#4fc3f7;margin-top:8px"></div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <h3>检测结果</h3>
        <img id="resultImage" style="display:none">
        <button class="btn btn-success" onclick="runTest()" id="testBtn" disabled>开始测试</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <div class="panel">
        <h3>识别结果</h3>
        <div id="results">
          <div class="result-box">
            <div class="label">等待测试...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentImage = null;

async function loadImageList() {
  try {
    const resp = await fetch('/api/annotate/images');
    const data = await resp.json();
    const images = data.images || [];

    const list = document.getElementById('imageList');
    list.innerHTML = '';

    // 只显示最近50张
    images.slice(0, 50).forEach(img => {
      const item = document.createElement('div');
      item.className = 'image-item';
      item.textContent = img;
      item.onclick = () => selectImage(img, item);
      list.appendChild(item);
    });

    if (images.length === 0) {
      list.innerHTML = '<div style="color:#e94560">没有图片</div>';
    }
  } catch(e) {
    document.getElementById('imageList').innerHTML = '<div style="color:#e94560">加载失败: ' + e + '</div>';
  }
}

function selectImage(name, element) {
  currentImage = name;

  // 高亮选中
  document.querySelectorAll('.image-item').forEach(el => el.classList.remove('active'));
  element.classList.add('active');

  // 显示预览
  document.getElementById('preview').src = '/data/images/' + name;
  document.getElementById('preview').style.display = 'block';
  document.getElementById('imageName').textContent = name;
  document.getElementById('testBtn').disabled = false;
}

async function uploadImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  // 显示预览
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('preview').src = e.target.result;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('imageName').textContent = '本地图片: ' + file.name;
    currentImage = null;  // 本地图片
    document.getElementById('testBtn').disabled = false;

    // 存储base64用于上传测试
    window.uploadedImageBase64 = e.target.result.split(',')[1];
  };
  reader.readAsDataURL(file);
}

async function runTest() {
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '<div class="result-box"><div class="label">正在测试...</div></div>';

  try {
    let resp;

    if (currentImage) {
      // 从服务器图片测试
      resp = await fetch('/api/test_image', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image: currentImage})
      });
    } else if (window.uploadedImageBase64) {
      // 上传本地图片测试
      resp = await fetch('/api/baotu_upload_test', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image_base64: window.uploadedImageBase64})
      });
    } else {
      resultsDiv.innerHTML = '<div class="result-box"><div class="error">请先选择图片</div></div>';
      return;
    }

    const data = await resp.json();

    // 显示检测结果图片
    if (data.annotated_image) {
      document.getElementById('resultImage').src = 'data:image/jpeg;base64,' + data.annotated_image;
      document.getElementById('resultImage').style.display = 'block';
    }

    // 显示结果
    let html = '';

    // 检测到的目标
    html += '<div class="result-box">';
    html += '<div class="label">检测到 ' + (data.detections?.length || 0) + ' 个目标:</div>';
    if (data.detections && data.detections.length > 0) {
      data.detections.forEach(d => {
        html += '<div class="text">' + d.class + ' (' + d.confidence.toFixed(2) + ') [' + d.x1 + ',' + d.y1 + '-' + d.x2 + ',' + d.y2 + ']</div>';
      });
    } else {
      html += '<div class="error">无检测结果</div>';
    }
    html += '</div>';

    // OCR结果
    if (data.ocr_results && data.ocr_results.length > 0) {
      data.ocr_results.forEach(ocr => {
        html += '<div class="result-box">';
        html += '<div class="label">OCR识别 (coord_popup):</div>';
        html += '<div class="text">原始区域: ' + (ocr.ocr_text || '无') + '</div>';
        html += '<div class="text">扩展+50: ' + (ocr.ocr_text_expanded || '无') + '</div>';
        html += '<div class="text">扩展+100: ' + (ocr.ocr_text_expanded2 || '无') + '</div>';

        if (ocr.parsed_coord) {
          html += '<div class="coord">解析结果: ' + ocr.parsed_coord.map + '(' + ocr.parsed_coord.x + ',' + ocr.parsed_coord.y + ')</div>';
        } else {
          html += '<div class="error">解析失败</div>';
        }

        if (ocr.template_match) {
          html += '<div class="text">模板匹配: ' + JSON.stringify(ocr.template_match) + '</div>';
        }
        html += '</div>';
      });
    }

    if (data.error) {
      html += '<div class="result-box"><div class="error">' + data.error + '</div></div>';
    }

    resultsDiv.innerHTML = html;

  } catch(e) {
    resultsDiv.innerHTML = '<div class="result-box"><div class="error">测试失败: ' + e + '</div></div>';
  }
}

// 初始化加载图片列表
loadImageList();
</script>
</body>
</html>
