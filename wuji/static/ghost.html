<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抓鬼预测工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f23; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
.header { background: #16213e; padding: 10px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #0f3460; flex-wrap: wrap; }
.header h1 { font-size: 16px; color: #e94560; }
.btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn:hover { opacity: 0.85; }
.btn-primary { background: #0f3460; color: #eee; }
.btn-success { background: #1b5e20; color: #eee; }
.btn-danger { background: #b71c1c; color: #eee; }
.btn-warning { background: #e65100; color: #eee; }
.btn-pip { background: #7b1fa2; color: #eee; }
.status-badge { padding: 3px 10px; border-radius: 10px; font-size: 11px; background: #0f3460; }
.status-badge.monitoring { background: #e65100; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
.main { display: flex; flex: 1; padding: 12px; gap: 12px; height: calc(100vh - 50px); }
.left-panel { width: 320px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.section { background: #16213e; padding: 12px; border-radius: 6px; }
.section h2 { font-size: 14px; color: #e94560; margin-bottom: 8px; }
.input-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.input-row select, .input-row input { background: #1a1a2e; color: #eee; border: 1px solid #0f3460; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
.input-row select { min-width: 120px; }
.input-row input { width: 70px; }
.capture-info { font-size: 12px; color: #aaa; }
.capture-info span { color: #4fc3f7; }
.info-item { background: #1a1a2e; padding: 8px; border-radius: 4px; margin-bottom: 6px; }
.info-item .label { color: #888; font-size: 11px; }
.info-item .value { color: #4fc3f7; font-size: 13px; font-weight: bold; }
.info-item .areas { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.quadrant-btn { padding: 4px 8px; border-radius: 3px; font-size: 11px; border: 1px solid #0f3460; }
.quadrant-btn.active { background: #ffc107; color: #000; border-color: #ffc107; }
.quadrant-btn.inactive { background: #1a1a2e; color: #555; }
.quadrant-btn.corner { background: #ff9800; color: #000; border-color: #ff9800; font-weight: bold; }
.history-list { max-height: 150px; overflow-y: auto; }
.history-item { background: #1a1a2e; padding: 6px 8px; border-radius: 3px; margin-bottom: 3px; display: flex; justify-content: space-between; cursor: pointer; font-size: 12px; }
.history-item:hover { background: #16213e; }
.history-item .map { color: #4fc3f7; }
.history-item .coord { color: #66bb6a; }
.right-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.map-container { flex: 1; background: #16213e; border-radius: 6px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.map-main { position: relative; cursor: move; user-select: none; }
.map-main img { display: block; }
.zoom-controls { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 6px; align-items: center; background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 4px; z-index: 5; }
.zoom-controls span { font-size: 12px; color: #4fc3f7; min-width: 50px; text-align: center; }
.zoom-btn { width: 28px; height: 28px; border: none; border-radius: 4px; background: #0f3460; color: #eee; cursor: pointer; font-size: 16px; }
.placeholder { color: #555; font-size: 14px; text-align: center; }
.help-tip { font-size: 11px; color: #888; margin-top: 6px; line-height: 1.5; }
.hotkey { background: #0f3460; padding: 1px 6px; border-radius: 3px; color: #4fc3f7; font-family: monospace; font-size: 11px; }
.preview-box { margin-top: 8px; text-align: center; }
.preview-box img { max-width: 100%; border: 1px solid #0f3460; border-radius: 4px; }
.window-selector select { max-width: 200px; }
.header-link { color: #4fc3f7; text-decoration: none; font-size: 13px; padding: 4px 10px; background: #0f3460; border-radius: 4px; }
.header-link:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="header">
  <h1>抓鬼预测</h1>
  <a href="http://localhost:8766/" class="header-link">🏠 返回首页</a>
  <span class="status-badge" id="statusBadge">就绪</span>
  <div class="window-selector">
    <select id="windowSelect"><option value="">-- 选择窗口 --</option></select>
    <button class="btn btn-primary" onclick="refreshWindows()">🔄</button>
    <button class="btn btn-success" id="btnStartMonitor" onclick="startGhostMonitor()">▶ 开始监控</button>
    <button class="btn btn-danger" id="btnStopMonitor" style="display:none" onclick="stopGhostMonitor()">⏹ 停止</button>
  </div>
  <button class="btn btn-primary" onclick="startScreenSelect()">框选区域</button>
  <button class="btn btn-success" onclick="captureAndRecognize()">识别</button>
    <button class="btn btn-pip" id="pipBtn" onclick="togglePip()">画中画</button>
</div>

<div class="main">
  <div class="left-panel">
    <div class="section">
      <h2>窗口信息</h2>
      <div class="capture-info">当前窗口: <span id="currentWindow">未选择</span></div>
    </div>
    <div class="section">
      <h2>截图区域（相对窗口）</h2>
      <div class="capture-info">当前: <span id="regionDisplay">未设置</span></div>
      <div class="input-row" style="margin-top:8px">
        <label>X:</label><input type="number" id="capX" value="0" min="0" style="width:60px">
        <label>Y:</label><input type="number" id="capY" value="0" min="0" style="width:60px">
      </div>
      <div class="input-row" style="margin-top:6px">
        <label>宽:</label><input type="number" id="capW" value="600" min="100" style="width:60px">
        <label>高:</label><input type="number" id="capH" value="180" min="50" style="width:60px">
      </div>
      <div class="input-row" style="margin-top:6px">
        <button class="btn btn-primary" onclick="previewCapture()">预览</button>
        <button class="btn btn-success" onclick="saveCaptureRegion()">保存</button>
      </div>
      <div class="help-tip">先选择窗口，再点击"框选区域"在窗口内框选坐标区域<br>或手动输入相对窗口客户区的坐标<br><b>截图区域建议≥400x120</b>（需包含完整坐标行）<br>快捷键: <span class="hotkey" id="hotkeyDisplay">Ctrl+A</span> <button class="btn btn-primary" style="padding:2px 8px;font-size:11px" onclick="startSetHotkey()">修改</button></div>
      <div class="preview-box" id="previewBox" style="display:none">
        <img id="previewImg">
      </div>
    </div>
    <div class="section">
      <h2>手动输入</h2>
      <div class="input-row">
        <select id="mapSelect"><option value="">选择地图</option></select>
        <label>X:</label><input type="number" id="xInput" value="100" min="0">
        <label>Y:</label><input type="number" id="yInput" value="80" min="0">
        <button class="btn btn-success" onclick="predictFromInput()">预测</button>
      </div>
    </div>
    <div class="section">
      <h2>预测结果</h2>
      <div class="info-item">
        <div class="label">地图 / 坐标</div>
        <div class="value"><span id="resultMap">-</span> <span id="resultCoord">-</span></div>
      </div>
      <div class="info-item">
        <div class="label">预测象限</div>
        <div class="areas" id="resultAreas">
          <span class="quadrant-btn inactive">1右上</span>
          <span class="quadrant-btn inactive">2左上</span>
          <span class="quadrant-btn inactive">3左下</span>
          <span class="quadrant-btn inactive">4右下</span>
        </div>
      </div>
      <div class="info-item">
        <div class="label">置信度</div>
        <div class="value" id="resultConf">-</div>
      </div>
      <div class="info-item">
        <div class="label">黄色像素</div>
        <div class="value" id="resultYellow">-</div>
      </div>
      <div class="info-item" id="yellowImageBox" style="display:none">
        <div class="label">黄色文字提取</div>
        <img id="yellowImage" style="max-width:100%;border:1px solid #0f3460;border-radius:4px">
      </div>
      <div class="info-item" id="monsterImageBox" style="display:none">
        <div class="label">怪物名字（第3区域）</div>
        <img id="monsterImage" style="max-width:100%;border:2px solid #00ff00;border-radius:4px">
      </div>
    </div>
    <div class="section">
      <h2>历史记录</h2>
      <div class="history-list" id="historyList"><div style="color:#555;font-size:12px">暂无</div></div>
    </div>
    <div class="section">
      <h2>操作说明</h2>
      <div class="help-tip">1. 框选或输入截图区域<br>2. 识别或手动输入坐标<br>3. 画中画查看置顶地图</div>
    </div>
      </div>
  <div class="right-panel">
    <div class="map-container" id="mapContainer">
      <div class="placeholder" id="placeholder">请先识别坐标或手动输入</div>
      <div class="map-main" id="mapMain" style="display:none">
        <img id="mapImg" src="" alt="地图">
      </div>
      <div class="zoom-controls" id="zoomControls" style="display:none">
        <button class="zoom-btn" onclick="zoomOut()">-</button>
        <span id="zoomLevel">100%</span>
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-btn" onclick="resetZoom()">R</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var captureRegion = null;
  var predictionHistory = [];
  var maps = [];
  var currentImageData = null;
  var currentResult = null;
  var zoom = 1.0;
  var panX = 0, panY = 0;
  var isDragging = false;
  var dragStartX, dragStartY;
  var selectOverlay = null;
  var selectedHwnd = null;
  var selectedWindowTitle = '';
  var monitoringActive = false;

  // 加载窗口列表
  window.refreshWindows = function() {
    fetch('/api/windows').then(function(r) { return r.json(); })
      .then(function(windows) {
        var sel = document.getElementById('windowSelect');
        sel.innerHTML = '<option value="">-- 选择窗口 --</option>';
        windows.forEach(function(w) {
          sel.innerHTML += '<option value="' + w.hwnd + '">' + w.title + ' (' + w.width + 'x' + w.height + '</option>';
        });
      });
  };

  // 开始实时监控
  window.startGhostMonitor = function() {
    var hwnd = document.getElementById('windowSelect').value;
    if (!hwnd) {
      alert('请先选择游戏窗口');
      return;
    }
    if (!captureRegion) {
      captureRegion = {
        x: parseInt(document.getElementById('capX').value) || 0,
        y: parseInt(document.getElementById('capY').value) || 0,
        width: parseInt(document.getElementById('capW').value) || 400,
        height: parseInt(document.getElementById('capH').value) || 120
      };
    }
    selectedHwnd = parseInt(hwnd);

    setStatus('监控中...');
    document.getElementById('statusBadge').classList.add('monitoring');
    document.getElementById('btnStartMonitor').style.display = 'none';
    document.getElementById('btnStopMonitor').style.display = 'inline-block';
    document.getElementById('currentWindow').textContent = document.getElementById('windowSelect').selectedOptions[0].text.split('(')[0];
    monitoringActive = true;

    // 发送hwnd和相对坐标区域
    fetch('/api/ghost/monitor/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hwnd: selectedHwnd, capture_region: captureRegion, relative: true})
    }).then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d.success) {
          alert('启动监控失败: ' + d.error);
          stopGhostMonitorUI();
        }
      });
  };

  // 停止实时监控
  window.stopGhostMonitor = function() {
    fetch('/api/ghost/monitor/stop', {method: 'POST'})
      .then(function() { stopGhostMonitorUI(); });
  };

  function stopGhostMonitorUI() {
    monitoringActive = false;
    setStatus('就绪');
    document.getElementById('statusBadge').classList.remove('monitoring');
    document.getElementById('btnStartMonitor').style.display = 'inline-block';
    document.getElementById('btnStopMonitor').style.display = 'none';
  }

  // 定时检查监控状态和结果
  function pollGhostStatus() {
    fetch('/api/ghost/monitor/status')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.monitoring !== monitoringActive) {
          if (d.monitoring) {
            monitoringActive = true;
            document.getElementById('statusBadge').classList.add('monitoring');
            document.getElementById('btnStartMonitor').style.display = 'none';
            document.getElementById('btnStopMonitor').style.display = 'inline-block';
            if (d.selected_title) {
              document.getElementById('currentWindow').textContent = d.selected_title;
            }
            setStatus('监控中...');
          } else {
            stopGhostMonitorUI();
          }
        }
        if (d.capture_region) {
          captureRegion = d.capture_region;
          document.getElementById('capX').value = captureRegion.x;
          document.getElementById('capY').value = captureRegion.y;
          document.getElementById('capW').value = captureRegion.width;
          document.getElementById('capH').value = captureRegion.height;
          document.getElementById('regionDisplay').textContent = '(相对窗口 ' + captureRegion.x + ',' + captureRegion.y + ') ' + captureRegion.width + 'x' + captureRegion.height;
        }
      });
  }

  // 监听服务器推送的结果（通过定时请求模拟）
  var lastResultTime = 0;
  function checkGhostResult() {
    if (!monitoringActive) return;
    // 实际结果通过后端 broadcast 推送，这里用定时检查模拟
    // WebSocket 可以接收，但目前用 HTTP
  }

  function loadMaps() {
    fetch('/api/ghost/maps').then(function(r) { return r.json(); })
      .then(function(data) {
        maps = data.maps || [];
        var sel = document.getElementById('mapSelect');
        sel.innerHTML = '<option value="">选择地图</option>' + maps.map(function(m) { return '<option value="' + m + '">' + m + '</option>'; }).join('');
      });
  }

  // 全屏框选截图区域（改为：先截取选中窗口，然后在窗口图上框选相对区域）
  window.startScreenSelect = function() {
    var hwnd = document.getElementById('windowSelect').value;
    if (!hwnd) {
      alert('请先选择游戏窗口');
      return;
    }

    setStatus('截取窗口中...');
    // 截取选中窗口
    fetch('/api/ghost/capture_window?hwnd=' + hwnd)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.success) {
          alert('截图失败: ' + data.error);
          setStatus('失败');
          return;
        }
        setStatus('就绪');

        // 创建全屏选择器，显示窗口截图作为背景
        selectOverlay = document.createElement('div');
        selectOverlay.id = 'screenSelectOverlay';
        selectOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:2147483647;cursor:crosshair;background:rgba(0,0,0,0.9);overflow:hidden;display:flex;align-items:center;justify-content:center;';

        // 显示窗口截图（保持比例）
        var bgImg = document.createElement('img');
        bgImg.src = 'data:image/png;base64,' + data.image;
        bgImg.style.cssText = 'max-width:95vw;max-height:90vh;object-fit:contain;';
        bgImg.id = 'selectBgImg';
        selectOverlay.appendChild(bgImg);

        var hint = document.createElement('div');
        hint.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(233,69,96,0.9);color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;z-index:2147483648;';
        hint.textContent = '在窗口内拖拽选择坐标区域，ESC取消';
        selectOverlay.appendChild(hint);

    var box = document.createElement('div');
    box.id = 'selectBox';
    box.style.cssText = 'position:absolute;border:2px solid #e94560;background:rgba(233,69,96,0.1);display:none;';
    selectOverlay.appendChild(box);
    document.body.appendChild(selectOverlay);

    // 图片加载后获取显示尺寸
    bgImg.onload = function() {
      selectOverlay.imgDisplayRect = {
        x: bgImg.offsetLeft,
        y: bgImg.offsetTop,
        w: bgImg.clientWidth,
        h: bgImg.clientHeight
      };
      selectOverlay.origWindowSize = {
        w: data.width,
        h: data.height
      };
    };

    var selecting = false, sx = 0, sy = 0;

    selectOverlay.onmousedown = function(e) {
      selecting = true;
      sx = e.clientX;
      sy = e.clientY;
      box.style.display = 'block';
      box.style.left = sx + 'px';
      box.style.top = sy + 'px';
      box.style.width = '0';
      box.style.height = '0';
    };

    selectOverlay.onmousemove = function(e) {
      if (!selecting) return;
      var x = Math.min(sx, e.clientX);
      var y = Math.min(sy, e.clientY);
      var w = Math.abs(e.clientX - sx);
      var h = Math.abs(e.clientY - sy);
      box.style.left = x + 'px';
      box.style.top = y + 'px';
      box.style.width = w + 'px';
      box.style.height = h + 'px';
    };

    selectOverlay.onmouseup = function(e) {
      if (!selecting) return;
      selecting = false;

      // 框选的显示坐标（相对于屏幕）
      var viewX = Math.min(sx, e.clientX);
      var viewY = Math.min(sy, e.clientY);
      var viewW = Math.abs(e.clientX - sx);
      var viewH = Math.abs(e.clientY - sy);

      if (viewW > 10 && viewH > 5) {
        // 先获取图片信息，再移除遮罩
        var bgImg = document.getElementById('selectBgImg');
        var imgRect = bgImg.getBoundingClientRect();
        var origW = selectOverlay.origWindowSize.w;
        var origH = selectOverlay.origWindowSize.h;

        // 将屏幕坐标转换为图片显示坐标，再转换为原始窗口坐标
        var imgX = viewX - imgRect.left;
        var imgY = viewY - imgRect.top;
        var scaleX = origW / imgRect.width;
        var scaleY = origH / imgRect.height;

        // 相对于窗口客户区的坐标
        var relX = Math.round(imgX * scaleX);
        var relY = Math.round(imgY * scaleY);
        var relW = Math.round(viewW * scaleX);
        var relH = Math.round(viewH * scaleY);

        // 边界检查
        relX = Math.max(0, Math.min(relX, origW - relW));
        relY = Math.max(0, Math.min(relY, origH - relH));
        relW = Math.min(relW, origW - relX);
        relH = Math.min(relH, origH - relY);

        captureRegion = {x: relX, y: relY, width: relW, height: relH, relative: true};
        document.getElementById('capX').value = relX;
        document.getElementById('capY').value = relY;
        document.getElementById('capW').value = relW;
        document.getElementById('capH').value = relH;
        document.getElementById('regionDisplay').textContent = '(相对窗口 ' + relX + ',' + relY + ') ' + relW + 'x' + relH;
        try { localStorage.setItem('ghostCaptureRegion', JSON.stringify(captureRegion)); } catch(ex) {}
      }

      // 移除遮罩（在获取信息之后）
      if (selectOverlay && selectOverlay.parentNode) {
        selectOverlay.parentNode.removeChild(selectOverlay);
      }
      selectOverlay = null;
    };

    selectOverlay.onkeydown = function(e) {
      if (e.key === 'Escape') {
        if (selectOverlay && selectOverlay.parentNode) {
          selectOverlay.parentNode.removeChild(selectOverlay);
        }
        selectOverlay = null;
      }
    };

    selectOverlay.tabIndex = 0;
    selectOverlay.focus();
  })
  .catch(function(err) {
    alert('截图失败: ' + err.message);
    setStatus('失败');
  });
};

  window.previewCapture = function() {
    var hwnd = document.getElementById('windowSelect').value;
    if (!hwnd) {
      alert('请先选择窗口');
      return;
    }
    var x = parseInt(document.getElementById('capX').value) || 0;
    var y = parseInt(document.getElementById('capY').value) || 0;
    var w = parseInt(document.getElementById('capW').value) || 200;
    var h = parseInt(document.getElementById('capH').value) || 30;
    setStatus('预览中...');

    // 使用相对坐标截图
    fetch('/api/capture_region_relative', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hwnd: parseInt(hwnd), region: {x: x, y: y, width: w, height: h}})
    }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.success) {
        document.getElementById('previewBox').style.display = 'block';
        document.getElementById('previewImg').src = 'data:image/png;base64,' + d.image;
        setStatus('就绪');
      } else {
        alert('截图失败: ' + d.error);
        setStatus('失败');
      }
    }).catch(function(e) { alert('预览失败: ' + e); setStatus('失败'); });
  };

  window.saveCaptureRegion = function() {
    var x = parseInt(document.getElementById('capX').value) || 0;
    var y = parseInt(document.getElementById('capY').value) || 0;
    var w = parseInt(document.getElementById('capW').value) || 400;
    var h = parseInt(document.getElementById('capH').value) || 120;
    captureRegion = {x: x, y: y, width: w, height: h, relative: true};
    document.getElementById('regionDisplay').textContent = '(相对窗口 ' + x + ',' + y + ') ' + w + 'x' + h;
    try { localStorage.setItem('ghostCaptureRegion', JSON.stringify(captureRegion)); } catch(e) {}
    alert('已保存: (相对窗口 ' + x + ',' + y + ') ' + w + 'x' + h);
  };

  window.captureAndRecognize = function() {
    var hwnd = document.getElementById('windowSelect').value;
    if (!hwnd) {
      alert('请先选择窗口');
      return;
    }
    if (!captureRegion) {
      captureRegion = {
        x: parseInt(document.getElementById('capX').value) || 0,
        y: parseInt(document.getElementById('capY').value) || 0,
        width: parseInt(document.getElementById('capW').value) || 400,
        height: parseInt(document.getElementById('capH').value) || 120
      };
    }
    setStatus('识别中...');
    // 使用相对窗口坐标
    fetch('/api/ghost/capture', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hwnd: parseInt(hwnd), region: captureRegion})
    }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.success && d.map) {
        showResult(d);
        addToHistory(d.map, d.x, d.y);
      } else {
        alert('未识别到坐标');
        setStatus('失败');
      }
    }).catch(function(e) { alert('识别失败: ' + e); setStatus('失败'); });
  };

  window.predictFromInput = function() {
    var mapName = document.getElementById('mapSelect').value;
    var x = parseInt(document.getElementById('xInput').value) || 0;
    var y = parseInt(document.getElementById('yInput').value) || 0;
    if (!mapName) { alert('请选择地图'); return; }
    doPredict(mapName, x, y);
  };

  function doPredict(mapName, x, y) {
    setStatus('预测中...');
    fetch('/api/ghost/predict', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({map: mapName, x: x, y: y})
    }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.success) {
        showResult(d);
        addToHistory(d.map, d.x, d.y);
        setStatus('就绪');
      } else {
        alert('预测失败: ' + d.error);
      }
    }).catch(function(e) { alert('请求失败: ' + e); });
  }

  function showResult(data) {
    currentResult = data;
    if (data.annotated_image) {
      currentImageData = 'data:image/png;base64,' + data.annotated_image;
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('mapMain').style.display = 'block';
      document.getElementById('mapImg').src = currentImageData;
      document.getElementById('zoomControls').style.display = 'flex';
      resetZoom();
      // 更新浮动窗口（如果已打开）
      if (floatWindowOpen) {
        var imageData = currentImageData.split(',')[1];
        fetch('/api/ghost/float_window', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: 'show', image_data: imageData, zoom: 1.0})
        });
      }
    }
    document.getElementById('resultMap').textContent = data.map || '-';
    document.getElementById('resultCoord').textContent = '(' + data.x + ', ' + data.y + ')';
    document.getElementById('resultConf').textContent = data.confidence || '-';
    document.getElementById('resultYellow').textContent = data.yellow_pixels || '-';
    // 显示黄色文字提取图片
    if (data.yellow_image) {
      document.getElementById('yellowImageBox').style.display = 'block';
      document.getElementById('yellowImage').src = 'data:image/png;base64,' + data.yellow_image;
    } else {
      document.getElementById('yellowImageBox').style.display = 'none';
    }
    // 显示怪物名字图片
    if (data.monster_image) {
      document.getElementById('monsterImageBox').style.display = 'block';
      document.getElementById('monsterImage').src = 'data:image/png;base64,' + data.monster_image;
    } else {
      document.getElementById('monsterImageBox').style.display = 'none';
    }
    updateAreas('resultAreas', data.position_areas || [], data.corner_areas || []);
    if (data.map) document.getElementById('mapSelect').value = data.map;
    document.getElementById('xInput').value = data.x;
    document.getElementById('yInput').value = data.y;
  }

  function updateAreas(elId, areas, corners) {
    var names = ['1右上', '2左上', '3左下', '4右下'];
    var html = '';
    for (var i = 0; i < 4; i++) {
      var q = i + 1;
      var cls = areas.indexOf(q) >= 0 ? (corners.indexOf(q) >= 0 ? 'corner' : 'active') : 'inactive';
      html += '<span class="quadrant-btn ' + cls + '">' + names[i] + (corners.indexOf(q) >= 0 ? '*' : '') + '</span>';
    }
    document.getElementById(elId).innerHTML = html;
  }

  function setStatus(t) { document.getElementById('statusBadge').textContent = t; }

  // 无边框置顶窗口（tkinter后端）
  var floatWindowOpen = false;

  window.togglePip = function() {
    if (!currentImageData) { alert('请先识别坐标或手动预测'); return; }

    var action = floatWindowOpen ? 'close' : 'show';

    // 提取base64数据（去掉data:image/png;base64,前缀）
    var imageData = currentImageData.split(',')[1];

    fetch('/api/ghost/float_window', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: action, image_data: imageData, zoom: 1.0})
    }).then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.success) {
        floatWindowOpen = action === 'show';
        document.getElementById('pipBtn').textContent = floatWindowOpen ? '关闭置顶' : '画中画';
      } else {
        alert('操作失败: ' + (d.error || '未知错误'));
      }
    }).catch(function(e) {
      alert('请求失败: ' + e);
    });
  };


  function addToHistory(mapName, x, y) {
    var key = mapName + '(' + x + ',' + y + ')';
    for (var i = 0; i < predictionHistory.length; i++) {
      if (predictionHistory[i].key === key) return;
    }
    predictionHistory.unshift({key: key, map: mapName, x: x, y: y});
    if (predictionHistory.length > 15) predictionHistory.pop();
    updateHistoryList();
  }

  function updateHistoryList() {
    var list = document.getElementById('historyList');
    if (!predictionHistory.length) { list.innerHTML = '<div style="color:#555;font-size:12px">暂无</div>'; return; }
    list.innerHTML = predictionHistory.map(function(h) {
      return '<div class="history-item" onclick="quickPredict(\'' + h.map + '\',' + h.x + ',' + h.y + ')"><span class="map">' + h.map + '</span><span class="coord">(' + h.x + ',' + h.y + ')</span></div>';
    }).join('');
  }

  window.quickPredict = function(mapName, x, y) { doPredict(mapName, x, y); };

  window.zoomIn = function() { setZoom(zoom * 1.25); };
  window.zoomOut = function() { setZoom(zoom / 1.25); };
  window.resetZoom = function() { setZoom(1.0); panX = 0; panY = 0; updateMapTransform(); };

  function setZoom(newZoom) {
    zoom = Math.max(0.25, Math.min(5, newZoom));
    document.getElementById('zoomLevel').textContent = Math.round(zoom * 100) + '%';
    updateMapTransform();
  }

  function updateMapTransform() {
    document.getElementById('mapMain').style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoom + ')';
  }

  document.getElementById('mapContainer').addEventListener('wheel', function(e) {
    if (!currentImageData) return;
    e.preventDefault();
    setZoom(zoom * (e.deltaY > 0 ? 0.9 : 1.1));
  }, {passive: false});

  document.getElementById('mapMain').addEventListener('mousedown', function(e) {
    if (!currentImageData) return;
    isDragging = true;
    dragStartX = e.clientX - panX;
    dragStartY = e.clientY - panY;
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    panX = e.clientX - dragStartX;
    panY = e.clientY - dragStartY;
    updateMapTransform();
  });

  document.addEventListener('mouseup', function() { isDragging = false; });

  // 快捷键配置（默认Ctrl+A）
  var hotkeyConfig = {ctrl: true, shift: false, alt: false, key: 'A'};
  var settingHotkey = false;

  // 加载保存的快捷键
  function loadHotkey() {
    try {
      var saved = localStorage.getItem('ghostHotkey');
      if (saved) {
        hotkeyConfig = JSON.parse(saved);
      }
    } catch(e) {}
    updateHotkeyDisplay();
  }

  function updateHotkeyDisplay() {
    var text = '';
    if (hotkeyConfig.ctrl) text += 'Ctrl+';
    if (hotkeyConfig.shift) text += 'Shift+';
    if (hotkeyConfig.alt) text += 'Alt+';
    text += hotkeyConfig.key.toUpperCase();
    document.getElementById('hotkeyDisplay').textContent = text;
  }

  window.startSetHotkey = function() {
    settingHotkey = true;
    document.getElementById('hotkeyDisplay').textContent = '请按下新快捷键...';
    document.getElementById('hotkeyDisplay').style.background = '#e94560';
  };

  document.addEventListener('keydown', function(e) {
    // 设置新快捷键
    if (settingHotkey) {
      settingHotkey = false;
      hotkeyConfig = {
        ctrl: e.ctrlKey,
        shift: e.shiftKey,
        alt: e.altKey,
        key: e.key.toUpperCase()
      };
      if (hotkeyConfig.key === 'CONTROL' || hotkeyConfig.key === 'SHIFT' || hotkeyConfig.key === 'ALT') {
        hotkeyConfig.key = 'A';
      }
      try { localStorage.setItem('ghostHotkey', JSON.stringify(hotkeyConfig)); } catch(ex) {}
      updateHotkeyDisplay();
      document.getElementById('hotkeyDisplay').style.background = '#0f3460';
      e.preventDefault();
      return;
    }

    // 执行识别
    if (e.ctrlKey === hotkeyConfig.ctrl &&
        e.shiftKey === hotkeyConfig.shift &&
        e.altKey === hotkeyConfig.alt &&
        e.key.toUpperCase() === hotkeyConfig.key) {
      e.preventDefault();
      captureAndRecognize();
    }
  });

  // 加载保存的截图区域
  try {
    var saved = localStorage.getItem('ghostCaptureRegion');
    if (saved) {
      captureRegion = JSON.parse(saved);
      document.getElementById('capX').value = captureRegion.x;
      document.getElementById('capY').value = captureRegion.y;
      document.getElementById('capW').value = captureRegion.width;
      document.getElementById('capH').value = captureRegion.height;
      document.getElementById('regionDisplay').textContent = '(' + captureRegion.x + ',' + captureRegion.y + ') ' + captureRegion.width + 'x' + captureRegion.height;
    }
  } catch(e) {}

  loadHotkey();
  loadMaps();
  refreshWindows();

  // 置信度滑块更新显示
  setInterval(pollGhostStatus, 2000);

  // 定时获取实时结果（监控时才检查）
  setInterval(function() {
    if (!monitoringActive) return;
    fetch('/api/ghost/monitor/last_result')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success && d.map) {
          showResult(d);
          addToHistory(d.map, d.x, d.y);
        }
      });
  }, 1000);
})();
</script>
</body>
</html>
