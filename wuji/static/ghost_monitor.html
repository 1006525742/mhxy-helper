<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抓鬼助手 - 画中画监控</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f23; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; overflow: hidden; }

/* 头部 */
.header {
  background: #16213e; padding: 10px 20px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 2px solid #0f3460;
}
.header h1 { font-size: 16px; color: #e94560; }
.btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: #0f3460; color: #eee; }
.btn-success { background: #1b5e20; color: #eee; }
.btn-danger { background: #b71c1c; color: #eee; }
.btn-warning { background: #e65100; color: #eee; }
.status-badge { padding: 3px 10px; border-radius: 10px; font-size: 11px; background: #0f3460; }
.status-badge.loading { background: #e65100; animation: pulse 1s infinite; }
.status-badge.ready { background: #1b5e20; }
.status-badge.triggered { background: #ffc107; color: #000; animation: pulse 0.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

/* 主区域 */
.main { display: flex; height: calc(100vh - 50px); }

/* 左侧面板 */
.left-panel { width: 280px; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; background: #16213e; }
.section { background: #1a1f2e; padding: 12px; border-radius: 6px; }
.section h2 { font-size: 14px; color: #4fc3f7; margin-bottom: 8px; }
.info-item { background: #16213e; padding: 8px; border-radius: 4px; margin-bottom: 6px; }
.info-item .label { color: #888; font-size: 11px; }
.info-item .value { color: #4fc3f7; font-size: 14px; font-weight: bold; }

/* 监控状态指示 */
.monitor-status {
  padding: 20px; text-align: center; border-radius: 8px;
  background: #1a1f2e; margin-bottom: 10px;
  border: 3px solid #2a3040; transition: border-color 0.3s;
}
.monitor-status.active { border-color: #1b5e20; }
.monitor-status.triggered { border-color: #ffc107; animation: glow 0.5s infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 0 10px #ffc107; } 50% { box-shadow: 0 0 20px #ffc107; } }
.monitor-status .icon { font-size: 40px; margin-bottom: 10px; }
.monitor-status .text { font-size: 14px; color: #888; }
.monitor-status.triggered .text { color: #ffc107; font-weight: bold; }

/* 检测计数 */
.detect-count { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
.detect-item { padding: 8px 12px; background: #16213e; border-radius: 4px; text-align: center; }
.detect-item .name { font-size: 11px; color: #888; }
.detect-item .count { font-size: 18px; font-weight: bold; }
.detect-item.active .count { color: #4fc3f7; }
.detect-item.triggered .count { color: #ffc107; }

/* 右侧画中画区域 */
.right-panel { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }

/* 画中画窗口 */
.pip-window {
  width: 400px; background: #16213e; border-radius: 12px;
  border: 3px solid #2a3040; padding: 15px; display: none;
}
.pip-window.active { display: block; border-color: #4fc3f7; }
.pip-window.triggered { border-color: #ffc107; animation: glow 0.5s infinite; }
.pip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.pip-header h3 { font-size: 14px; color: #4fc3f7; }
.pip-close { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
.pip-close:hover { color: #e94560; }

/* 地图显示 */
.map-display { background: #0f0f23; border-radius: 8px; padding: 10px; text-align: center; }
.map-display img { max-width: 100%; max-height: 300px; border-radius: 4px; }
.map-name { font-size: 16px; color: #4fc3f7; margin-bottom: 5px; font-weight: bold; }
.map-coord { font-size: 14px; color: #e0e0e0; }
.map-areas { margin-top: 10px; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.area-tag { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
.area-tag.position { background: #e94560; color: #fff; }
.area-tag.corner { background: #ff9800; color: #000; }

/* 日志 */
.log-section { max-height: 150px; overflow-y: auto; }
.log-item { font-size: 11px; color: #888; margin-bottom: 2px; padding: 2px 4px; border-radius: 2px; }
.log-item.error { color: #e94560; background: rgba(233,69,96,0.1); }
.log-item.success { color: #4caf50; background: rgba(76,175,80,0.1); }
.log-item.trigger { color: #ffc107; background: rgba(255,193,7,0.1); }

/* 截图预览（调试用，可隐藏） */
.debug-preview { display: none; margin-top: 10px; }
.debug-preview img { max-width: 100%; border-radius: 4px; border: 1px solid #2a3040; }
</style>
</head>
<body>

<div class="header">
  <h1>👻 抓鬼助手 - 画中画监控</h1>
  <span class="status-badge" id="statusBadge">加载模型...</span>
  <button class="btn btn-primary" id="btnShare" onclick="startMonitor()" disabled>开始监控</button>
  <button class="btn btn-danger" id="btnStop" onclick="stopMonitor()" disabled>停止监控</button>
  <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:#aaa;margin-left:12px;">
    <input type="checkbox" id="chkLowPower" onchange="toggleLowPower()"> 🎮 低占用模式
  </label>
  <span id="fpsDisplay" style="color:#4fc3f7;font-size:12px;"></span>
</div>

<div class="main">
  <!-- 左侧面板 -->
  <div class="left-panel">
    <!-- 监控状态 -->
    <div class="monitor-status" id="monitorStatus">
      <div class="icon" id="monitorIcon">😴</div>
      <div class="text" id="monitorText">等待开始监控</div>
      <div class="detect-count">
        <div class="detect-item" id="detectTaskTrack">
          <div class="name">任务追踪</div>
          <div class="count">0</div>
        </div>
        <div class="detect-item" id="detectZhongKui">
          <div class="name">钟馗</div>
          <div class="count">0</div>
        </div>
      </div>
    </div>

    <!-- 识别结果 -->
    <div class="section">
      <h2>🎯 识别结果</h2>
      <div class="info-item">
        <div class="label">地图</div>
        <div class="value" id="resultMap">-</div>
      </div>
      <div class="info-item">
        <div class="label">坐标</div>
        <div class="value" id="resultCoord">-</div>
      </div>
      <div class="info-item">
        <div class="label">鬼名</div>
        <div class="value" id="resultGhost">-</div>
      </div>
      <div class="info-item">
        <div class="label">预测区域</div>
        <div class="value" id="resultAreas">-</div>
      </div>
    </div>

    <!-- 日志 -->
    <div class="section log-section" id="logSection">
      <h2>📋 日志</h2>
      <div id="logBox"></div>
    </div>
  </div>

  <!-- 右侧画中画 -->
  <div class="right-panel">
    <div class="pip-window" id="pipWindow">
      <div class="pip-header">
        <h3>📍 小鬼位置预测</h3>
        <button class="pip-close" onclick="hidePip()">×</button>
      </div>
      <div class="map-display">
        <div class="map-name" id="pipMapName">-</div>
        <div class="map-coord" id="pipCoord">-</div>
        <img id="pipMapImage" style="display:none">
        <div class="map-areas" id="pipAreas"></div>
      </div>
    </div>

    <!-- 调试预览 -->
    <div class="debug-preview" id="debugPreview">
      <img id="debugImage">
    </div>
  </div>
</div>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>

<script>
// 配置
const CONFIG = {
  yoloModelPath: '/static/models/model.json',
  apiBaseUrl: '',  // 同源访问，通过 Nginx 反代
  confidenceThreshold: 0.4,
  inputSize: 480,
  classes: ['任务追踪', '钟馗', '黑无常', '店小二', '接引仙女', '左侧干扰', '驿站老板', '强盗对话'],
  monitorInterval: 200,  // 监控间隔(ms)
};
let isLowPower = false;
function toggleLowPower() {
  isLowPower = document.getElementById('chkLowPower').checked;
  if (isLowPower) {
    CONFIG.monitorInterval = 800;
  } else {
    CONFIG.monitorInterval = 200;
  }
  console.log('性能模式: ' + (isLowPower ? '🎮 低占用 (interval=800ms)' : '🚀 高性能 (interval=200ms)'));
}

// 全局状态
let yoloModel = null;
let videoStream = null;
let video = null;
let canvas = null;
let ctx = null;
let isMonitoring = false;
let monitorLoopId = null;
let lastTriggerTime = 0;
let triggerCooldown = 3000;  // 触发后冷却时间(ms)
let detectCount = { taskTrack: 0, zhongKui: 0 };

// 日志
function log(msg, type = 'info') {
  const logBox = document.getElementById('logBox');
  const item = document.createElement('div');
  item.className = 'log-item ' + type;
  item.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logBox.appendChild(item);
  logBox.scrollTop = logBox.scrollHeight;
  console.log(msg);
}

function setStatus(text, type = '') {
  const badge = document.getElementById('statusBadge');
  badge.textContent = text;
  badge.className = 'status-badge ' + type;
}

// 初始化模型
async function initModels() {
  try {
    setStatus('加载YOLO...', 'loading');
    log('加载YOLO模型...');

    yoloModel = await tf.loadGraphModel(CONFIG.yoloModelPath);

    setStatus('就绪', 'ready');
    log('YOLO模型加载完成', 'success');
    document.getElementById('btnShare').disabled = false;

  } catch (e) {
    log('模型加载失败: ' + e.message, 'error');
    setStatus('加载失败', 'error');
  }
}

// 开始监控
async function startMonitor() {
  try {
    // 获取屏幕共享
    videoStream = await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: 'never' },
      audio: false
    });

    video = document.createElement('video');
    video.srcObject = videoStream;
    await video.play();

    canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx = canvas.getContext('2d');

    // 监听停止
    videoStream.getVideoTracks()[0].onended = () => stopMonitor();

    isMonitoring = true;
    document.getElementById('btnShare').disabled = true;
    document.getElementById('btnStop').disabled = false;

    // 更新监控状态
    updateMonitorStatus('active', '🔍 监控中...', '正在检测任务追踪和钟馗');
    setStatus('监控中', 'ready');
    log('开始监控', 'success');

    // 开始检测循环
    monitorLoop();

  } catch (e) {
    log('无法启动监控: ' + e.message, 'error');
    if (e.name === 'NotAllowedError') {
      log('用户取消了窗口共享', 'error');
    }
  }
}

// 停止监控
function stopMonitor() {
  isMonitoring = false;

  if (monitorLoopId) {
    clearInterval(monitorLoopId);
    monitorLoopId = null;
  }

  if (videoStream) {
    videoStream.getTracks().forEach(t => t.stop());
    videoStream = null;
  }

  video = null;
  canvas = null;

  document.getElementById('btnShare').disabled = false;
  document.getElementById('btnStop').disabled = true;

  updateMonitorStatus('inactive', '😴 已停止', '等待开始监控');
  setStatus('就绪', 'ready');
  hidePip();
  log('停止监控');
}

// 监控循环
async function monitorLoop() {
  if (!isMonitoring || !video || !yoloModel) return;

  const t0 = performance.now();

  try {
    // 截图
    ctx.drawImage(video, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    // YOLO检测
    const detections = await runYOLO(imageData);

    // 统计检测结果
    const taskTrack = detections.filter(d => d.classId === 0 && d.conf > CONFIG.confidenceThreshold);
    const zhongKui = detections.filter(d => d.classId === 1 && d.conf > CONFIG.confidenceThreshold);

    // 更新计数显示
    detectCount.taskTrack = taskTrack.length;
    detectCount.zhongKui = zhongKui.length;
    updateDetectCount();

    // 判断触发条件：任务追踪 + 钟馗 同时出现
    const triggered = taskTrack.length > 0 && zhongKui.length > 0;

    if (triggered) {
      const now = Date.now();
      if (now - lastTriggerTime > triggerCooldown) {
        lastTriggerTime = now;
        onTrigger(imageData, taskTrack[0], zhongKui[0]);
      }
    } else if (taskTrack.length === 0 && zhongKui.length === 0) {
      // 条件不满足时重置冷却，确保下次对话立即触发
      lastTriggerTime = 0;
    }

    // 更新监控状态
    if (triggered) {
      updateMonitorStatus('triggered', '⚡ 检测到抓鬼任务!', '任务追踪 + 钟馗');
    } else if (taskTrack.length > 0 || zhongKui.length > 0) {
      updateMonitorStatus('active', '🔍 监控中...', `任务追踪:${taskTrack.length} 钟馗:${zhongKui.length}`);
    } else {
      updateMonitorStatus('active', '🔍 监控中...', '未检测到目标');
    }

    // FPS显示
    const fps = Math.round(1000 / (performance.now() - t0));
    document.getElementById('fpsDisplay').textContent = fps + ' FPS' + (isLowPower ? ' 🎮' : '');

  } catch (e) {
    log('检测错误: ' + e.message, 'error');
  }

  // 继续下一轮
  if (isMonitoring) {
    monitorLoopId = setTimeout(monitorLoop, CONFIG.monitorInterval);
  }
}

// YOLO推理
async function runYOLO(imageData) {
  const { width, height, data } = imageData;
  const inputSize = CONFIG.inputSize;

  // 创建输入tensor (NHWC格式)
  const inputTensor = tf.tidy(() => {
    // 先转换为tensor3d
    let tensor = tf.tensor3d(new Uint8Array(data), [height, width, 4]);
    // 只取RGB通道
    tensor = tensor.slice([0, 0, 0], [-1, -1, 3]);
    // 缩放
    tensor = tf.image.resizeBilinear(tensor, [inputSize, inputSize]);
    // 归一化
    tensor = tensor.toFloat().div(255);
    // 添加batch维度
    return tensor.expandDims(0);
  });

  // 执行推理
  const output = await yoloModel.executeAsync({ images: inputTensor });
  const outputData = await output.data();
  const dims = output.shape;

  // 清理
  inputTensor.dispose();
  output.dispose();

  // 解析输出: [1, 12, 4725]
  const numAnchors = dims[2];
  const boxes = [];

  for (let i = 0; i < numAnchors; i++) {
    const cx = outputData[0 * numAnchors + i];
    const cy = outputData[1 * numAnchors + i];
    const w = outputData[2 * numAnchors + i];
    const h = outputData[3 * numAnchors + i];

    // 找最大置信度的类别
    let maxConf = 0;
    let classId = 0;
    for (let c = 4; c < 12; c++) {
      const conf = outputData[c * numAnchors + i];
      if (conf > maxConf) {
        maxConf = conf;
        classId = c - 4;
      }
    }

    if (maxConf > CONFIG.confidenceThreshold) {
      boxes.push({
        x1: (cx - w/2) * width / inputSize,
        y1: (cy - h/2) * height / inputSize,
        x2: (cx + w/2) * width / inputSize,
        y2: (cy + h/2) * height / inputSize,
        conf: maxConf,
        classId,
        className: CONFIG.classes[classId]
      });
    }
  }

  return boxes;
}

// 触发处理
async function onTrigger(imageData, taskTrack, zhongKui) {
  log('触发抓鬼检测!', 'trigger');
  setStatus('识别中...', 'triggered');

  try {
    // 将截图转为PNG
    const pngData = canvas.toDataURL('image/png');

    // 调用后端API进行模板匹配识别
    const response = await fetch(`${CONFIG.apiBaseUrl}/api/ghost/capture`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        // 发送截图base64（去掉前缀）
        image: pngData.split(',')[1]
      })
    });

    const result = await response.json();

    if (result.success) {
      log(`识别成功: ${result.map} (${result.x}, ${result.y})`, 'success');

      // 更新结果
      document.getElementById('resultMap').textContent = result.map || '-';
      document.getElementById('resultCoord').textContent = `${result.x}, ${result.y}`;
      document.getElementById('resultGhost').textContent = '-';
      document.getElementById('resultAreas').textContent =
        result.position_areas?.join(', ') || '-';

      // 显示画中画
      showPip(result);

      // 显示标注地图
      if (result.annotated_image) {
        document.getElementById('pipMapImage').src =
          `data:image/png;base64,${result.annotated_image}`;
        document.getElementById('pipMapImage').style.display = 'block';
      }

      setStatus('识别完成', 'ready');

    } else {
      log('识别失败: ' + result.error, 'error');
      setStatus('识别失败', 'error');
    }

  } catch (e) {
    log('API调用失败: ' + e.message, 'error');
    setStatus('识别失败', 'error');
  }
}

// 显示画中画
function showPip(result) {
  const pip = document.getElementById('pipWindow');
  pip.classList.add('active', 'triggered');

  document.getElementById('pipMapName').textContent = result.map || '-';
  document.getElementById('pipCoord').textContent = `坐标: ${result.x}, ${result.y}`;

  // 显示预测区域
  const areasDiv = document.getElementById('pipAreas');
  areasDiv.innerHTML = '';

  if (result.position_areas && result.position_areas.length > 0) {
    result.position_areas.forEach(area => {
      const tag = document.createElement('span');
      tag.className = 'area-tag position';
      tag.textContent = area;
      areasDiv.appendChild(tag);
    });
  }

  if (result.corner_areas && result.corner_areas.length > 0) {
    result.corner_areas.forEach(area => {
      const tag = document.createElement('span');
      tag.className = 'area-tag corner';
      tag.textContent = area;
      areasDiv.appendChild(tag);
    });
  }
}

// 隐藏画中画
function hidePip() {
  const pip = document.getElementById('pipWindow');
  pip.classList.remove('active', 'triggered');
}

// 更新监控状态显示
function updateMonitorStatus(status, icon, text) {
  const statusDiv = document.getElementById('monitorStatus');
  const iconDiv = document.getElementById('monitorIcon');
  const textDiv = document.getElementById('monitorText');

  statusDiv.className = 'monitor-status ' + status;
  iconDiv.textContent = icon;
  textDiv.textContent = text;
}

// 更新检测计数
function updateDetectCount() {
  const ttDiv = document.getElementById('detectTaskTrack');
  const zkDiv = document.getElementById('detectZhongKui');

  ttDiv.querySelector('.count').textContent = detectCount.taskTrack;
  zkDiv.querySelector('.count').textContent = detectCount.zhongKui;

  ttDiv.classList.toggle('active', detectCount.taskTrack > 0);
  zkDiv.classList.toggle('active', detectCount.zhongKui > 0);

  // 触发时高亮
  const triggered = detectCount.taskTrack > 0 && detectCount.zhongKui > 0;
  ttDiv.classList.toggle('triggered', triggered);
  zkDiv.classList.toggle('triggered', triggered);
}

// 页面加载 - 自动初始化
document.addEventListener('DOMContentLoaded', initModels);
</script>
</body>
</html>
