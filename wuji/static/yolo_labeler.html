<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO 标注工具 - 任务栏检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar button {
            padding: 10px 20px;
            background: #16213e;
            border: 1px solid #00d4ff;
            color: #00d4ff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .toolbar button:hover {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .toolbar button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toolbar input {
            padding: 8px 12px;
            background: #16213e;
            border: 1px solid #333;
            color: #eee;
            border-radius: 5px;
            font-size: 14px;
        }

        .main-content {
            display: flex;
            gap: 20px;
        }

        .image-panel {
            flex: 1;
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
        }

        .sidebar {
            width: 300px;
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            cursor: crosshair;
        }

        #imageCanvas {
            max-width: 100%;
            border: 2px solid #333;
            border-radius: 5px;
        }

        .stats {
            background: #0f0f23;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .stats h3 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 13px;
        }

        .image-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .image-item {
            background: #0f0f23;
            padding: 8px;
            border-radius: 5px;
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #333;
            transition: all 0.2s;
        }

        .image-item:hover {
            border-color: #00d4ff;
        }

        .image-item.labeled {
            background: #1a4a1a;
            border-color: #00ff00;
        }

        .image-item.current {
            border-color: #ff6600;
            box-shadow: 0 0 5px #ff6600;
        }

        .class-selector {
            margin-bottom: 15px;
        }

        .class-selector label {
            display: block;
            margin-bottom: 5px;
            color: #00d4ff;
            font-size: 13px;
        }

        .class-selector select {
            width: 100%;
            padding: 8px;
            background: #0f0f23;
            border: 1px solid #333;
            color: #eee;
            border-radius: 5px;
        }

        .help-text {
            background: #0f0f23;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .help-text p {
            margin: 5px 0;
        }

        .export-panel {
            margin-top: 15px;
        }

        .export-panel button {
            width: 100%;
            padding: 12px;
            background: #00aa00;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .export-panel button:hover {
            background: #00cc00;
        }

        .box-info {
            background: #0f0f23;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #0f0f23;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff00);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 YOLO 标注工具 - 任务栏检测</h1>

        <div class="toolbar">
            <button id="loadServerBtn">🔄 从服务器加载标注图片</button>
            <button id="loadBtn">📁 加载本地图片</button>
            <button id="autoLabelBtn" style="background: #ff6600; border-color: #ff6600;">🤖 一键YOLO标注</button>
            <button id="prevBtn" disabled>⬅ 上一张</button>
            <button id="nextBtn" disabled>➡ 下一张</button>
            <button id="clearBtn">🗑 清除标注</button>
            <button id="deleteBtn">❌ 删除当前框</button>
            <span style="color: #888;">|</span>
            <span id="statusText">点击"从服务器加载标注图片"</span>
        </div>

        <div class="main-content">
            <div class="image-panel">
                <div class="canvas-container">
                    <canvas id="imageCanvas"></canvas>
                </div>
            </div>

            <div class="sidebar">
                <div class="stats">
                    <h3>📊 标注进度</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div class="stats-item">
                        <span>已标注:</span>
                        <span id="labeledCount">0</span>
                    </div>
                    <div class="stats-item">
                        <span>总数:</span>
                        <span id="totalCount">0</span>
                    </div>
                    <div class="stats-item">
                        <span>当前图片:</span>
                        <span id="currentImage">-</span>
                    </div>
                </div>

                <div class="class-selector">
                    <label>目标类别:</label>
                    <select id="classSelect">
                        <option value="0">task_bar (任务栏)</option>
                    </select>
                </div>

                <div class="help-text">
                    <p><b>使用方法:</b></p>
                    <p>1. 点击"加载图片"选择目录</p>
                    <p>2. 在图片上拖拽绘制矩形框</p>
                    <p>3. 按 A/D 或 ←/→ 切换图片</p>
                    <p>4. 标注完成后导出YOLO格式</p>
                </div>

                <div class="box-info" id="boxInfo">
                    <b>当前标注:</b> 无
                </div>

                <div class="export-panel">
                    <button id="exportBtn">📦 保存到服务器并导出训练数据</button>
                    <button id="autoLabelAllBtn" style="background: #ff6600; border-color: #ff6600; margin-top: 8px;">🤖 一键标注所有图片</button>
                </div>

                <h3 style="margin-top: 15px; color: #00d4ff; font-size: 14px;">📷 图片列表</h3>
                <div class="image-list" id="imageList"></div>
            </div>
        </div>
    </div>

    <input type="file" id="directoryInput" webkitdirectory multiple style="display: none;">

    <script>
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');

        let images = [];
        let currentIndex = 0;
        let currentImage = null;
        let boxes = {}; // { imageName: [{x, y, w, h, class}] }
        let isDrawing = false;
        let startX, startY;
        let currentBox = null;

        // 颜色配置
        const colors = ['#00ff00', '#ff0000', '#0000ff', '#ffff00'];
        const classNames = ['task_bar'];

        // 从服务器加载图片
        document.getElementById('loadServerBtn').addEventListener('click', async () => {
            try {
                document.getElementById('statusText').textContent = '正在加载图片...';

                // 获取图片列表
                const response = await fetch('/static/label_images/');
                const text = await response.text();

                // 解析HTML获取图片列表
                const matches = text.match(/href="[^"]+\.jpg"/g);
                if (matches) {
                    images = matches.map(m => {
                        const name = m.match(/href="([^"]+\.jpg)"/)[1];
                        return {
                            name: name,
                            url: `/static/label_images/${name}`
                        };
                    }).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

                    if (images.length > 0) {
                        currentIndex = 0;
                        await loadImage(0);
                        updateUI();
                        document.getElementById('statusText').textContent = `已加载 ${images.length} 张图片`;
                        document.getElementById('loadServerBtn').disabled = false;
                    }
                } else {
                    // 如果HTML解析失败，直接列出已知图片
                    const knownImages = [
                        'frame_8528.jpg', 'frame_8529.jpg',
                        'frame_14415.jpg', 'frame_14416.jpg', 'frame_14417.jpg', 'frame_14418.jpg',
                        'frame_14419.jpg', 'frame_14420.jpg', 'frame_14421.jpg', 'frame_14422.jpg',
                        'frame_14423.jpg', 'frame_14424.jpg', 'frame_14425.jpg', 'frame_14426.jpg',
                        'frame_14427.jpg', 'frame_14428.jpg', 'frame_14429.jpg', 'frame_14430.jpg',
                        'frame_14431.jpg', 'frame_14432.jpg', 'frame_14433.jpg', 'frame_14434.jpg',
                        'frame_14435.jpg', 'frame_14436.jpg', 'frame_14437.jpg', 'frame_14438.jpg',
                        'frame_14439.jpg', 'frame_14440.jpg', 'frame_14441.jpg', 'frame_14442.jpg',
                        'frame_14443.jpg', 'frame_14444.jpg'
                    ];

                    images = knownImages.map(name => ({
                        name: name,
                        url: `/static/label_images/${name}`
                    }));

                    currentIndex = 0;
                    await loadImage(0);
                    updateUI();
                    document.getElementById('statusText').textContent = `已加载 ${images.length} 张图片`;
                }
            } catch (e) {
                console.error('加载失败:', e);
                document.getElementById('statusText').textContent = '加载失败，请检查服务是否运行';
            }
        });

        // 加载本地图片
        document.getElementById('loadBtn').addEventListener('click', () => {
            document.getElementById('directoryInput').click();
        });

        document.getElementById('directoryInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(f =>
                f.type.startsWith('image/') || f.name.endsWith('.jpg') || f.name.endsWith('.png')
            );

            images = files.map(f => ({
                name: f.name,
                file: f,
                url: URL.createObjectURL(f)
            }));

            // 按文件名排序
            images.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

            if (images.length > 0) {
                currentIndex = 0;
                await loadImage(0);
                updateUI();
                document.getElementById('statusText').textContent = `已加载 ${images.length} 张图片`;
            }
        });

        async function loadImage(index) {
            if (index < 0 || index >= images.length) return;

            currentIndex = index;
            currentImage = new Image();
            currentImage.onload = () => {
                // 计算缩放比例，最大宽度900px
                const maxWidth = 900;
                const scale = currentImage.width > maxWidth ? maxWidth / currentImage.width : 1;

                canvas.width = currentImage.width * scale;
                canvas.height = currentImage.height * scale;

                drawImage();
            };
            currentImage.src = images[index].url;
        }

        function drawImage() {
            if (!currentImage) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 计算缩放
            const scale = canvas.width / currentImage.width;

            // 绘制图片
            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

            // 绘制已保存的框
            const imageName = images[currentIndex].name;
            if (boxes[imageName]) {
                boxes[imageName].forEach((box, i) => {
                    drawBox(box.x * scale, box.y * scale, box.w * scale, box.h * scale, box.class, i);
                });
            }

            // 绘制正在绘制的框
            if (currentBox) {
                drawBox(currentBox.x, currentBox.y, currentBox.w, currentBox.h, 0, -1, true);
            }
        }

        function drawBox(x, y, w, h, classId, index, isTemp = false) {
            ctx.strokeStyle = colors[classId] || '#00ff00';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);

            // 填充半透明
            ctx.fillStyle = (colors[classId] || '#00ff00') + '20';
            ctx.fillRect(x, y, w, h);

            // 标签
            if (!isTemp) {
                ctx.fillStyle = colors[classId];
                ctx.font = '12px Arial';
                const label = `${classNames[classId]} #${index + 1}`;
                const textWidth = ctx.measureText(label).width;
                ctx.fillRect(x, y - 18, textWidth + 6, 18);
                ctx.fillStyle = '#000';
                ctx.fillText(label, x + 3, y - 5);
            }
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDrawing = true;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            currentBox = {
                x: Math.min(startX, currentX),
                y: Math.min(startY, currentY),
                w: Math.abs(currentX - startX),
                h: Math.abs(currentY - startY)
            };

            drawImage();
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing || !currentBox) return;
            isDrawing = false;

            // 最小尺寸检查
            if (currentBox.w > 10 && currentBox.h > 10) {
                const imageName = images[currentIndex].name;
                if (!boxes[imageName]) boxes[imageName] = [];

                // 转换为原始坐标（相对于原图）
                const scale = currentImage.width / canvas.width;
                boxes[imageName].push({
                    x: currentBox.x * scale,
                    y: currentBox.y * scale,
                    w: currentBox.w * scale,
                    h: currentBox.h * scale,
                    class: parseInt(document.getElementById('classSelect').value)
                });

                updateUI();
            }

            currentBox = null;
            drawImage();
        });

        // 切换图片
        document.getElementById('prevBtn').addEventListener('click', () => navigate(-1));
        document.getElementById('nextBtn').addEventListener('click', () => navigate(1));

        function navigate(delta) {
            const newIndex = currentIndex + delta;
            if (newIndex >= 0 && newIndex < images.length) {
                loadImage(newIndex).then(updateUI);
            }
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                navigate(-1);
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                navigate(1);
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                deleteLastBox();
            }
        });

        // 删除最后一个框
        function deleteLastBox() {
            const imageName = images[currentIndex].name;
            if (boxes[imageName] && boxes[imageName].length > 0) {
                boxes[imageName].pop();
                drawImage();
                updateUI();
            }
        }

        document.getElementById('deleteBtn').addEventListener('click', deleteLastBox);

        // 清除当前图片标注
        document.getElementById('clearBtn').addEventListener('click', () => {
            const imageName = images[currentIndex].name;
            boxes[imageName] = [];
            drawImage();
            updateUI();
        });

        // 更新UI
        function updateUI() {
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === images.length - 1;
            document.getElementById('currentImage').textContent = images.length > 0
                ? `${currentIndex + 1}/${images.length}: ${images[currentIndex].name}`
                : '-';

            // 统计
            const labeledCount = Object.keys(boxes).filter(k => boxes[k].length > 0).length;
            document.getElementById('labeledCount').textContent = labeledCount;
            document.getElementById('totalCount').textContent = images.length;
            document.getElementById('progressFill').style.width = `${(labeledCount / images.length) * 100}%`;

            // 更新框信息
            const imageName = images[currentIndex]?.name;
            const imageBoxes = boxes[imageName] || [];
            document.getElementById('boxInfo').innerHTML = imageBoxes.length > 0
                ? `<b>当前标注:</b><br>${imageBoxes.map((b, i) =>
                    `框${i+1}: x=${Math.round(b.x)} y=${Math.round(b.y)} w=${Math.round(b.w)} h=${Math.round(b.h)}`
                ).join('<br>')}`
                : '<b>当前标注:</b> 无';

            // 更新图片列表
            const listHtml = images.map((img, i) => {
                const isLabeled = boxes[img.name]?.length > 0;
                const isCurrent = i === currentIndex;
                const classes = ['image-item'];
                if (isLabeled) classes.push('labeled');
                if (isCurrent) classes.push('current');
                return `<div class="${classes.join(' ')}" onclick="loadImage(${i}).then(updateUI)">${img.name.slice(6, 12)}</div>`;
            }).join('');
            document.getElementById('imageList').innerHTML = listHtml;
        }

        // 导出YOLO格式 - 保存到服务器
        document.getElementById('exportBtn').addEventListener('click', async () => {
            const labeledImages = Object.keys(boxes).filter(k => boxes[k].length > 0);

            if (labeledImages.length === 0) {
                alert('没有标注数据可以导出！');
                return;
            }

            document.getElementById('statusText').textContent = '正在保存到服务器...';

            // 准备数据
            const exportData = {};
            for (const imageName of labeledImages) {
                const imageBoxes = boxes[imageName];
                const imageFile = images.find(img => img.name === imageName);

                if (imageFile && currentImage) {
                    const labelContent = imageBoxes.map(b => {
                        const x_center = (b.x + b.w / 2) / currentImage.width;
                        const y_center = (b.y + b.h / 2) / currentImage.height;
                        const width = b.w / currentImage.width;
                        const height = b.h / currentImage.height;
                        return `${b.class} ${x_center.toFixed(6)} ${y_center.toFixed(6)} ${width.toFixed(6)} ${height.toFixed(6)}`;
                    }).join('\n');
                    exportData[imageName] = labelContent;
                }
            }

            try {
                const response = await fetch('/api/save_yolo_labels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        labels: exportData,
                        dataset_path: 'data/dataset'
                    })
                });

                const result = await response.json();
                if (result.success) {
                    document.getElementById('statusText').textContent = `已保存！训练集: ${result.train_count}, 验证集: ${result.val_count}`;
                    alert(`保存成功！\n\n训练集: ${result.train_count} 张\n验证集: ${result.val_count} 张\n\n数据已保存到: ${result.dataset_path}`);
                } else {
                    alert('保存失败: ' + result.error);
                }
            } catch (e) {
                console.error('保存失败:', e);
                document.getElementById('statusText').textContent = '保存失败';
                alert('保存失败，请检查后端服务');
            }
        });

        // 一键YOLO标注当前图片
        document.getElementById('autoLabelBtn').addEventListener('click', async () => {
            if (!currentImage) {
                alert('请先加载图片');
                return;
            }

            document.getElementById('statusText').textContent = '正在YOLO检测...';

            try {
                const response = await fetch('/api/yolo_detect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image_url: images[currentIndex].url,
                        confidence: 0.01
                    })
                });

                const result = await response.json();

                if (result.boxes && result.boxes.length > 0) {
                    // 取置信度最高的框
                    const bestBox = result.boxes[0];
                    boxes[images[currentIndex].name] = [{
                        class: 0,
                        x: bestBox.x1,
                        y: bestBox.y1,
                        w: bestBox.x2 - bestBox.x1,
                        h: bestBox.y2 - bestBox.y1,
                        conf: bestBox.conf
                    }];
                    drawCanvas();
                    updateUI();
                    document.getElementById('statusText').textContent = `已标注！置信度: ${bestBox.conf.toFixed(1)}%`;
                } else {
                    document.getElementById('statusText').textContent = '未检测到任务栏';
                    alert('未检测到任务栏，请手动标注');
                }
            } catch (e) {
                console.error('检测失败:', e);
                document.getElementById('statusText').textContent = '检测失败';
            }
        });

        // 一键标注所有图片
        document.getElementById('autoLabelAllBtn').addEventListener('click', async () => {
            if (images.length === 0) {
                alert('请先加载图片');
                return;
            }

            document.getElementById('statusText').textContent = '正在批量标注...';

            let labeledCount = 0;
            for (let i = 0; i < images.length; i++) {
                const imageName = images[i].name;

                // 如果已有标注，跳过
                if (boxes[imageName] && boxes[imageName].length > 0) {
                    continue;
                }

                try {
                    const response = await fetch('/api/yolo_detect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image_url: images[i].url,
                            confidence: 0.01
                        })
                    });

                    const result = await response.json();

                    if (result.boxes && result.boxes.length > 0) {
                        const bestBox = result.boxes[0];
                        boxes[imageName] = [{
                            class: 0,
                            x: bestBox.x1,
                            y: bestBox.y1,
                            w: bestBox.x2 - bestBox.x1,
                            h: bestBox.y2 - bestBox.y1,
                            conf: bestBox.conf
                        }];
                        labeledCount++;
                    }
                } catch (e) {
                    console.error(`标注失败 ${imageName}:`, e);
                }

                // 更新进度
                document.getElementById('statusText').textContent = `正在标注... ${i + 1}/${images.length}`;
            }

            updateUI();
            document.getElementById('statusText').textContent = `完成！新标注 ${labeledCount} 张`;

            if (labeledCount > 0) {
                alert(`一键标注完成！\n\n新标注: ${labeledCount} 张\n总共: ${Object.keys(boxes).filter(k => boxes[k].length > 0).length} 张\n\n请检查标注是否正确，然后点击"保存到服务器"`);
            } else {
                alert('没有新标注（可能都已标注或检测失败）');
            }
        });
    </script>
</body>
</html>
